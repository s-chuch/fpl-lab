<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bacalhau · FPL Lab</title>
<style>
:root{--bg:#070B10;--card:#101820;--ink:#F3F6F8;--muted:#8B95A1;--line:#1E2A36;--teal:#1B7F6E;--gold:#C9A227;--red:#E85D4C;--green:#3DDC97;--yellow:#E6C35C}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{padding:16px 14px 64px;max-width:980px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-size:28px;margin:6px 0 4px}.sub{color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:22px}.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase}
.tabs{display:flex;gap:6px;overflow:auto;padding:6px 0 14px;position:sticky;top:0;background:var(--bg);z-index:5}
.tabs button{border:1px solid var(--line);background:#0C141C;color:var(--ink);border-radius:999px;padding:8px 12px;font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--teal);border-color:var(--teal);font-weight:700}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 10px}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px;text-transform:uppercase}
.pos{color:var(--green);font-weight:700}.neg{color:var(--red);font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700}
.pill.used{background:#3a1d1a;color:#ffb4a8}.pill.free{background:#16352e;color:#7dffc8}
.xi{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#0C141C;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.chip.sit{opacity:.55}.note{font-size:13px;color:var(--muted);line-height:1.45}
.warn{background:#2a2010;border:1px solid #5a4520;color:#f3d7a1;border-radius:12px;padding:12px;font-size:13px;margin:0 0 12px}
footer{margin-top:22px;color:var(--muted);font-size:12px}footer a{color:var(--gold)}
.chiplist{list-style:none;margin:0;padding:0}
.chiplist li{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.chiplist li:last-child{border-bottom:0}
.chiplist .who{font-weight:700}.chiplist .detail{width:100%;color:var(--muted);font-size:13px;margin-top:4px}
.barrow{display:grid;grid-template-columns:92px 1fr 36px;gap:8px;align-items:center;margin:6px 0;font-size:12px;color:var(--muted)}
.track{height:8px;background:#0C141C;border-radius:99px;overflow:hidden}
.track span{display:block;height:100%;background:var(--teal)}
.track span.bad{background:var(--red)}.track span.mid{background:var(--yellow)}
</style></head><body>
<header><div class="eyebrow">FPL Lab · Bacalhau · 1360920</div>
<h1 id="teamName">Bacalhau</h1><div class="sub" id="meta"></div></header>
<div class="kpis" id="kpis"></div><nav class="tabs" id="tabs"></nav>
<section id="season" class="on"></section><section id="bench"></section><section id="transfers"></section>
<section id="plan"></section><section id="leagues"></section><section id="chips"></section>
<footer id="foot"></footer>
<script src="bacalhau-data.js"></script>
<script>
const D=window.FPL_DATA||{team:{},gameweeks:[],plan:{},leagues:{},chips_official:{}};
const fmt=n=>n==null?"-":Number(n).toLocaleString();
const sign=n=>n==null?"-":(n>0?"+"+n:String(n));
const cls=n=>n==null?"":n>0?"pos":n<0?"neg":"";
document.getElementById("teamName").textContent=(D.team&&D.team.name)||"Bacalhau";
document.getElementById("meta").textContent=((D.team&&D.team.manager)||"")+" · ID "+((D.team&&D.team.id)||1360920)+" · updated "+(D.generated_at||"pending");
document.getElementById("kpis").innerHTML=[["Season points",(D.team&&D.team.overall_points)||"-"],["Overall rank",fmt(D.team&&D.team.overall_rank)],["Squad value",D.team&&D.team.value!=null?"£"+Number(D.team.value).toFixed(1)+"m":"-"],["Bank",D.team&&D.team.bank!=null?"£"+Number(D.team.bank).toFixed(1)+"m":"-"]].map(([k,v])=>`<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join("");
const tabs=[["season","Season"],["bench","Bench"],["transfers","Transfers"],["plan","Next 2 GWs"],["leagues","Leagues"],["chips","Chips"]];
document.getElementById("tabs").innerHTML=tabs.map(([id,label],i)=>`<button class="${i===0?"on":""}" data-id="${id}">${label}</button>`).join("");
document.getElementById("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===b.dataset.id));};
function gwTable(){const rows=(D.gameweeks||[]).map(g=>{const chip=g.chip?` <span class="pill used">${g.chip}</span>`:"";return `<tr><td>GW${g.gw}${chip}</td><td><b>${g.points}</b></td><td>${g.field_avg??"-"}</td><td class="${cls(g.delta)}">${sign(g.delta)}</td><td>${g.bench}</td><td>${g.transfers}</td><td>${fmt(g.rank)}</td></tr>`;}).join("");return `<div class="card"><h2>Gameweek log</h2><table><thead><tr><th>GW</th><th>Pts</th><th>Field</th><th>d</th><th>Bench</th><th>Tr</th><th>OR</th></tr></thead><tbody>${rows||"<tr><td colspan=7>Waiting for refresh.</td></tr>"}</tbody></table></div>`;}
function capCard(){
  const rows=D.captain_audit||[];
  if(!rows.length) return `<div class="card"><h2>Captaincy</h2><p class="note">Waiting for refresh.</p></div>`;
  const max=Math.max(...rows.map(r=>Math.max(r.got,r.got-r.vs_best,1)));
  const body=rows.map(r=>{
    const bestGot=r.got-r.vs_best; const vcGot=r.got-r.vs_vc;
    return `<div style="margin:12px 0 16px"><b>GW${r.gw} · ${r.captain}</b> <span class="note">got ${r.got} · VC ${r.vc} · best ${r.best}</span>
      <div class="barrow"><span>They</span><div class="track"><span style="width:${100*r.got/max}%"></span></div><b>${r.got}</b></div>
      <div class="barrow"><span>If VC</span><div class="track"><span class="mid" style="width:${100*vcGot/max}%"></span></div><b class="${cls(r.vs_vc)}">${sign(r.vs_vc)}</b></div>
      <div class="barrow"><span>If best</span><div class="track"><span class="${r.vs_best<0?"bad":""}" style="width:${100*bestGot/max}%"></span></div><b class="${cls(r.vs_best)}">${sign(r.vs_best)}</b></div></div>`;
  }).join("");
  return `<div class="card"><h2>Captaincy differentials</h2>${body}</div>`;
}
document.getElementById("season").innerHTML=gwTable()+capCard();
document.getElementById("bench").innerHTML=`<div class="card"><h2>Bench</h2><p class="note">Live bench points are in the Season log. A process/variance audit for this team is not filled in yet.</p></div>`;
document.getElementById("transfers").innerHTML=`<div class="card"><h2>Transfers</h2><p class="note">${(D.transfers&&D.transfers.length)?"": "Transfer-by-transfer verdicts are not filled in yet. Season log shows how many they made each GW."}</p><table><thead><tr><th>GW</th><th>Move</th><th>Net</th><th>Verdict</th></tr></thead><tbody>${(D.transfers||[]).map(t=>`<tr><td>GW${t.gw??"-"}</td><td>${t.out} → ${t.inn}</td><td>${t.net||"-"}</td><td>${t.verdict||""}</td></tr>`).join("")}</tbody></table></div>`;
function renderPlan(){
  const P=D.plan||{},up=P.upcoming||[];
  if(!up.length){document.getElementById("plan").innerHTML=`<div class="warn">Waiting for refresh.</div>`;return;}
  const heads=up.map(u=>`<th>GW${u.gw}</th>`).join("");
  const rows=(P.rows||[]).map(r=>{
    let c=`<td>${r[0]}</td><td>${r[1]}</td>`;
    for(let i=0;i<up.length;i++){
      const xi=((P.xis||{})["gw"+up[i].gw]||{}).xi||[];
      const started=new Set(xi.map(n=>String(n).split(" (")[0]));
      const call=started.has(r[1])?"START":(String(r[3+i*3])==="Blank"?"BLANK":"SIT");
      c+=`<td>${r[3+i*3]} <b class="${call==="START"?"pos":"neg"}">${call}</b></td>`;
    }
    return `<tr>${c}</tr>`;
  }).join("");
  const T=P.transfer||{}; const move=T.move;
  const actionLine=T.action==="TRANSFER"&&move?`${move.out} → ${move.inn}`:"Roll the free transfer";
  const benches=(P.bench_calls||[]).map(b=>`<div class="card"><h2>GW${b.gw} bench</h2><p class="note">Sit first: <b>${b.worst||"-"}</b> · ${b.why||""}</p><div class="xi">${(b.sit||[]).map(x=>`<div class="chip sit">${x}</div>`).join("")}</div></div>`).join("");
  document.getElementById("plan").innerHTML=`<div class="card"><h2>Transfer · ${T.action||"ROLL"} · ${T.ft_available??"?"} FT</h2><p class="note"><b>${actionLine}</b></p><p class="note">${T.reason||""}</p></div>${benches}<div class="card"><h2>Fixtures</h2><p class="note">START is the 11 in the suggested XI.</p><table><thead><tr><th>Pos</th><th>Player</th>${heads}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
renderPlan();
function renderLeagues(){
  const L=D.leagues||{};
  let mini="";
  for(const lg of(L.mini||[])){
    const table=(lg.table||[]).map(r=>`<tr class="${r.me?"pos":""}"><td>${r.rank}</td><td>${r.team}${r.me?" · them":""}</td><td>${r.pts}</td></tr>`).join("");
    const templ=(lg.template||[]).map(x=>`<div class="chip">${x.name} · ${x.club} · ${x.count}/${x.n} (${x.own}%)</div>`).join("")||`<p class="note">They own the league template.</p>`;
    const diffs=(lg.diffs||[]).map(x=>`<div class="chip">${x.name} · ${x.club} · ${x.count}/${x.n} (${x.own}%)</div>`).join("")||`<p class="note">No low-owned picks here.</p>`;
    mini+=`<div class="card"><h2>${lg.name} · ${lg.size} teams · they P${lg.rank}</h2><table><thead><tr><th>#</th><th>Team</th><th>Pts</th></tr></thead><tbody>${table}</tbody></table><p class="note">Template missing (40%+)</p><div class="xi">${templ}</div><p class="note">Their differentials (≤25%)</p><div class="xi">${diffs}</div></div>`;
  }
  const ov=(L.public||[]).find(p=>p.id===314)||{rank:D.team&&D.team.overall_rank};
  const ot=(L.overall_template||[]).map(x=>`<div class="chip">${x.name} · ${x.club} · ${x.own}%</div>`).join("")||`<p class="note">They own the overall template.</p>`;
  const od=(L.overall_diffs||[]).map(x=>`<div class="chip">${x.name} · ${x.club} · ${x.own}%</div>`).join("")||`<p class="note">No overall diffs under 12%.</p>`;
  document.getElementById("leagues").innerHTML=`<div class="card"><h2>Overall</h2><p class="note">Rank <b>${fmt(ov.rank)}</b> · ${(D.team&&D.team.overall_points)||"-"} pts</p><p class="note">Template missing</p><div class="xi">${ot}</div><p class="note">Differentials they own</p><div class="xi">${od}</div></div>${mini}`;
}
renderLeagues();
const co=D.chips_official||{};
function chipRow(label,key){const gw=co[key];const used=gw!=null;return `<li><span class="who">${label}</span><span>${used?`<span class="pill used">Used GW${gw}</span>`:`<span class="pill free">Not used</span>`}</span></li>`;}
document.getElementById("chips").innerHTML=`<div class="card"><h2>Chips</h2><ul class="chiplist">${chipRow("Bench Boost","bboost")}${chipRow("Triple Captain","3xc")}${chipRow("Free Hit","freehit")}${chipRow("Wildcard","wildcard")}</ul></div>`;
document.getElementById("foot").innerHTML=`<a href="index.html">Shaaland lab</a> · Bacalhau 1360920 · ESL + Momo Cup`;
</script></body></html>
