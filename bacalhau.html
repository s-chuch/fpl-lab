<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bacalhau · FPL Lab</title>
<link rel="stylesheet" href="dashboard.css?v=20260920b">
<style>footer a{color:var(--gold)}</style></head><body>
<header><div class="eyebrow">FPL Performance Lab</div><h1 id="teamName">Bacalhau</h1><div class="sub" id="meta"></div></header>
<div class="kpis" id="kpis"></div>
<div class="deadline-bar" id="deadlineBanner"></div><div id="chipAlert"></div>
<nav class="tabs" id="tabs"></nav>
<section id="season" class="on"></section><section id="bench"></section><section id="transfers"></section>
<section id="plan"></section><section id="wildcard"></section><section id="strategy"></section><section id="stratFixtures"></section><section id="stratPlayers"></section><section id="stratValue"></section><section id="stratPrice"></section><section id="leagues"></section><section id="news"></section><section id="xtab"></section><section id="greekgod"></section><section id="fh"></section><section id="chips"></section>
<footer id="foot"></footer>
<script src="dashboard-common.js?v=20260920e"></script>
<script src="bacalhau-data.js?v=20260917i"></script>
<script src="news.js?v=20260917i"></script>
<script src="x-posts.js?v=20260917i"></script>
<script src="greekgod-archive.js?v=20260920a"></script>
<script src="bacalhau-wildcard.js?v=20260920a"></script>
<script>
const D=window.FPL_DATA;
document.getElementById("teamName").textContent=D.team.name;
document.getElementById("meta").textContent=D.team.manager+" · ID "+D.team.id+" · updated "+toToronto(D.generated_at);
document.getElementById("kpis").innerHTML=[["Season points",D.team.overall_points],["Overall rank",fmt(D.team.overall_rank)],["Squad value","£"+Number(D.team.value).toFixed(1)+"m"],["Bank","£"+Number(D.team.bank).toFixed(1)+"m"]].map(([k,v])=>`<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join("");
startDeadlineBanner(D,"deadlineBanner");
document.getElementById("chipAlert").innerHTML=chipAlertBanner(D);
const TAB_GROUPS=[
  {id:"review",label:"Review",tabs:[["season","Season"],["bench","Bench"],["transfers","Transfers"],["chips","Chips"]]},
  {id:"plan",label:"Plan",tabs:[["plan","Next 2 GWs"],["fh","Free Hit"],["wildcard","Wildcard"]]},
  {id:"strategy",label:"Strategy",tabs:[["strategy","Chips & Hits"],["stratFixtures","Fixtures"],["stratPlayers","Player signals"],["stratValue","Value"],["stratPrice","Price radar"]]},
  {id:"intel",label:"Intel",tabs:[["news","News"],["xtab","X"],["greekgod","GreekGod"]]},
  {id:"league",label:"Leagues",tabs:[["leagues","Leagues"]]}
];
let activeGroup="review", activeTab="season";
function paintTabs(){
  const g=TAB_GROUPS.find(x=>x.id===activeGroup)||TAB_GROUPS[0];
  const groups=TAB_GROUPS.map(x=>`<button class="group ${x.id===activeGroup?"on":""}" data-group="${x.id}">${x.label}</button>`).join("");
  // A group with only one tab has nothing to switch between, so the pill row
  // is just a lone, oddly-small-looking button — skip it for single-tab
  // groups (e.g. Leagues) instead of rendering a selector with one option.
  const pills=g.tabs.length>1?`<div class="tab-pills">${g.tabs.map(([id,label])=>`<button class="${id===activeTab?"on":""}" data-id="${id}">${label}</button>`).join("")}</div>`:"";
  document.getElementById("tabs").innerHTML=`<div class="tab-groups">${groups}</div>${pills}`;
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===activeTab));
}
document.getElementById("tabs").onclick=e=>{const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.group){activeGroup=b.dataset.group; const first=(TAB_GROUPS.find(x=>x.id===activeGroup)||{}).tabs||[]; if(!first.some(t=>t[0]===activeTab)) activeTab=first[0][0];}
  else if(b.dataset.id){activeTab=b.dataset.id; const owner=TAB_GROUPS.find(x=>x.tabs.some(t=>t[0]===activeTab)); if(owner) activeGroup=owner.id;}
  paintTabs();};
paintTabs();
function gwTable(){const rows=D.gameweeks.map(g=>{const chip=g.chip?` <span class="pill used">${esc(g.chip)}</span>`:"";return `<tr><td>GW${g.gw}${chip}</td><td><b>${g.points}</b></td><td>${g.field_avg??"-"}</td><td class="${cls(g.delta)}">${sign(g.delta)}</td><td>${g.bench}</td><td>${g.transfers}</td><td>${fmt(g.rank)}</td></tr>`;}).join("");return `<div class="card"><h2>Gameweek log</h2><table><thead><tr><th>GW</th><th>Pts</th><th>Field</th><th>d</th><th>Bench</th><th>Tr</th><th>OR</th></tr></thead><tbody>${rows}</tbody></table></div>`;}
document.getElementById("season").innerHTML=gwTable();
function bar(label,val,max,klass){const pct=Math.max(4,Math.round(100*val/Math.max(max,1)));return `<div class="barrow"><span>${label}</span><div class="track"><i class="${klass||""}" style="width:${pct}%"></i></div><b>${val}</b></div>`;}
function chipClass(gw,name){const t=((D.bench_audit&&D.bench_audit[gw]&&D.bench_audit[gw].bench_tags)||{})[name];return t?"chip "+t:"chip sit";}
function benchBlock(key,title){
  const b=D.bench_audit&&D.bench_audit[key]; if(!b)return"";
  const max=Math.max(b.you,b.process,b.hindsight,1);
  const yours=(b.your_bench||[]).map(x=>`<div class="${chipClass(key,x[0])}">${esc(x[0])} · ${x[1]}</div>`).join("");
  const should=(b.better_bench||[]).map(x=>`<div class="chip ok">${esc(x[0])} · ${x[1]}</div>`).join("");
  // "They" is the only bar that's a judgment: green if they matched/beat the
  // process benchmark (the best XI knowable pre-deadline), red if they fell
  // short of it. Process/Hindsight are reference lines, not verdicts — in
  // particular Hindsight is pure outcome (unknowable in advance), so coloring
  // it "bad" would imply they should have hit an unhittable target.
  const theyKls=b.you>=b.process?"good":"bad";
  return `<div class="card"><h2>${title}</h2>${bar("They",b.you,max,theyKls)}${bar("Process",b.process,max)}${bar("Hindsight",b.hindsight,max)}<p class="note">Their bench</p><div class="xi">${yours}</div><p class="note">Should have benched</p><div class="xi">${should}</div></div>`;
}
const benchKeys=Object.keys(D.bench_audit||{}).sort((a,b)=>Number(String(a).replace(/\D/g,""))-Number(String(b).replace(/\D/g,"")));
document.getElementById("bench").innerHTML=(benchKeys.length?benchKeys.map(k=>benchBlock(k,k.toUpperCase())).join(""):`<div class="card"><h2>Bench audit</h2><p class="note">No finished GW bench audit yet.</p></div>`)+`<p class="note">Bars: green They = matched or beat the process benchmark, red They = fell short of it. Process/Hindsight are reference lines, not verdicts. Chips: green = correct sit. Red = process miss. Yellow = variance.</p>`;
function renderTransfers(){
  const rows=D.transfers||[];
  const total=rows.reduce((s,t)=>s+trNet(t),0);
  const by={}; for(const t of rows){const g=t.gw??"?"; by[g]=(by[g]||0)+trNet(t);}
  const gwLines=Object.keys(by).sort((a,b)=>Number(a)-Number(b)).map(g=>`<div class="chip">GW${g} · <b class="${cls(by[g])}">${sign(by[g])}</b></div>`).join("");
  const body=rows.map(t=>`<tr><td>GW${t.gw??"-"}</td><td>${esc(t.out)} → ${esc(t.inn)}</td><td class="${cls(trNet(t))}">${esc(t.net)}</td><td>${esc(t.verdict||"")}</td></tr>`).join("");
  document.getElementById("transfers").innerHTML=rows.length
    ?`<div class="card"><h2>Transfer points</h2><p class="note">Season net <b class="${cls(total)}">${sign(total)}</b></p><div class="xi">${gwLines}</div></div><div class="card"><h2>Transfers</h2><table><thead><tr><th>GW</th><th>Move</th><th>Net</th><th>Verdict</th></tr></thead><tbody>${body}</tbody></table></div>`
    :`<div class="card"><h2>Transfers</h2><p class="note">No transfer-by-transfer list yet.</p></div>`;
}
renderTransfers();
function newsCard(title, vs){
  const li=(arr,empty)=>arr.length?arr.map(raw=>{const x=esc(raw);return `<li><span class="who">${x.split(" · ")[0]}</span><div class="detail">${x.includes(" · ")?x.split(" · ").slice(1).join(" · "):x}</div></li>`;}).join(""):`<li><span class="note">${empty}</span></li>`;
  const cap=vs.caps[0]?`<p class="note">Captain check: ${esc(vs.caps[0])}</p>`:"";
  return `<div class="card"><h2>${title}</h2><p class="note">Own and agreed</p><ul class="chiplist">${li(vs.owned,"None of the agreed names are in this squad.")}</ul><p class="note">Missing and agreed</p><ul class="chiplist">${li(vs.missing,"They already own the agreed targets, or none were named.")}</ul><p class="note">Fade, but they still start them</p><ul class="chiplist">${li(vs.fade,"No fade conflict.")}</ul>${cap}</div>`;
}
function renderPlan(){
  const P=D.plan||{},up=P.upcoming||[];
  if(!up.length){document.getElementById("plan").innerHTML=`<div class="warn">Waiting for refresh.</div>`;return;}
  const heads=up.map(u=>`<th>GW${u.gw}</th>`).join("");
  const avail=P.availability||{};
  const rows=(P.rows||[]).map(r=>{
    const a=avail[r[1]]||null;
    const badge=a&&a.label?` <span class="pill used">${esc(a.label)}</span>`:"";
    let c=`<td>${esc(r[0])}</td><td>${esc(r[1])}${badge}</td>`;
    for(let i=0;i<up.length;i++){
      const xi=((P.xis||{})["gw"+up[i].gw]||{}).xi||[];
      const started=new Set(xi.map(n=>String(n).split(" (")[0]));
      let call=String(r[3+i*3])==="Blank"?"BLANK":(started.has(r[1])?"START":"SIT");
      c+=`<td>${esc(r[3+i*3])} <b class="${call==="START"?"pos":"neg"}">${call}</b></td>`;
    }
    return `<tr>${c}</tr>`;
  }).join("");
  const T=P.transfer||{}; const move=T.move;
  const actionLine=T.action==="TRANSFER"&&move?`${esc(move.out)} → ${esc(move.inn)}`:"Roll the free transfer";
  const squad=(P.rows||[]).map(r=>r[1]); const clubs={}; (P.rows||[]).forEach(r=>clubs[r[1]]=r[2]);
  const gw0=up[0]&&up[0].gw; const started=((((P.xis||{})["gw"+gw0]||{}).xi)||[]).map(n=>String(n).split(" (")[0]);
  const vs=newsVsSquad(squad, started, clubs);
  const benches=(P.bench_calls||[]).map(b=>`<div class="card"><h2>GW${b.gw} bench</h2><p class="note">Sit first: <b>${esc(b.worst||"-")}</b> · ${esc(b.why||"")}</p><div class="xi">${(b.sit||[]).map(x=>`<div class="chip sit">${esc(x)}</div>`).join("")}</div></div>`).join("");
  const transferCard=`<div class="card"><h2>Transfer · ${esc(T.action||"ROLL")} · ${T.ft_available??"?"} FT · bank £${Number(D.team.bank).toFixed(1)}</h2><p class="note"><b>${esc(actionLine)}</b></p><p class="note">${esc(T.reason||"")}</p></div>`;
  const injuryNote=Object.keys(avail).length?`<p class="note">Availability from FPL: ${esc(Object.entries(avail).map(([n,a])=>n+" "+(a.label||a.kind)).join(" · "))}</p>`:`<p class="note">No injury flags in current Bacalhau plan data.</p>`;
  const TT=D.transfer_targets||{};
  const ttXgRows=(TT.xg||[]).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.pos)}</td><td>${esc(r.club)}</td><td>£${r.cost.toFixed(1)}</td><td>${r.owned_pct}%</td><td>${r.xgi_p90}</td><td>${r.goals}+${r.assists}</td></tr>`).join("")||`<tr><td colspan="7"><span class="note">No qualifying non-owned players yet.</span></td></tr>`;
  const ttDcRows=(TT.defcon||[]).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.pos)}</td><td>${esc(r.club)}</td><td>£${r.cost.toFixed(1)}</td><td>${r.owned_pct}%</td><td>${r.per90}/${r.threshold}</td></tr>`).join("")||`<tr><td colspan="6"><span class="note">No non-owned players reliably hitting the threshold yet.</span></td></tr>`;
  const targetsCard=`<div class="card"><h2>Transfer targets · not owned</h2><p class="note">Players Bacalhau doesn't currently own (${TT.min_minutes??"?"}+ mins) with strong underlying numbers — the same signals used to audit their squad, scouted league-wide instead.</p><h3>Strong underlying (xGI per 90)</h3><table class="table-compact"><thead><tr><th style="width:26%">Player</th><th style="width:10%">Pos</th><th style="width:12%">Club</th><th style="width:11%">Cost</th><th style="width:11%">Own</th><th style="width:15%">xGI/90</th><th style="width:15%">G+A</th></tr></thead><tbody>${ttXgRows}</tbody></table><h3>Reliable DEFCON</h3><table class="table-compact"><thead><tr><th style="width:28%">Player</th><th style="width:12%">Pos</th><th style="width:14%">Club</th><th style="width:12%">Cost</th><th style="width:12%">Own</th><th style="width:22%">P90/Thr</th></tr></thead><tbody>${ttDcRows}</tbody></table></div>`;
  const W=window.FPL_WILDCARD_WATCH;
  const wildcardNote=(W&&W.chips&&W.chips.wildcard==="active")?`<div class="warn">Bacalhau has Wildcard <b>active</b> for GW${W.gw} (${esc(W.status)} — captured ${esc(W.captured_at)}). See the Wildcard tab for the squad.</div>`:"";
  document.getElementById("plan").innerHTML=`${wildcardNote}${transferCard}${newsCard("News + X vs Bacalhau",vs)}${benches}<div class="card"><h2>Fixtures</h2>${injuryNote}<table><thead><tr><th>Pos</th><th>Player</th>${heads}</tr></thead><tbody>${rows}</tbody></table></div>${targetsCard}`;
}
renderPlan();
function renderWildcardWatch(){
  const W=window.FPL_WILDCARD_WATCH;
  if(!W){document.getElementById("wildcard").innerHTML=`<div class="card"><h2>Wildcard watch</h2><p class="note">No wildcard squad captured yet.</p></div>`;return;}
  const R=W.recommend||null;
  const epByName={};
  if(R){(R.xi_ep||[]).concat(R.bench_ep||[]).forEach(p=>epByName[p.name]=p);}
  const statusKls={out:"neg",doubt:"mid"};
  const head=`<thead><tr><th style="width:11%">Pos</th><th style="width:29%">Player</th><th style="width:12%">Club</th><th style="width:26%">Fixture</th><th style="width:22%">EP</th></tr></thead>`;
  const row=p=>{
    const rp=epByName[p.name];
    const epVal=rp&&rp.ep_next!=null?rp.ep_next:"–";
    const kls=rp?(statusKls[rp.status]||""):"";
    const tag=p.captain?` <span class="pill used">C</span>`:p.vice?` <span class="pill free">VC</span>`:"";
    return `<tr><td>${esc(p.pos)}</td><td>${esc(p.name)}${tag}</td><td>${esc(p.club)}</td><td>${esc(p.fixture||"")}</td><td class="${kls}">${epVal}</td></tr>`;
  };
  const xiRows=(W.xi||[]).map(row).join("")||`<tr><td colspan="5"><span class="note">No XI captured.</span></td></tr>`;
  const benchRows=(W.bench||[]).map(row).join("")||`<tr><td colspan="5"><span class="note">No bench captured.</span></td></tr>`;

  let recCard;
  if(R){
    const theirCap=(W.xi||[]).find(p=>p.captain);
    const theirCapEp=theirCap&&epByName[theirCap.name]?epByName[theirCap.name].ep_next:null;
    const capDiffers=theirCap&&R.captain&&theirCap.name!==R.captain;
    const capLine=capDiffers
      ?`<p class="note">Bacalhau captained <b>${esc(theirCap.name)}</b>${theirCapEp!=null?` (${theirCapEp} EP)`:""} — <b>${esc(R.captain)}</b> projects higher at <b>${R.captain_ep??"?"}</b> EP.</p>`
      :`<p class="note">Recommended captain matches Bacalhau's pick: <b>${esc(R.captain||"?")}</b> (${R.captain_ep??"?"} EP).</p>`;
    const viceLine=`<p class="note">Recommended vice: <b>${esc(R.vice||"?")}</b> (${R.vice_ep??"?"} EP).</p>`;
    const swapRows=(R.bench_swaps||[]).map(s=>`<li><span class="who">${esc(s.bench)} (${s.bench_ep}) over ${esc(s.starter)} (${s.starter_ep})</span><div class="detail">This bench player projects higher than a starter in the same position — worth reconsidering before the deadline.</div></li>`).join("")||`<li><span class="note">No bench player currently out-projects a starter in their position.</span></li>`;
    const flagRows=(R.availability_flags||[]).map(f=>`<li><span class="who">${esc(f.name)}</span> <span class="pill used">${esc(f.label||"Flagged")}</span></li>`).join("")||`<li><span class="note">No injury/doubt flags on this squad right now.</span></li>`;
    recCard=`<div class="card"><h2>Captain &amp; bench recommendation</h2><p class="note">Based on FPL's own ep_next (its form + fixture blended prediction for the next GW), recomputed every refresh — a pre-deadline read, not a locked call.</p>${capLine}${viceLine}<p class="note">Bench-swap watch</p><ul class="chiplist">${swapRows}</ul><p class="note">Availability flags</p><ul class="chiplist">${flagRows}</ul></div>`;
  } else {
    recCard=`<div class="card"><h2>Captain &amp; bench recommendation</h2><p class="note">Not computed yet — lands after the next refresh run.</p></div>`;
  }

  document.getElementById("wildcard").innerHTML=`<div class="warn">${esc(W.note||"Provisional squad — hand-captured from Bacalhau's own Pick Team screen, not the FPL API. Can still change before the deadline.")}</div><div class="card"><h2>${esc(W.team)}'s Wildcard · GW${W.gw}</h2><p class="note">Deadline <b>${esc(W.deadline)}</b> · Captured ${esc(W.captured_at)} · Status: <b>${esc(W.status)}</b></p><p class="note">Starting XI</p><table class="table-compact">${head}<tbody>${xiRows}</tbody></table><p class="note">Bench</p><table class="table-compact">${head}<tbody>${benchRows}</tbody></table></div>${recCard}`;
}
renderWildcardWatch();
function renderStrategy(){
  const S=D.strategy||{};
  const STATUS_LABEL={used:"Used",open:"Open now",upcoming:"Not open yet",expired:"Expired"};
  const chips=(S.chips||[]).map(c=>{
    const wins=(c.windows||[]).map(w=>{
      const label=w.status==="used"?`Used GW${w.used_gw}`:w.status==="open"?`Open now (GW${w.start}-${w.stop})`:w.status==="upcoming"?`Opens GW${w.start}`:(STATUS_LABEL[w.status]||w.status);
      const kls=w.status==="open"?"ok":w.status==="used"?"sit":"";
      return `<div class="chip ${kls}">#${w.number} · ${esc(label)}</div>`;
    }).join("");
    return `<div class="card"><h2>${esc(c.label)}</h2><div class="xi">${wins}</div></div>`;
  }).join("");
  const H=S.hits||{};
  const hitsBlock=(H.rows&&H.rows.length)
    ?`<p class="note">Total hit cost <b class="neg">-${H.total_cost}</b> · Those moves netted <b class="${cls(H.total_moves_net)}">${sign(H.total_moves_net)}</b> · After cost <b class="${cls(H.net_after_cost)}">${sign(H.net_after_cost)}</b></p><ul class="chiplist">${H.rows.map(r=>`<li><span class="who">GW${r.gw}</span><div class="detail">Cost -${r.cost} · moves netted ${sign(r.moves_net)} · <b class="${r.paid_off?"pos":"neg"}">${r.paid_off?"Paid off":"Not worth it"}</b></div></li>`).join("")}</ul>`
    :`<p class="note">No hits taken this season.</p>`;
  const F=S.fixtures||{};
  const fRows=(F.rows||[]).map(r=>{
    const flags=[(r.blanks&&r.blanks.length)?`Blank: ${r.blanks.join(", ")}`:"",(r.doubles&&r.doubles.length)?`Dbl: ${r.doubles.join(", ")}`:""].filter(Boolean).join(" · ");
    return `<tr><td>GW${r.gw}</td><td>${r.avg_fdr??"-"}</td><td>${esc(flags)||"–"}</td></tr>`;
  }).join("");
  const easiest=F.easiest?`<p class="note">Easiest run: <b>GW${F.easiest.gw}</b> (avg FDR ${F.easiest.avg_fdr}) — a good week to sit tight rather than chip.</p>`:"";
  const hardest=F.hardest?`<p class="note">Toughest stretch: <b>GW${F.hardest.gw}</b> (avg FDR ${F.hardest.avg_fdr}) — worth watching for a Free Hit.</p>`:"";
  const blankNote=F.first_blank?`<p class="note">Blank gameweek ahead: <b>GW${F.first_blank.gw}</b> — ${esc(F.first_blank.blanks.join(", "))} have no fixture.</p>`:`<p class="note">No blank gameweeks detected in this window.</p>`;
  const doubleNote=F.first_double?`<p class="note">Double gameweek ahead: <b>GW${F.first_double.gw}</b> — ${esc(F.first_double.doubles.join(", "))} play twice. Bench Boost / Triple Captain candidate.</p>`:`<p class="note">No double gameweeks detected in this window.</p>`;
  const XG=D.xg_signal||{};
  const xgRows=(XG.rows||[]).map(r=>{
    const bits=[];
    if(r.tag==="overperforming") bits.push(`<b class="neg">Overperforming</b> — sell-high risk`);
    if(r.tag==="underperforming") bits.push(`<b class="pos">Underperforming</b> — patience / buy-low`);
    if(r.gc_tag==="riding_luck") bits.push(`<b class="neg">Defense riding luck</b>`);
    if(r.gc_tag==="unlucky") bits.push(`<b class="pos">Defense unlucky</b> — could improve`);
    if(!bits.length) bits.push(`<span class="note">On track</span>`);
    const gcLine=r.xgc!=null?` · Conceded ${r.goals_conceded} vs xGC ${r.xgc}`:"";
    return `<li><span class="who">${esc(r.name)} · ${esc(r.pos)} · ${esc(r.club)}</span><div class="detail">${bits.join(" · ")}<br>G+A ${r.gi} vs xGI ${r.xgi}${gcLine}</div></li>`;
  }).join("")||`<li><span class="note">No squad players with ${XG.min_minutes??"?"}+ minutes yet.</span></li>`;
  const xgCard=`<div class="card"><h2>Underlying numbers (xG/xA)</h2><p class="note">All squad players with ${XG.min_minutes??"?"}+ mins — actual goal involvements, or for defenders/keepers goals conceded, vs FPL's own expected numbers. ${XG.threshold??2}+ difference is flagged "due for regression" or "still creating chances," not a form gut-feel.</p><ul class="chiplist">${xgRows}</ul></div>`;
  const DC=D.defcon||{};
  const dcRows=(DC.rows||[]).map(r=>{
    const tagLabel=r.tag==="reliable"?"Yes":r.tag==="borderline"?"Close":"No";
    const kls=r.tag==="reliable"?"pos":r.tag==="borderline"?"mid":"";
    return `<tr><td>${esc(r.name)}</td><td>${esc(r.pos)}</td><td>${esc(r.club)}</td><td>${r.per90}/${r.threshold}</td><td>${r.season_total??"-"}</td><td class="${kls}">${tagLabel}</td></tr>`;
  }).join("")||`<tr><td colspan="6"><span class="note">No qualifying players yet.</span></td></tr>`;
  const dcCard=`<div class="card"><h2>Defensive Contribution (DEFCON)</h2><p class="note">Squad outfield players (${DC.min_minutes??"?"}+ mins) vs the 2-pt defensive-actions threshold. "Hits it" = Yes/Close/No, based on green = reliably clears it most matches — a real differentiator most casual managers ignore.</p><table class="table-compact"><thead><tr><th style="width:30%">Player</th><th style="width:11%">Pos</th><th style="width:13%">Club</th><th style="width:19%">P90/Thr</th><th style="width:11%">Tot</th><th style="width:16%">Hits it</th></tr></thead><tbody>${dcRows}</tbody></table><p class="legend">P90/Thr = combined defensive actions per 90 min vs the threshold needed (10 for DEF, 12 for MID/FWD — clearances+blocks+interceptions+tackles, plus recoveries for MID/FWD). Tot = season total defensive actions.</p></div>`;
  const RR=D.rotation_risk||{};
  const rrGws=RR.gws||[];
  const rrTagLabel={falling:"Falling",declining:"Declining",rising:"Rising",starter:"Starter",fringe:"Fringe",mixed:"Mixed"};
  const rrKls={falling:"neg",declining:"neg",rising:"pos",mixed:"mid"};
  const rrWhy=r=>{
    if(r.reason==="injury"){const lbl=r.avail_label||"Flagged"; return `<span class="neg">${esc(lbl.replace("DOUBT ",""))}</span>`;}
    if(r.reason==="rested") return `<span class="mid">Rested</span>`;
    return "–";
  };
  const rrRows=(RR.rows||[]).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.pos)}</td><td>${esc(r.club)}</td><td>${r.minutes.join(" → ")}</td><td class="${rrKls[r.trend]||""}">${rrTagLabel[r.trend]||esc(r.trend)}</td><td>${rrWhy(r)}</td></tr>`).join("")||`<tr><td colspan="6"><span class="note">Not enough finished GWs yet for a trend.</span></td></tr>`;
  const rrNews=(RR.rows||[]).filter(r=>r.news).map(r=>`<li><span class="who">${esc(r.name)}</span><div class="detail">${esc(r.news)}</div></li>`).join("");
  const rrCard=`<div class="card"><h2>Rotation &amp; injury risk</h2><p class="note">Real-world minutes over the last ${rrGws.length||"?"} finished GWs${rrGws.length?` (GW${rrGws[0]}-GW${rrGws[rrGws.length-1]})`:""} for each squad player, cross-checked against FPL's own injury/suspension status — catches someone sliding out of the XI, and tells you whether it's a knock or just a rotation call, before it shows up as a bench-audit miss.</p><table class="table-compact"><thead><tr><th style="width:24%">Player</th><th style="width:11%">Pos</th><th style="width:12%">Club</th><th style="width:22%">Mins</th><th style="width:14%">Trend</th><th style="width:17%">Why</th></tr></thead><tbody>${rrRows}</tbody></table><p class="legend">Mins = minutes in each of the last ${rrGws.length||"?"} finished GWs, oldest → newest. Falling = was starting (${RR.start_mins??60}+ mins), now fringe/bench. Declining = still starting but starts getting shorter. Rising = breaking into the side. Why: a status flag (INJ/DOUBT/SUS) means the drop is explained; "Rested" means fit per FPL but dropped anyway — worth watching.</p>${rrNews?`<ul class="chiplist">${rrNews}</ul>`:""}</div>`;
  const PR=D.price_radar||{};
  const priceRow=r=>{
    const dir=r.momentum>0?"pos":r.momentum<0?"neg":"";
    const chg=r.changed_today?`<span class="${r.cost_change_today>0?"pos":"neg"}">${r.cost_change_today>0?"+":""}${r.cost_change_today.toFixed(1)}</span>`:"–";
    return `<tr><td>${esc(r.name)}</td><td>${esc(r.pos)}</td><td>${esc(r.club)}</td><td>£${r.cost.toFixed(1)}</td><td>${r.owned_pct}%</td><td class="${dir}">${r.momentum>0?"+":""}${r.momentum}%</td><td>${chg}</td></tr>`;
  };
  const priceHead=`<thead><tr><th style="width:23%">Player</th><th style="width:11%">Pos</th><th style="width:11%">Club</th><th style="width:11%">Cost</th><th style="width:13%">Own</th><th style="width:17%">NetTr</th><th style="width:14%">Chg</th></tr></thead>`;
  const squadRows=(PR.squad||[]).map(priceRow).join("")||`<tr><td colspan="7"><span class="note">No squad price data yet.</span></td></tr>`;
  const risingRows=(PR.rising||[]).map(priceRow).join("")||`<tr><td colspan="7"><span class="note">No rising candidates right now.</span></td></tr>`;
  const fallingRows=(PR.falling||[]).map(priceRow).join("")||`<tr><td colspan="7"><span class="note">No falling candidates right now.</span></td></tr>`;
  const priceCard=`<div class="deadline-bar" id="priceCountdown"></div><div class="card"><h2>Price-change radar</h2><p class="note">Approximated from today's net transfers scaled by ownership — FPL has never published its exact price-change algorithm, so treat this as relative momentum for ranking, not a guaranteed call.</p><p class="legend">Own% = ownership share. NetTr = today's net transfers (in minus out) as a % of the player's own current owners — comparable across low- and high-ownership players. Chg = price move already applied today.</p><h3>Bacalhau's squad</h3><table class="table-compact">${priceHead}<tbody>${squadRows}</tbody></table><h3>Rising · league-wide</h3><table class="table-compact">${priceHead}<tbody>${risingRows}</tbody></table><h3>Falling · league-wide</h3><table class="table-compact">${priceHead}<tbody>${fallingRows}</tbody></table></div>`;
  const VB=D.value_board||{};
  const valueHead=`<thead><tr><th style="width:26%">Player</th><th style="width:14%">Club</th><th style="width:14%">Cost</th><th style="width:14%">Pts</th><th style="width:14%">Own</th><th style="width:18%">Pts/£1m</th></tr></thead>`;
  const valueRow=r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.club)}</td><td>£${r.cost.toFixed(1)}</td><td>${r.points}</td><td>${r.owned_pct}%</td><td><b>${r.value_per_1m}</b></td></tr>`;
  const valueTables=["GKP","DEF","MID","FWD"].map(pos=>{
    const posRows=((VB.by_pos||{})[pos]||[]).map(valueRow).join("")||`<tr><td colspan="6"><span class="note">No qualifying players yet.</span></td></tr>`;
    return `<h3>${pos}</h3><table class="table-compact">${valueHead}<tbody>${posRows}</tbody></table>`;
  }).join("");
  const valueCard=`<div class="card"><h2>Best points per £1m</h2><p class="note">Top ${VB.top_n??"?"} value picks per position, league-wide (${VB.min_minutes??"?"}+ mins to filter out small-sample flukes) — recomputed every refresh from current points and price, so this moves as returns and prices change rather than being a fixed list.</p>${valueTables}</div>`;
  document.getElementById("strategy").innerHTML=`<div class="card"><h2>Free transfers</h2><p class="note">Bacalhau has <b>${S.free_transfers??"?"}</b> free transfer${S.free_transfers===1?"":"s"} banked for the next deadline.</p></div>${chips}<div class="card"><h2>Hits this season</h2>${hitsBlock}</div>`;
  document.getElementById("stratFixtures").innerHTML=`<div class="card"><h2>Fixture swing · next ${F.horizon||"?"} GWs</h2>${easiest}${hardest}${blankNote}${doubleNote}<table class="table-compact"><thead><tr><th style="width:15%">GW</th><th style="width:18%">FDR</th><th style="width:67%">Flags</th></tr></thead><tbody>${fRows}</tbody></table><p class="legend">FDR = fixture difficulty rating (1 easiest – 5 hardest), averaged across their squad's clubs playing that week.</p></div>`;
  document.getElementById("stratPlayers").innerHTML=`${xgCard}${dcCard}${rrCard}`;
  document.getElementById("stratValue").innerHTML=valueCard;
  document.getElementById("stratPrice").innerHTML=priceCard;
  startPriceCountdown("priceCountdown");
}

function renderLeagues(){
  const L=D.leagues||{};
  const want=new Set([125784,494595]);
  const names=new Set(["european super league","momo cup"]);
  const list=(L.mini||[]).filter(lg=>want.has(lg.id)||names.has(String(lg.name||"").toLowerCase()));
  let mini="";
  for(const lg of list){
    const table=(lg.table||[]).map(r=>`<tr class="${r.me?"pos":""}"><td>${r.rank}</td><td>${esc(r.team)}${r.me?" · them":""}</td><td>${r.pts}</td></tr>`).join("");
    const templ=(lg.template||[]).map(x=>`<div class="chip">${esc(x.name)} · ${esc(x.club)} · ${x.count}/${x.n} (${x.own}%)</div>`).join("")||`<p class="note">They own the league template.</p>`;
    const diffs=(lg.diffs||[]).map(x=>`<div class="chip">${esc(x.name)} · ${esc(x.club)} · ${x.count}/${x.n} (${x.own}%)</div>`).join("")||`<p class="note">No low-owned picks here.</p>`;
    const T=lg.tactics||{};
    const startDiffs=(T.you_unique||[]).map(x=>`<div class="chip ok">${esc(x.name)} · ${x.own}% owned${x.vs_first?" vs 1st":""}${x.vs_second?" vs 2nd":""}</div>`).join("")||`<p class="note">Nothing rare enough to call a real diff vs 1st/2nd right now.</p>`;
    const copy=(T.they_share||[]).map(x=>`<div class="chip sit">${esc(x.name)} · ${x.count}/${x.n}</div>`).join("")||`<p class="note">1st and 2nd do not share a name they lack.</p>`;
    const caps=esc((T.cap_last||[]).map(x=>x.name+" "+x.count).join(" · ")||"—");
    const gap=T.gap_to_first==null?"":` · ${T.gap_to_first>0?"-"+T.gap_to_first:"+"+(-T.gap_to_first)} vs 1st`;
    mini+=`<div class="card"><h2>Vs 1st & 2nd${gap}</h2><p class="note">1st: <b>${esc((T.first&&T.first.name)||"?")}</b> ${(T.first&&T.first.pts)??""}${rivalExtra(T.first,"they")}</p><p class="note">2nd: <b>${esc((T.second&&T.second.name)||"?")}</b> ${(T.second&&T.second.pts)??""}${rivalExtra(T.second,"they")}</p><p class="note">Green = their rare picks that 1st or 2nd don't own — real differentials, low league ownership</p><div class="xi">${startDiffs}</div><p class="note">Do not copy — both ahead own these</p><div class="xi">${copy}</div><p class="note">Last captains: ${caps}</p></div>`;
    if(T.neighbors){
      const Nb=T.neighbors;
      const nStart=(Nb.you_unique||[]).map(x=>`<div class="chip ok">${esc(x.name)} · ${x.own}% owned</div>`).join("")||`<p class="note">Nothing rare enough to call a real diff vs their neighbours right now.</p>`;
      const nCopy=(Nb.they_share||[]).map(x=>`<div class="chip sit">${esc(x.name)} · ${x.count}/${x.n}</div>`).join("")||`<p class="note">Their neighbours do not share a name they lack.</p>`;
      mini+=`<div class="card"><h2>Vs their neighbours</h2>${Nb.above?`<p class="note">Above (P${T.you_rank-1}): <b>${esc(Nb.above.name)}</b> ${Nb.above.pts} · ${Nb.above.gap} pts ahead${rivalExtra(Nb.above,"they")}</p>`:`<p class="note">Nobody above them.</p>`}${Nb.below?`<p class="note">Below (P${T.you_rank+1}): <b>${esc(Nb.below.name)}</b> ${Nb.below.pts} · ${Math.abs(Nb.below.gap)} pts behind${rivalExtra(Nb.below,"they")}</p>`:`<p class="note">Nobody below them.</p>`}<p class="note">Green = their rare picks that both neighbours lack</p><div class="xi">${nStart}</div><p class="note">Do not copy — both neighbours share these</p><div class="xi">${nCopy}</div></div>`;
    }
    mini+=`<div class="card"><h2>${esc(lg.name)} · ${lg.size} teams · they P${lg.rank}</h2><table><thead><tr><th>#</th><th>Team</th><th>Pts</th></tr></thead><tbody>${table}</tbody></table><p class="note">Template missing</p><div class="xi">${templ}</div><p class="note">Their differentials</p><div class="xi">${diffs}</div></div>`;
  }
  const ov=(L.public||[]).find(p=>p.id===314)||{rank:D.team&&D.team.overall_rank};
  const ot=(L.overall_template||[]).map(x=>`<div class="chip">${esc(x.name)} · ${esc(x.club)} · ${x.own}%</div>`).join("")||`<p class="note">They own the overall template (25%+).</p>`;
  const od=(L.overall_diffs||[]).map(x=>`<div class="chip">${esc(x.name)} · ${esc(x.club)} · ${x.own}%</div>`).join("")||`<p class="note">No overall differentials under 12%.</p>`;
  document.getElementById("leagues").innerHTML=`<div class="warn">Mini-league tactics use 1st and 2nd, not Overall %.</div><div class="card"><h2>Overall</h2><p class="note">Rank <b>${fmt(ov.rank)}</b> · ${D.team.overall_points} pts</p><p class="note">Template missing (25%+ owned, not in Bacalhau)</p><div class="xi">${ot}</div><p class="note">Their differentials (≤12%)</p><div class="xi">${od}</div></div>${mini}`;
}

const co=D.chips_official||{};

const CN=D.chip_net||{};
const CHIP_NET={bboost:CN.bboost||null,"3xc":CN["3xc"]||null,freehit:FHNET?{net:FHNET.net,note:FHNET.why}:null};
function chipRow(label,key){const gw=co[key];const used=gw!=null;const net=used&&CHIP_NET[key]?CHIP_NET[key].net:null;const note=used&&CHIP_NET[key]?CHIP_NET[key].note:"";return `<li><span class="who">${esc(label)}</span><span>${used?`<span class="pill used">Used GW${gw}</span>`:`<span class="pill free">Not used</span>`} ${used&&net!=null?`<b class="${net>=0?"pos":"neg"}">${sign(net)}</b>`:`<span class="note">—</span>`}</span><div class="detail">${esc(used?(note||"Net vs no chip."):"Still available.")}</div></li>`;}
document.getElementById("chips").innerHTML=`<div class="card"><h2>Chips</h2><ul class="chiplist">${chipRow("Bench Boost","bboost")}${chipRow("Triple Captain","3xc")}${chipRow("Free Hit","freehit")}${chipRow("Wildcard","wildcard")}</ul></div>`;

function renderNews(){

function renderFh(){
  const used=(D.chips_official||{}).freehit;
  const A=D.fh_audit||null;
  if(A){
    const posOrder={GKP:0,DEF:1,MID:2,FWD:3};
    const xiChips=list=>(list||[]).slice().sort((a,b)=>(posOrder[a.pos]??9)-(posOrder[b.pos]??9)).map(p=>{

      return `<div class="chip ${isCap?"ok":""}">${p.pos?esc(p.pos)+" · ":""}${esc(p.name)}${p.got!=null?" · "+p.got:""}${isCap?" (C)":""}</div>`;

}
