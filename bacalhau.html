<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bacalhau · FPL Lab</title>
<link rel="stylesheet" href="dashboard.css?v=20260920c">
<style>footer a{color:var(--gold)}</style></head><body>
<header><div class="eyebrow">FPL Performance Lab</div><h1 id="teamName">Bacalhau</h1><div class="sub" id="meta"></div></header>
<div class="kpis" id="kpis"></div>
<div class="deadline-bar" id="deadlineBanner"></div><div id="chipAlert"></div>
<nav class="tabs" id="tabs"></nav>
<section id="season" class="on"></section><section id="bench"></section><section id="transfers"></section>
<section id="plan"></section><section id="wildcard"></section><section id="strategy"></section><section id="stratFixtures"></section><section id="stratPlayers"></section><section id="stratDefcon"></section><section id="stratRotation"></section><section id="stratFormFdr"></section><section id="stratValue"></section><section id="stratPrice"></section><section id="target1"></section><section id="target3"></section><section id="target6"></section><section id="leagues"></section><section id="news"></section><section id="xtab"></section><section id="greekgod"></section><section id="fh"></section><section id="chips"></section>
<footer id="foot"></footer>
<script src="dashboard-common.js?v=20260920h"></script>
<script src="bacalhau-data.js?v=20260917i"></script>
<script src="news.js?v=20260917i"></script>
<script src="x-posts.js?v=20260917i"></script>
<script src="greekgod-archive.js?v=20260920a"></script>
<script src="bacalhau-wildcard.js?v=20260920a"></script>
<script>
const D=window.FPL_DATA;
document.getElementById("teamName").textContent=D.team.name;
document.getElementById("meta").textContent=D.team.manager+" · ID "+D.team.id+" · updated "+toToronto(D.generated_at);
document.getElementById("kpis").innerHTML=[["Season points",D.team.overall_points],["Overall rank",fmt(D.team.overall_rank)],["Squad value","£"+Number(D.team.value).toFixed(1)+"m"],["Bank","£"+Number(D.team.bank).toFixed(1)+"m"]].map(([k,v])=>`<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join("");
startDeadlineBanner(D,"deadlineBanner");
document.getElementById("chipAlert").innerHTML=chipAlertBanner(D);
const TAB_GROUPS=[
  {id:"review",label:"Review",tabs:[["season","Season"],["bench","Bench"],["transfers","Transfers"],["chips","Chips"]]},
  {id:"plan",label:"Plan",tabs:[["plan","Next 2 GWs"],["fh","Free Hit"],["wildcard","Wildcard"]]},
  {id:"strategy",label:"Strategy",tabs:[["strategy","Chips & Hits"],["stratFixtures","Fixtures"],["stratPlayers","xG/xA"],["stratDefcon","DEFCON"],["stratRotation","Rotation"],["stratFormFdr","Form/FDR"],["stratValue","Value"],["stratPrice","Price radar"]]},
  {id:"target",label:"Target",tabs:[["target1","1 GW"],["target3","3 GW"],["target6","6 GW"]]},
  {id:"intel",label:"Intel",tabs:[["news","News"],["xtab","X"],["greekgod","GreekGod"]]},
  {id:"league",label:"Leagues",tabs:[["leagues","Leagues"]]}
];
let activeGroup="review", activeTab="season";
function paintTabs(){
  const g=TAB_GROUPS.find(x=>x.id===activeGroup)||TAB_GROUPS[0];
  const groups=TAB_GROUPS.map(x=>`<button class="group ${x.id===activeGroup?"on":""}" data-group="${x.id}">${x.label}</button>`).join("");
  // A group with only one tab has nothing to switch between, so the pill row
  // is just a lone, oddly-small-looking button — skip it for single-tab
  // groups (e.g. Leagues) instead of rendering a selector with one option.
  const pills=g.tabs.length>1?`<div class="tab-pills">${g.tabs.map(([id,label])=>`<button class="${id===activeTab?"on":""}" data-id="${id}">${label}</button>`).join("")}</div>`:"";
  document.getElementById("tabs").innerHTML=`<div class="tab-groups">${groups}</div>${pills}`;
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===activeTab));
}
document.getElementById("tabs").onclick=e=>{const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.group){activeGroup=b.dataset.group; const first=(TAB_GROUPS.find(x=>x.id===activeGroup)||{}).tabs||[]; if(!first.some(t=>t[0]===activeTab)) activeTab=first[0][0];}
  else if(b.dataset.id){activeTab=b.dataset.id; const owner=TAB_GROUPS.find(x=>x.tabs.some(t=>t[0]===activeTab)); if(owner) activeGroup=owner.id;}
  paintTabs();};
paintTabs();
function gwTable(){const rows=D.gameweeks.map(g=>{const chip=g.chip?` <span class="pill used">${esc(g.chip)}</span>`:"";return `<tr><td>GW${g.gw}${chip}</td><td><b>${g.points}</b></td><td>${g.field_avg??"-"}</td><td class="${cls(g.delta)}">${sign(g.delta)}</td><td>${g.bench}</td><td>${g.transfers}</td><td>${fmt(g.rank)}</td></tr>`;}).join("");return `<div class="card"><h2>Gameweek log</h2><table><thead><tr><th>GW</th><th>Pts</th><th>Field</th><th>d</th><th>Bench</th><th>Tr</th><th>OR</th></tr></thead><tbody>${rows}</tbody></table></div>`;}
document.getElementById("season").innerHTML=gwTable();
function bar(label,val,max,klass){const pct=Math.max(4,Math.round(100*val/Math.max(max,1)));return `<div class="barrow"><span>${label}</span><div class="track"><i class="${klass||""}" style="width:${pct}%"></i></div><b>${val}</b></div>`;}
function chipClass(gw,name){const t=((D.bench_audit&&D.bench_audit[gw]&&D.bench_audit[gw].bench_tags)||{})[name];return t?"chip "+t:"chip sit";}
function benchBlock(key,title){
  const b=D.bench_audit&&D.bench_audit[key]; if(!b)return"";
  const max=Math.max(b.you,b.process,b.hindsight,1);
  const yours=(b.your_bench||[]).map(x=>`<div class="${chipClass(key,x[0])}">${esc(x[0])} · ${x[1]}</div>`).join("");
  const should=(b.better_bench||[]).map(x=>`<div class="chip ok">${esc(x[0])} · ${x[1]}</div>`).join("");
  // "They" is the only bar that's a judgment: green if they matched/beat the
  // process benchmark (the best XI knowable pre-deadline), red if they fell
  // short of it. Process/Hindsight are reference lines, not verdicts — in
  // particular Hindsight is pure outcome (unknowable in advance), so coloring
  // it "bad" would imply they should have hit an unhittable target.
  const theyKls=b.you>=b.process?"good":"bad";
  return `<div class="card"><h2>${title}</h2>${bar("They",b.you,max,theyKls)}${bar("Process",b.process,max)}${bar("Hindsight",b.hindsight,max)}<p class="note">Their bench</p><div class="xi">${yours}</div><p class="note">Should have benched</p><div class="xi">${should}</div></div>`;
}
const benchKeys=Object.keys(D.bench_audit||{}).sort((a,b)=>Number(String(a).replace(/\D/g,""))-Number(String(b).replace(/\D/g,"")));
document.getElementById("bench").innerHTML=(benchKeys.length?benchKeys.map(k=>benchBlock(k,k.toUpperCase())).join(""):`<div class="card"><h2>Bench audit</h2><p class="note">No finished GW bench audit yet.</p></div>`)+`<ul class="note-list"><li>Green They = matched or beat the process benchmark; red They = fell short of it</li><li>Process/Hindsight are reference lines, not verdicts</li><li>Chips: green = correct sit, red = process miss, yellow = variance</li></ul>`;
function renderTransfers(){
  const rows=D.transfers||[];
  const total=rows.reduce((s,t)=>s+trNet(t),0);
  const by={}; for(const t of rows){const g=t.gw??"?"; by[g]=(by[g]||0)+trNet(t);}
  const gwLines=Object.keys(by).sort((a,b)=>Number(a)-Number(b)).map(g=>`<div class="chip">GW${g} · <b class="${cls(by[g])}">${sign(by[g])}</b></div>`).join("");
  const body=rows.map(t=>`<tr><td>GW${t.gw??"-"}</td><td>${esc(t.out)} → ${esc(t.inn)}</td><td class="${cls(trNet(t))}">${esc(t.net)}</td><td>${esc(t.verdict||"")}</td></tr>`).join("");
  document.getElementById("transfers").innerHTML=rows.length
    ?`<div class="card"><h2>Transfer points</h2><p class="note">Season net <b class="${cls(total)}">${sign(total)}</b></p><div class="xi">${gwLines}</div></div><div class="card"><h2>Transfers</h2><table><thead><tr><th>GW</th><th>Move</th><th>Net</th><th>Verdict</th></tr></thead><tbody>${body}</tbody></table></div>`
    :`<div class="card"><h2>Transfers</h2><p class="note">No transfer-by-transfer list yet.</p></div>`;
}
renderTransfers();
function newsCard(title, vs){
  const li=(arr,empty)=>arr.length?arr.map(raw=>{const x=esc(raw);return `<li><span class="who">${x.split(" · ")[0]}</span><div class="detail">${x.includes(" · ")?x.split(" · ").slice(1).join(" · "):x}</div></li>`;}).join(""):`<li><span class="note">${empty}</span></li>`;
  const cap=vs.caps[0]?`<p class="note">Captain check: ${esc(vs.caps[0])}</p>`:"";
  return `<div class="card"><h2>${title}</h2><p class="note">Own and agreed</p><ul class="chiplist">${li(vs.owned,"None of the agreed names are in this squad.")}</ul><p class="note">Missing and agreed</p><ul class="chiplist">${li(vs.missing,"They already own the agreed targets, or none were named.")}</ul><p class="note">Fade, but they still start them</p><ul class="chiplist">${li(vs.fade,"No fade conflict.")}</ul>${cap}</div>`;
}
function renderPlan(){
  const P=D.plan||{},up=P.upcoming||[];
  if(!up.length){document.getElementById("plan").innerHTML=`<div class="warn">Waiting for refresh.</div>`;return;}
  const heads=up.map(u=>`<th>GW${u.gw}</th>`).join("");
  const avail=P.availability||{};
  const rows=(P.rows||[]).map(r=>{
    const a=avail[r[1]]||null;
    const badge=a&&a.label?` <span class="pill used">${esc(a.label)}</span>`:"";
    let c=`<td>${esc(r[1])}${badge}</td><td>${esc(r[0])}</td>`;
    for(let i=0;i<up.length;i++){
      const xi=((P.xis||{})["gw"+up[i].gw]||{}).xi||[];
      const started=new Set(xi.map(n=>String(n).split(" (")[0]));
      let call=String(r[3+i*3])==="Blank"?"BLANK":(started.has(r[1])?"START":"SIT");
      c+=`<td>${esc(r[3+i*3])} <b class="${call==="START"?"pos":"neg"}">${call}</b></td>`;
    }
    return `<tr>${c}</tr>`;
  }).join("");
  const T=P.transfer||{}; const move=T.move;
  const actionLine=T.action==="TRANSFER"&&move?`${esc(move.out)} → ${esc(move.inn)}`:"Roll the free transfer";
  const squad=(P.rows||[]).map(r=>r[1]); const clubs={}; (P.rows||[]).forEach(r=>clubs[r[1]]=r[2]);
  const gw0=up[0]&&up[0].gw; const started=((((P.xis||{})["gw"+gw0]||{}).xi)||[]).map(n=>String(n).split(" (")[0]);
  const vs=newsVsSquad(squad, started, clubs);
  const benches=(P.bench_calls||[]).map(b=>`<div class="card"><h2>GW${b.gw} bench</h2><p class="note">Sit first: <b>${esc(b.worst||"-")}</b> · ${esc(b.why||"")}</p><div class="xi">${(b.sit||[]).map(x=>`<div class="chip sit">${esc(x)}</div>`).join("")}</div></div>`).join("");
  const transferCard=`<div class="card"><h2>Transfer · ${esc(T.action||"ROLL")} · ${T.ft_available??"?"} FT · bank £${Number(D.team.bank).toFixed(1)}</h2><p class="note"><b>${esc(actionLine)}</b></p><p class="note">${esc(T.reason||"")}</p></div>`;
  const injuryNote=Object.keys(avail).length?`<p class="note">Availability from FPL: ${esc(Object.entries(avail).map(([n,a])=>n+" "+(a.label||a.kind)).join(" · "))}</p>`:`<p class="note">No injury flags in current Bacalhau plan data.</p>`;
  const TT=D.transfer_targets||{};
  const ttXgRows=(TT.xg||[]).map(r=>`<tr><td>${nameCell(r.name,r.club)}</td><td>${esc(r.pos)}</td><td>£${r.cost.toFixed(1)}</td><td>${r.xgi_p90}</td><td>${r.goals}+${r.assists}</td></tr>`).join("")||`<tr><td colspan="5"><span class="note">No qualifying non-owned players yet.</span></td></tr>`;
  const ttDcRows=(TT.defcon||[]).map(r=>`<tr><td>${nameCell(r.name,r.club)}</td><td>${esc(r.pos)}</td><td>£${r.cost.toFixed(1)}</td><td>${r.per90}/${r.threshold}</td></tr>`).join("")||`<tr><td colspan="4"><span class="note">No non-owned players reliably hitting the threshold yet.</span></td></tr>`;
  const targetsCard=`<div class="card"><h2>Transfer targets · not owned</h2><ul class="note-list"><li>Players Bacalhau doesn't own yet (${TT.min_minutes??"?"}+ mins)</li><li>Same signals used to audit their squad, scouted league-wide</li></ul><h3>Strong underlying (xGI per 90)</h3><table class="table-compact"><thead><tr><th style="width:36%">Player</th><th style="width:10%">Pos</th><th style="width:14%">Cost</th><th style="width:20%">xGI/90</th><th style="width:20%">G+A</th></tr></thead><tbody>${ttXgRows}</tbody></table><h3>Reliable DEFCON</h3><table class="table-compact"><thead><tr><th style="width:38%">Player</th><th style="width:12%">Pos</th><th style="width:16%">Cost</th><th style="width:34%">P90/Thr</th></tr></thead><tbody>${ttDcRows}</tbody></table></div>`;
  const W=window.FPL_WILDCARD_WATCH;
  const wildcardNote=(W&&W.chips&&W.chips.wildcard==="active")?`<div class="warn">Bacalhau has Wildcard <b>active</b> for GW${W.gw} (${esc(W.status)} — captured ${esc(W.captured_at)}). See the Wildcard tab for the squad.</div>`:"";
  document.getElementById("plan").innerHTML=`${wildcardNote}${transferCard}${newsCard("News + X vs Bacalhau",vs)}${benches}<div class="card"><h2>Fixtures</h2>${injuryNote}<table><thead><tr><th>Player</th><th>Pos</th>${heads}</tr></thead><tbody>${rows}</tbody></table></div>${targetsCard}`;
}
renderPlan();
function renderWildcardWatch(){
  const W=window.FPL_WILDCARD_WATCH;
  if(!W){document.getElementById("wildcard").innerHTML=`<div class="card"><h2>Wildcard watch</h2><p class="note">No wildcard squad captured yet.</p></div>`;return;}
  const R=W.recommend||null;
  const epByName={};
  if(R){(R.xi_ep||[]).concat(R.bench_ep||[]).forEach(p=>epByName[p.name]=p);}
  const statusKls={out:"neg",doubt:"mid"};
  const head=`<thead><tr><th style="width:38%">Player</th><th style="width:12%">Pos</th><th style="width:28%">Fixture</th><th style="width:22%">EP</th></tr></thead>`;
  const row=p=>{
    const rp=epByName[p.name];
    const epVal=rp&&rp.ep_next!=null?rp.ep_next:"–";
    const kls=rp?(statusKls[rp.status]||""):"";
    const tag=p.captain?` <span class="pill used">C</span>`:p.vice?` <span class="pill free">VC</span>`:"";
    return `<tr><td>${nameCell(p.name,p.club)}${tag}</td><td>${esc(p.pos)}</td><td>${esc(p.fixture||"")}</td><td class="${kls}">${epVal}</td></tr>`;
  };
  const xiRows=(W.xi||[]).map(row).join("")||`<tr><td colspan="4"><span class="note">No XI captured.</span></td></tr>`;
  const benchRows=(W.bench||[]).map(row).join("")||`<tr><td colspan="4"><span class="note">No bench captured.</span></td></tr>`;

  let recCard;
  if(R){
    const theirCap=(W.xi||[]).find(p=>p.captain);
    const theirCapEp=theirCap&&epByName[theirCap.name]?epByName[theirCap.name].ep_next:null;
    const capDiffers=theirCap&&R.captain&&theirCap.name!==R.captain;
    const capLine=capDiffers
      ?`<p class="note">Bacalhau captained <b>${esc(theirCap.name)}</b>${theirCapEp!=null?` (${theirCapEp} EP)`:""} — <b>${esc(R.captain)}</b> projects higher at <b>${R.captain_ep??"?"}</b> EP.</p>`
      :`<p class="note">Recommended captain matches Bacalhau's pick: <b>${esc(R.captain||"?")}</b> (${R.captain_ep??"?"} EP).</p>`;
    const viceLine=`<p class="note">Recommended vice: <b>${esc(R.vice||"?")}</b> (${R.vice_ep??"?"} EP).</p>`;
    const swapRows=(R.bench_swaps||[]).map(s=>`<li><span class="who">${esc(s.bench)} (${s.bench_ep}) over ${esc(s.starter)} (${s.starter_ep})</span><div class="detail">This bench player projects higher than a starter in the same position — worth reconsidering before the deadline.</div></li>`).join("")||`<li><span class="note">No bench player currently out-projects a starter in their position.</span></li>`;
    const flagRows=(R.availability_flags||[]).map(f=>`<li><span class="who">${esc(f.name)}</span> <span class="pill used">${esc(f.label||"Flagged")}</span></li>`).join("")||`<li><span class="note">No injury/doubt flags on this squad right now.</span></li>`;
    recCard=`<div class="card"><h2>Captain &amp; bench recommendation</h2><ul class="note-list"><li>Based on FPL's own ep_next (form + fixture blended prediction for next GW)</li><li>Recomputed every refresh — a pre-deadline read, not a locked call</li></ul>${capLine}${viceLine}<p class="note">Bench-swap watch</p><ul class="chiplist">${swapRows}</ul><p class="note">Availability flags</p><ul class="chiplist">${flagRows}</ul></div>`;
  } else {
    recCard=`<div class="card"><h2>Captain &amp; bench recommendation</h2><p class="note">Not computed yet — lands after the next refresh run.</p></div>`;
  }

  const WT=W.worth_tracker||null;
  const wtDeltaCls=d=>d==null?"":d>0?"neg":d<0?"pos":"";
  let worthCard;
  if(WT){
    const wtHead=`<thead><tr><th style="width:40%">Player</th><th style="width:20%">Then</th><th style="width:20%">Now</th><th style="width:20%">Δ</th></tr></thead>`;
    const wtRow=p=>{
      const statusTag=p.status==="removed"?` <span class="pill used">Dropped</span>`:p.status==="added"?` <span class="pill free">Added</span>`:"";
      const thenCell=p.baseline_cost!=null?`£${p.baseline_cost.toFixed(1)}`:"–";
      const nowCell=p.current_cost!=null?`£${p.current_cost.toFixed(1)}`:"–";
      const deltaCell=p.delta!=null?`<span class="${wtDeltaCls(p.delta)}">${sign(p.delta)}</span>`:"–";
      return `<tr><td>${esc(p.name)}${statusTag}</td><td>${thenCell}</td><td>${nowCell}</td><td>${deltaCell}</td></tr>`;
    };
    const wtRows=(WT.players||[]).map(wtRow).join("")||`<tr><td colspan="4"><span class="note">No target squad captured yet.</span></td></tr>`;
    const logLi=e=>{
      if(e.event==="captured") return `<li><span class="who">${esc(e.date)}</span><div class="detail">${esc(e.detail)}</div></li>`;
      if(e.event==="price_change") return `<li><span class="who">${esc(e.date)} · ${esc(e.player)}</span><div class="detail">£${e.from.toFixed(1)} → £${e.to.toFixed(1)} (<span class="${wtDeltaCls(e.delta)}">${sign(e.delta)}</span>)</div></li>`;
      if(e.event==="removed") return `<li><span class="who">${esc(e.date)} · ${esc(e.player)}</span><div class="detail">Dropped from target squad at £${e.price_at_change.toFixed(1)}</div></li>`;
      if(e.event==="added") return `<li><span class="who">${esc(e.date)} · ${esc(e.player)}</span><div class="detail">Added to target squad at £${e.price_at_change.toFixed(1)}</div></li>`;
      return "";
    };
    const logRows=(WT.log||[]).slice().reverse().map(logLi).join("")||`<li><span class="note">No changes logged yet.</span></li>`;
    worthCard=`<div class="card"><h2>Team worth &amp; price tracker</h2><ul class="note-list"><li>Cost to assemble this exact target squad, first captured ${esc(WT.baseline.date)}</li><li>Updated every refresh until the GW${W.gw} deadline</li></ul><p class="note">Cost to assemble now: <b>£${WT.current.total_cost.toFixed(1)}m</b> · vs first captured: <b class="${wtDeltaCls(WT.total_delta)}">${sign(WT.total_delta)}</b></p><table class="table-compact">${wtHead}<tbody>${wtRows}</tbody></table><h3>Change log</h3><ul class="chiplist">${logRows}</ul><ul class="legend-list"><li>Then/Now = price when first captured vs current price</li><li>Δ = price change since first captured — green means the plan got cheaper to assemble, red means more expensive</li></ul></div>`;
  } else {
    worthCard=`<div class="card"><h2>Team worth &amp; price tracker</h2><p class="note">Not computed yet — lands after the next refresh run.</p></div>`;
  }

  document.getElementById("wildcard").innerHTML=`<div class="warn">${esc(W.note||"Provisional squad — hand-captured from Bacalhau's own Pick Team screen, not the FPL API. Can still change before the deadline.")}</div><div class="card"><h2>${esc(W.team)}'s Wildcard · GW${W.gw}</h2><p class="note">Deadline <b>${esc(W.deadline)}</b> · Captured ${esc(W.captured_at)} · Status: <b>${esc(W.status)}</b></p><p class="note">Starting XI</p><table class="table-compact">${head}<tbody>${xiRows}</tbody></table><p class="note">Bench</p><table class="table-compact">${head}<tbody>${benchRows}</tbody></table></div>${recCard}${worthCard}`;
}
renderWildcardWatch();
function renderStrategy(){
  const S=D.strategy||{};
  const STATUS_LABEL={used:"Used",open:"Open now",upcoming:"Not open yet",expired:"Expired"};
  const chips=(S.chips||[]).map(c=>{
    const wins=(c.windows||[]).map(w=>{
      const label=w.status==="used"?`Used GW${w.used_gw}`:w.status==="open"?`Open now (GW${w.start}-${w.stop})`:w.status==="upcoming"?`Opens GW${w.start}`:(STATUS_LABEL[w.status]||w.status);
      const kls=w.status==="open"?"ok":w.status==="used"?"sit":"";
      return `<div class="chip ${kls}">#${w.number} · ${esc(label)}</div>`;
    }).join("");
    return `<div class="card"><h2>${esc(c.label)}</h2><div class="xi">${wins}</div></div>`;
  }).join("");
  const H=S.hits||{};
  const hitsBlock=(H.rows&&H.rows.length)
    ?`<p class="note">Total hit cost <b class="neg">-${H.total_cost}</b> · Those moves netted <b class="${cls(H.total_moves_net)}">${sign(H.total_moves_net)}</b> · After cost <b class="${cls(H.net_after_cost)}">${sign(H.net_after_cost)}</b></p><ul class="chiplist">${H.rows.map(r=>`<li><span class="who">GW${r.gw}</span><div class="detail">Cost -${r.cost} · moves netted ${sign(r.moves_net)} · <b class="${r.paid_off?"pos":"neg"}">${r.paid_off?"Paid off":"Not worth it"}</b></div></li>`).join("")}</ul>`
    :`<p class="note">No hits taken this season.</p>`;
  const F=S.fixtures||{};
  const fRows=(F.rows||[]).map(r=>{
    const flags=[(r.blanks&&r.blanks.length)?`Blank: ${r.blanks.join(", ")}`:"",(r.doubles&&r.doubles.length)?`Dbl: ${r.doubles.join(", ")}`:""].filter(Boolean).join(" · ");
    return `<tr><td>GW${r.gw}</td><td>${r.avg_fdr??"-"}</td><td>${esc(flags)||"–"}</td></tr>`;
  }).join("");

function renderTargets(){

    const rows=(h.top||[]).map(r=>`<tr><td>${nameCell(r.name,r.club)}</td><td>${esc(r.pos)}</td><td>£${r.cost.toFixed(1)}</td><td class="${scoreCls(r.score)}"><b>${r.score}</b></td><td style="white-space:normal">${esc((r.why||[]).join(" · ")||"–")}</td></tr>`).join("")||`<tr><td colspan="5"><span class="note">No qualifying players yet.</span></td></tr>`;
    return `<div class="card"><h2>Target · next ${n} GW${n===1?"":"s"}</h2><ul class="note-list"><li>League-wide shortlist combining Strategy tab signals (form, xGI/90, DEFCON, value) with Intel tab's News/X consensus</li><li>Score is a plain point count, not a hidden formula — see the Why column and legend below</li><li>Excludes anyone FPL itself flags as unavailable (${T.min_minutes??"?"}+ mins played to qualify)</li></ul><table class="table-compact">${tgtHead}<tbody>${rows}</tbody></table><ul class="legend-list"><li>In form = FPL form ≥6.0 (+2)</li><li>Strong xGI = xG+xA per 90 ≥0.5, non-GKP (+2)</li><li>Reliable DEFCON = clears the defensive-actions threshold for their position (+1)</li><li>Great value = top 25% points-per-£1m for their position (+1)</li><li>Kind run = average fixture difficulty ≤2.6 over this horizon (+1)</li><li>News/X backed = tagged a transfer target in Intel coverage (+1) · Fade signal = tagged fade/sell or injury/doubt (-1)</li><li>Doubt = FPL flags a fitness doubt — shown, never scored</li></ul></div>`;

function chipRow(label,key){const gw=co[key];const used=gw!=null;const net=used&&CHIP_NET[key]?CHIP_NET[key].net:null;const note=used&&CHIP_NET[key]?CHIP_NET[key].note:"";return `<li><span class="who">${esc(label)}</span><span>${used?`<span class="pill used">Used GW${gw}</span>`:`<span class="pill free">Not used</span>`} ${used&&net!=null?`<b class="${net>=0?"pos":"neg"}">${sign(net)}</b>`:`<span class="note">—</span>`}</span><div class="detail">${esc(used?(note||"Net vs no chip."):"Still available.")}</div></li>`;}
document.getElementById("chips").innerHTML=`<div class="card"><h2>Chips</h2><ul class="chiplist">${chipRow("Bench Boost","bboost")}${chipRow("Triple Captain","3xc")}${chipRow("Free Hit","freehit")}${chipRow("Wildcard","wildcard")}</ul></div>`;
function srcChips(list){return (list||[]).map(s=>`<span class="pill free">${esc(s)}</span>`).join(" ");}
function renderNews(){
  const N=window.FPL_NEWS||D.news||{};
  const agreed=(N.agreed||[]).map(x=>`<li><span class="who">${esc(x.text)}</span><div class="detail">${srcChips(x.sources)}</div></li>`).join("")||`<li><span class="note">No 3-site overlap yet.</span></li>`;
  const split=(N.split||[]).map(x=>`<li><span class="who">${esc(x.text)}</span><div class="detail">${srcChips(x.sources)}</div></li>`).join("")||`<li><span class="note">Nothing below the agreed threshold right now.</span></li>`;
  const links=(N.links||[]).map(x=>`<a href="${safeHref(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`).join(" · ");
  const fresh=N.new_articles||[];
  const rawCap=8;
  const newBlock=fresh.length?fresh.slice(0,rawCap).map(x=>`<li><span class="who">${esc(x.title)}</span><div class="detail"><span class="pill free">${esc(x.source)}</span> <a href="${safeHref(x.url)}" target="_blank" rel="noopener">open</a></div></li>`).join("")+(fresh.length>rawCap?`<li><span class="note">+${fresh.length-rawCap} more this scrape — already folded into the consensus above.</span></li>`:""):`<li><span class="note">No new articles recently.</span></li>`;
  document.getElementById("news").innerHTML=`<div class="warn">Emerging = 2 sites so far. Agreed = 3+ sites (consensus).</div><div class="card"><h2>Agreed for GW${N.gw||""}</h2><ul class="chiplist">${agreed}</ul></div><div class="card"><h2>Emerging (2 sources)</h2><ul class="chiplist">${split}</ul></div><div class="card"><details><summary><h2 style="display:inline">New since last scrape (${fresh.length})</h2></summary><p class="note">Raw articles just fetched this run — not analyzed yet, this is what feeds the consensus above.</p><ul class="chiplist">${newBlock}</ul></details></div><div class="card"><h2>Sources</h2><p class="note">${links||"Waiting."}</p></div>`;
}
renderNews();
function renderX(){
  const X=window.FPL_X||{};
  const acc=(X.accounts||[]).map(a=>`<div class="chip">@${esc(a.handle||a)}</div>`).join("")||`<p class="note">No X accounts yet.</p>`;
  const fresh=X.new_posts||[];
  const rawCap=8;

  const agreed=(X.agreed||[]).map(x=>`<li><span class="who">${esc(x.text)}</span><div class="detail">${srcChips((x.sources||[]).map(s=>"@"+s))}</div></li>`).join("")||`<li><span class="note">No 3-account overlap yet.</span></li>`;
  const split=(X.split||[]).map(x=>`<li><span class="who">${esc(x.text)}</span><div class="detail">${srcChips((x.sources||[]).map(s=>"@"+s))}</div></li>`).join("")||`<li><span class="note">Nothing below the agreed threshold right now.</span></li>`;
  document.getElementById("xtab").innerHTML=`<div class="warn">Emerging = 2 accounts so far. Agreed = 3+ accounts (consensus).</div><div class="card"><h2>Accounts</h2><div class="xi">${acc}</div></div><div class="card"><h2>Agreed for GW${X.gw||""}</h2><ul class="chiplist">${agreed}</ul></div><div class="card"><h2>Emerging (2 sources)</h2><ul class="chiplist">${split}</ul></div><div class="card"><details><summary><h2 style="display:inline">New since last scrape (${fresh.length})</h2></summary><p class="note">Raw posts just fetched this run — not analyzed yet, this is what feeds the consensus above.</p><ul class="chiplist">${newBlock}</ul></details></div>`;
}
renderX();
renderGreekGodTab();
function renderFh(){
  const used=(D.chips_official||{}).freehit;
  const A=D.fh_audit||null;
  if(A){
    const posOrder={GKP:0,DEF:1,MID:2,FWD:3};
    const xiChips=list=>(list||[]).slice().sort((a,b)=>(posOrder[a.pos]??9)-(posOrder[b.pos]??9)).map(p=>{
      const isCap=p.captain||p.mult>1;
      return `<div class="chip ${isCap?"ok":""}">${p.pos?esc(p.pos)+" · ":""}${esc(p.name)}${p.got!=null?" · "+p.got:""}${isCap?" (C)":""}</div>`;
    }).join("")||`<p class="note">No XI recorded.</p>`;
    document.getElementById("fh").innerHTML=`<div class="warn">GW${A.gw||used||""} Free Hit is done.</div><div class="card"><h2>FH vs original</h2><p class="note">Net <b class="${cls(A.net)}">${sign(A.net)}</b> · Process ${esc(A.process||"?")}</p><p class="note">${esc(A.why||"")}</p><div class="compare2"><div><h3>Original · best process XI · ${A.original_points??"?"} pts${A.original_cap?" · C "+esc(A.original_cap):""}</h3><div class="xi">${xiChips(A.original_xi)}</div></div><div><h3>Free Hit · played · ${A.fh_points??"?"} pts${A.fh_cap?" · C "+esc(A.fh_cap):""}</h3><div class="xi">${xiChips(A.fh_xi)}</div></div></div></div>`;
    return;
  }
  if(used!=null){
    document.getElementById("fh").innerHTML=`<div class="card"><h2>Free Hit</h2><p class="note">Used GW${used}. No Bacalhau FH audit saved yet.</p></div>`;
    return;
  }
  document.getElementById("fh").innerHTML=`<div class="card"><h2>Free Hit</h2><p class="note">Officially unused. No FH XI to show for Bacalhau.</p></div>`;
}
renderFh();
document.getElementById("foot").innerHTML=`<a href="index.html">Shaaland</a> · Bacalhau 1360920 · Leagues: Overall + ESL + Momo Cup.`;
