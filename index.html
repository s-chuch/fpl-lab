<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Shaaland · FPL Lab</title>
<link rel="stylesheet" href="dashboard.css?v=20260919a"></head><body>
<header><div class="eyebrow">FPL Performance Lab</div><h1 id="teamName">Shaaland</h1><div class="sub" id="meta"></div></header>
<div class="kpis" id="kpis"></div><nav class="tabs" id="tabs"></nav>
<section id="season" class="on"></section><section id="bench"></section><section id="transfers"></section>
<section id="plan"></section><section id="strategy"></section><section id="leagues"></section><section id="news"></section><section id="xtab"></section><section id="fh"></section><section id="chips"></section>
<footer id="foot"></footer>
<script src="dashboard-common.js?v=20260918h"></script>
<script src="data.js?v=20260918e"></script>
<script src="bench-fix.js?v=20260918g"></script>
<script src="news.js?v=20260918e"></script>
<script src="x-posts.js?v=20260919b"></script>

<script src="plan-intel.js?v=20260918h"></script>
<script>
const D=window.FPL_DATA;
document.getElementById("teamName").textContent=D.team.name;
document.getElementById("meta").textContent=D.team.manager+" · ID "+D.team.id+" · updated "+(D.generated_at_et||toToronto(D.generated_at));
document.getElementById("kpis").innerHTML=[["Season points",D.team.overall_points],["Overall rank",fmt(D.team.overall_rank)],["Squad value","£"+D.team.value.toFixed(1)+"m"],["Bank","£"+D.team.bank.toFixed(1)+"m"]].map(([k,v])=>`<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join("");
const TAB_GROUPS=[
  {id:"review",label:"Review",tabs:[["season","Season"],["bench","Bench"],["transfers","Transfers"],["chips","Chips"]]},
  {id:"plan",label:"Plan",tabs:[["plan","Next 2 GWs"],["fh","Free Hit"]]},
  {id:"strategy",label:"Strategy",tabs:[["strategy","Chips & Transfers"]]},
  {id:"intel",label:"Intel",tabs:[["news","News"],["xtab","X"]]},
  {id:"league",label:"Leagues",tabs:[["leagues","Leagues"]]}
];
let activeGroup="review", activeTab="season";
function paintTabs(){
  const g=TAB_GROUPS.find(x=>x.id===activeGroup)||TAB_GROUPS[0];
  const groups=TAB_GROUPS.map(x=>`<button class="group ${x.id===activeGroup?"on":""}" data-group="${x.id}">${x.label}</button>`).join("");
  const pills=g.tabs.map(([id,label])=>`<button class="${id===activeTab?"on":""}" data-id="${id}">${label}</button>`).join("");
  document.getElementById("tabs").innerHTML=`<div class="tab-groups">${groups}</div><div class="tab-pills">${pills}</div>`;
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===activeTab));
}
document.getElementById("tabs").onclick=e=>{const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.group){activeGroup=b.dataset.group; const first=(TAB_GROUPS.find(x=>x.id===activeGroup)||{}).tabs||[]; if(!first.some(t=>t[0]===activeTab)) activeTab=first[0][0];}
  else if(b.dataset.id){activeTab=b.dataset.id; const owner=TAB_GROUPS.find(x=>x.tabs.some(t=>t[0]===activeTab)); if(owner) activeGroup=owner.id;}
  paintTabs();};
paintTabs();
function gwTable(){const rows=D.gameweeks.map(g=>{const chip=g.chip?` <span class="pill used">${esc(g.chip)}</span>`:"";return `<tr><td>GW${g.gw}${chip}</td><td><b>${g.points}</b></td><td>${g.field_avg??"-"}</td><td class="${cls(g.delta)}">${sign(g.delta)}</td><td>${g.bench}</td><td>${g.transfers}</td><td>${fmt(g.rank)}</td></tr>`;}).join("");return `<div class="card"><h2>Gameweek log</h2><table><thead><tr><th>GW</th><th>Pts</th><th>Field</th><th>d</th><th>Bench</th><th>Tr</th><th>OR</th></tr></thead><tbody>${rows}</tbody></table></div>`;}
document.getElementById("season").innerHTML=gwTable();
function chipClass(gw,name){const t=((D.bench_audit&&D.bench_audit[gw]&&D.bench_audit[gw].bench_tags)||{})[name];return t?"chip "+t:"chip sit";}
function bar(label,val,max,klass){const pct=Math.max(4,Math.round(100*val/Math.max(max,1)));return `<div class="barrow"><span>${label}</span><div class="track"><i class="${klass||""}" style="width:${pct}%"></i></div><b>${val}</b></div>`;}
function benchBlock(key,title){
  const b=D.bench_audit&&D.bench_audit[key]; if(!b)return"";
  const max=Math.max(b.you,b.process,b.hindsight,1);
  const yours=(b.your_bench||[]).map(x=>`<div class="${chipClass(key,x[0])}">${esc(x[0])} · ${x[1]}</div>`).join("");
  const should=(b.better_bench||[]).map(x=>`<div class="chip ok">${esc(x[0])} · ${x[1]}</div>`).join("");
  return `<div class="card"><h2>${title}</h2>${bar("You",b.you,max)}${bar("Process",b.process,max,"mid")}${bar("Hindsight",b.hindsight,max,"bad")}<p class="note">Your bench</p><div class="xi">${yours}</div><p class="note">Should have benched</p><div class="xi">${should}</div></div>`;
}
document.getElementById("bench").innerHTML=benchBlock("gw2","GW2")+benchBlock("gw3","GW3")+`<p class="note">Green = correct sit. Red = process miss. Yellow = variance.</p>`;
function renderTransfers(){
  const rows=D.transfers||[];
  const total=rows.reduce((s,t)=>s+trNet(t),0);
  const by={}; for(const t of rows){const g=t.gw??"?"; by[g]=(by[g]||0)+trNet(t);}
  const gwLines=Object.keys(by).sort((a,b)=>Number(a)-Number(b)).map(g=>`<div class="chip">GW${g} · <b class="${cls(by[g])}">${sign(by[g])}</b></div>`).join("");
  const body=rows.map(t=>`<tr><td>GW${t.gw??"-"}</td><td>${esc(t.out)} → ${esc(t.inn)}</td><td class="${cls(trNet(t))}">${esc(t.net)}</td><td>${esc(t.verdict)}</td></tr>`).join("");
  document.getElementById("transfers").innerHTML=`<div class="card"><h2>Transfer points</h2><p class="note">Season net <b class="${cls(total)}">${sign(total)}</b></p><div class="xi">${gwLines}</div></div><div class="card"><h2>Transfers</h2><table><thead><tr><th>GW</th><th>Move</th><th>Net</th><th>Verdict</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
renderTransfers();
function newsCard(title, vs){
  const li=(arr,empty)=>arr.length?arr.map(raw=>{const x=esc(raw);return `<li><span class="who">${x.split(" · ")[0]}</span><div class="detail">${x.includes(" · ")?x.split(" · ").slice(1).join(" · "):x}</div></li>`;}).join(""):`<li><span class="note">${empty}</span></li>`;
  const cap=vs.caps[0]?`<p class="note">Captain check: ${esc(vs.caps[0])}</p>`:"";
  return `<div class="card"><h2>${title}</h2><p class="note">Own and agreed</p><ul class="chiplist">${li(vs.owned,"None of the agreed names are in this squad.")}</ul><p class="note">Missing and agreed</p><ul class="chiplist">${li(vs.missing,"You already own the agreed targets, or none were named.")}</ul><p class="note">Fade, but you still start them</p><ul class="chiplist">${li(vs.fade,"No fade conflict.")}</ul>${cap}</div>`;
}
function renderPlan(){
  const P=D.plan||{},up=P.upcoming||[];
  if(!up.length){document.getElementById("plan").innerHTML=`<div class="warn">Waiting for refresh.</div>`;return;}
  const heads=up.map(u=>`<th>GW${u.gw}</th>`).join("");
  const avail=P.availability||{};
  const rows=(P.rows||[]).map(r=>{
    const a=avail[r[1]]||null;
    const badge=a&&a.label?` <span class="pill used">${esc(a.label)}</span>`:"";
    let c=`<td>${esc(r[0])}</td><td>${esc(r[1])}${badge}</td>`;
    for(let i=0;i<up.length;i++){
      const xi=((P.xis||{})["gw"+up[i].gw]||{}).xi||[];
      const started=new Set(xi.map(n=>n.split(" (")[0]));
      let call=String(r[3+i*3])==="Blank"?"BLANK":(started.has(r[1])?"START":"SIT");
      c+=`<td>${esc(r[3+i*3])} <b class="${call==="START"?"pos":"neg"}">${call}</b></td>`;
    }
    return `<tr>${c}</tr>`;
  }).join("");
  const T=P.transfer||{}; const move=T.move;
  const actionLine=T.action==="TRANSFER"&&move?`${esc(move.out)} → ${esc(move.inn)}`:"Roll the free transfer";
  const squad=(P.rows||[]).map(r=>r[1]); const clubs={}; (P.rows||[]).forEach(r=>clubs[r[1]]=r[2]);
  const gw0=up[0]&&up[0].gw; const started=((((P.xis||{})["gw"+gw0]||{}).xi)||[]).map(n=>n.split(" (")[0]);
  const vs=newsVsSquad(squad, started, clubs);
  const benches=(P.bench_calls||[]).map(b=>`<div class="card"><h2>GW${b.gw} bench</h2><p class="note">Sit first: <b>${esc(b.worst||"-")}</b> · ${esc(b.why||"")}</p><div class="xi">${(b.sit||[]).map(x=>`<div class="chip sit">${esc(x)}</div>`).join("")}</div></div>`).join("");
  const I=(window.planIntel&&window.planIntel(D))||{};
  const dlHeads=up.map(u=>{
    const when=u.deadline?u.deadline:(u.deadline_utc?toToronto(u.deadline_utc):"");
    const lock=u.deadline_passed?` <span class="pill used">locked</span>`:"";
    return `<span class="note">GW${u.gw}${when?": "+when:""}${lock}</span>`;
  }).join(" · ");
  let intel="", vsLead="", newsBlock="";
  if(I.cleared||I.waiting){
    const wait=I.intelGw||(D.deadline&&D.deadline.intel_gw)||"?";
    intel=`<div class="warn">Waiting for GW${wait} intel — locked-GW News/X themes are cleared from Plan.</div><div class="card"><h2>Plan intel · GW${wait}</h2><p class="note"><b>${esc(I.moveLine||("Waiting for GW"+wait+" intel"))}</b></p><p class="note">${esc(I.reason||"")}</p><p class="note">Fixtures and bench below still cover the live/upcoming matchweeks. Chip and transfer consensus will refill when GW${wait} scrapes land.</p></div>`;
    vsLead=""; newsBlock="";
  } else {
    const chipLis=(I.chipRows||[]).map(r=>`<li><span class="who">GW${r.gw} · ${esc(r.label)}</span><span class="pill ${r.rec==="HOLD"||r.used?"used":"free"}">${esc(r.rec)}</span><div class="detail">${esc(r.why)}</div></li>`).join("");
    const opt=(I.optional||[]).map(x=>`<li><span class="note">${esc(x)}</span></li>`).join("");
    intel=`<div class="card"><h2>Chips · next 2 GWs</h2><p class="note">Calls use News + X plus chips you have already played.</p><ul class="chiplist">${chipLis||"<li><span class=note>Waiting for news.js.</span></li>"}</ul></div><div class="card"><h2>Transfers · ${esc(I.action||T.action||"ROLL")} · ${I.ft??T.ft_available??"?"} FT · bank £${(I.bank||0).toFixed?(I.bank||0).toFixed(1):I.bank}</h2><p class="note"><b>${esc(I.moveLine||actionLine)}</b></p><p class="note">${esc(I.reason||T.reason||"")}</p>${I.targets&&I.targets.length?`<p class="note">Agreed and missing: ${esc(I.targets.join(", "))}</p>`:""}${opt?`<ul class="chiplist">${opt}</ul>`:""}</div>`;
    const Ltac=I.league||{};
    vsLead=`<div class="card"><h2>Vs 1st & 2nd${Ltac.league?" · "+esc(Ltac.league):""}</h2><p class="note"><b>${esc(Ltac.cap||"Captain Haaland if the room owns him.")}</b></p><p class="note">${esc(Ltac.transfer||"")}</p>${(Ltac.start||[]).length?`<p class="note">Start these league diffs</p><div class="xi">${Ltac.start.map(x=>`<div class="chip ok">${esc(x)}</div>`).join("")}</div>`:""}${(Ltac.bench||[]).length?`<p class="note">Owned diffs that are sits — not tactics</p><div class="xi">${Ltac.bench.map(x=>`<div class="chip sit">${esc(x)}</div>`).join("")}</div>`:""}${(Ltac.wc||[]).length?`<p class="note">WC names this league barely owns</p><div class="xi">${Ltac.wc.map(x=>`<div class="chip">${esc(x)}</div>`).join("")}</div>`:""}</div>`;
    newsBlock=newsCard("News + X vs this squad",vs);
  }
  const injuryNote=Object.keys(avail).length?`<p class="note">Availability from FPL: ${esc(Object.entries(avail).map(([n,a])=>n+" "+(a.label||a.kind)).join(" · "))}</p>`:"";
  document.getElementById("plan").innerHTML=`${intel}${vsLead}${newsBlock}${benches}<div class="card"><h2>Fixtures</h2><p class="note">${dlHeads}</p>${injuryNote}<table><thead><tr><th>Pos</th><th>Player</th>${heads}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
renderPlan();
function fmtSquadLine(sq){
  if(!sq) return "";
  const xi=(sq.xi||[]).map(p=>{
    const tag=p.captain?" (C)":(p.vice?" (VC)":"");
    return `<div class="chip ${p.captain?"ok":""}">${esc(p.pos)} · ${esc(p.name)}${tag}</div>`;
  }).join("");
  const bn=(sq.bench||[]).map(p=>`<div class="chip sit">${esc(p.pos)} · ${esc(p.name)}</div>`).join("");
  const chip=sq.chip?` <span class="pill used">${esc(sq.chip)}</span>`:"";
  return `<details class="card" style="padding:12px 14px"${sq.me?' open':""}><summary><b>${esc(sq.team||"Team")}</b>${sq.me?" · you":""}${sq.rank!=null?" · P"+sq.rank:""}${sq.pts!=null?" · "+sq.pts+" pts":""}${chip} · C ${esc(sq.captain||"?")}</summary><p class="note">XI</p><div class="xi">${xi}</div><p class="note">Bench</p><div class="xi">${bn||"<span class=note>—</span>"}</div></details>`;
}
function renderLeagues(){
  const L=D.leagues||{};
  const want=new Set([125784,494594]);
  const names=new Set(["european super league","decision league"]);
  const list=(L.mini||[]).filter(lg=>want.has(lg.id)||names.has(String(lg.name||"").toLowerCase()));
  const unlocked=!!(L.picks_unlocked||(D.deadline&&D.deadline.picks_unlocked)||list.some(lg=>lg.picks_unlocked));
  const picksGw=L.picks_gw||(D.deadline&&D.deadline.locked_gw);
  let mini="";
  if(unlocked){
    const mine=L.my_squad?fmtSquadLine({...L.my_squad, team:(D.team&&D.team.name)||"Shaaland", me:true}):"";
    mini+=`<div class="card"><h2>GW${picksGw||"?"} locked squads</h2><p class="note">Deadline passed — full XIs for ESL + Decision (public FPL picks).</p>${mine}</div>`;
  } else {
    mini+=`<div class="warn">Picks unlock after deadline. Showing ownership / template only until then.</div>`;
  }
  for(const lg of list){
    const table=(lg.table||[]).map(r=>`<tr class="${r.me?"pos":""}"><td>${r.rank}</td><td>${esc(r.team)}${r.me?" · you":""}</td><td>${r.pts}</td></tr>`).join("");
    const templ=(lg.template||[]).map(x=>`<div class="chip">${esc(x.name)} · ${esc(x.club)} · ${x.count}/${x.n} (${x.own}%)</div>`).join("")||`<p class="note">You own the league template.</p>`;
    const diffs=(lg.diffs||[]).map(x=>`<div class="chip">${esc(x.name)} · ${esc(x.club)} · ${x.count}/${x.n} (${x.own}%)</div>`).join("")||`<p class="note">No low-owned picks here.</p>`;
    const T=lg.tactics||{};
    const startDiffs=(T.you_unique||[]).map(x=>`<div class="chip ok">${esc(x.name)} · ${x.own}% owned${x.vs_first?" vs 1st":""}${x.vs_second?" vs 2nd":""}</div>`).join("")||`<p class="note">Nothing rare enough to call a real diff vs 1st/2nd right now.</p>`;
    const copy=(T.they_share||[]).map(x=>`<div class="chip sit">${esc(x.name)} · ${x.count}/${x.n}</div>`).join("")||`<p class="note">1st and 2nd do not share a name you lack.</p>`;
    const caps=esc((T.cap_last||[]).map(x=>x.name+" "+x.count).join(" · ")||"—");
    const gap=T.gap_to_first==null?"":` · ${T.gap_to_first>0?"-"+T.gap_to_first:"+"+(-T.gap_to_first)} vs 1st`;
    mini+=`<div class="card"><h2>Vs 1st & 2nd${gap}</h2><p class="note">1st: <b>${esc((T.first&&T.first.name)||"?")}</b> ${(T.first&&T.first.pts)??""}${rivalExtra(T.first)}</p><p class="note">2nd: <b>${esc((T.second&&T.second.name)||"?")}</b> ${(T.second&&T.second.pts)??""}${rivalExtra(T.second)}</p><p class="note">Green = your rare picks that 1st or 2nd don't own — real differentials, low league ownership</p><div class="xi">${startDiffs}</div><p class="note">Do not copy — both ahead own these</p><div class="xi">${copy}</div><p class="note">Last captains: ${caps}</p></div>`;
    if(T.neighbors){
      const Nb=T.neighbors;
      const nStart=(Nb.you_unique||[]).map(x=>`<div class="chip ok">${esc(x.name)} · ${x.own}% owned</div>`).join("")||`<p class="note">Nothing rare enough to call a real diff vs your neighbours right now.</p>`;
      const nCopy=(Nb.they_share||[]).map(x=>`<div class="chip sit">${esc(x.name)} · ${x.count}/${x.n}</div>`).join("")||`<p class="note">Your neighbours do not share a name you lack.</p>`;
      mini+=`<div class="card"><h2>Vs your neighbours</h2>${Nb.above?`<p class="note">Above (P${T.you_rank-1}): <b>${esc(Nb.above.name)}</b> ${Nb.above.pts} · ${Nb.above.gap} pts ahead${rivalExtra(Nb.above)}</p>`:`<p class="note">Nobody above you.</p>`}${Nb.below?`<p class="note">Below (P${T.you_rank+1}): <b>${esc(Nb.below.name)}</b> ${Nb.below.pts} · ${Math.abs(Nb.below.gap)} pts behind${rivalExtra(Nb.below)}</p>`:`<p class="note">Nobody below you.</p>`}<p class="note">Green = your rare picks that both neighbours lack</p><div class="xi">${nStart}</div><p class="note">Do not copy — both neighbours share these</p><div class="xi">${nCopy}</div></div>`;
    }
    mini+=`<div class="card"><h2>${esc(lg.name)} · ${lg.size} teams · you P${lg.rank}</h2><table><thead><tr><th>#</th><th>Team</th><th>Pts</th></tr></thead><tbody>${table}</tbody></table><p class="note">Template missing</p><div class="xi">${templ}</div><p class="note">Your differentials</p><div class="xi">${diffs}</div></div>`;
    if(lg.picks_unlocked && (lg.member_squads||[]).length){
      mini+=`<div class="card"><h2>${esc(lg.name)} · GW${lg.picks_gw} picks</h2>${(lg.member_squads||[]).map(fmtSquadLine).join("")}</div>`;
    } else if(!unlocked){
      mini+=`<div class="card"><h2>${esc(lg.name)} · picks</h2><p class="note">${esc(lg.picks_note||"Picks unlock after deadline.")}</p></div>`;
    }
  }
  const ov=(L.public||[]).find(p=>p.id===314)||{rank:D.team&&D.team.overall_rank};
  const ot=(L.overall_template||[]).map(x=>`<div class="chip">${esc(x.name)} · ${esc(x.club)} · ${x.own}%</div>`).join("")||`<p class="note">You own the overall template (25%+).</p>`;
  const od=(L.overall_diffs||[]).map(x=>`<div class="chip">${esc(x.name)} · ${esc(x.club)} · ${x.own}%</div>`).join("")||`<p class="note">No overall differentials under 12%.</p>`;
  document.getElementById("leagues").innerHTML=`<div class="warn">Mini-league tactics use 1st and 2nd, not Overall %.</div><div class="card"><h2>Overall</h2><p class="note">Rank <b>${fmt(ov.rank)}</b> · ${D.team.overall_points} pts</p><p class="note">Template missing (25%+)</p><div class="xi">${ot}</div><p class="note">Differentials (≤12%)</p><div class="xi">${od}</div></div>${mini}`;
}
renderLeagues();
const co=D.chips_official||{};
const FHNET=(D.fh_audit||(window.FPL_FH&&window.FPL_FH.audit)||null);
const CN=D.chip_net||{};
const CHIP_NET={bboost:CN.bboost||null,"3xc":CN["3xc"]||null,freehit:FHNET?{net:FHNET.net,note:FHNET.why}:null};
function chipRow(label,key){const gw=co[key];const used=gw!=null;const net=used&&CHIP_NET[key]?CHIP_NET[key].net:null;const note=used&&CHIP_NET[key]?CHIP_NET[key].note:"";return `<li><span class="who">${esc(label)}</span><span>${used?`<span class="pill used">Used GW${gw}</span>`:`<span class="pill free">Not used</span>`} ${used&&net!=null?`<b class="${net>=0?"pos":"neg"}">${sign(net)}</b>`:`<span class="note">—</span>`}</span><div class="detail">${esc(used?(note||"Net vs no chip."):"Still available.")}</div></li>`;}
document.getElementById("chips").innerHTML=`<div class="card"><h2>Chips</h2><ul class="chiplist">${chipRow("Bench Boost","bboost")}${chipRow("Triple Captain","3xc")}${chipRow("Free Hit","freehit")}${chipRow("Wildcard","wildcard")}</ul></div>`;
function srcChips(list){return (list||[]).map(s=>`<span class="pill free">${esc(s)}</span>`).join(" ");}
function freshnessMeta(obj, kind){
  const gen=obj.generated_at?toToronto(obj.generated_at):(obj.generated_at_et||"—");
  const cut=obj.cutoff?toToronto(obj.cutoff):"—";
  const bits=[`Scraped ${gen}`, `cutoff ${cut}`];
  if(obj.mode) bits.push("mode "+obj.mode);
  return `<p class="note">${bits.join(" · ")}</p>`;
}
function staleWarn(obj, kind){
  const gw=obj.gw!=null?("GW"+obj.gw):"this GW";
  if(kind==="news" && (obj.no_new || !(obj.new_articles||[]).length))
    return `<div class="warn">No new articles this run for ${gw}. Themes may be stale — check generated time.</div>`;
  if(kind==="x"){
    if((obj.mode||"manual")==="live"){
      if(obj.no_new || !(obj.new_posts||[]).length)
        return `<div class="warn">No new X posts this run for ${gw}. Themes may be stale — check generated time.</div>`;
      return "";
    }
    return `<div class="warn">X themes are manual/seeded until live ingest exists. Not a live scrape.</div>`;
  }
  return "";
}
function renderNews(){
  const N=window.FPL_NEWS||D.news||{};
  const agreed=(N.agreed||[]).map(x=>`<li><span class="who">${esc(x.text)}</span><div class="detail">${srcChips(x.sources)}</div></li>`).join("")||`<li><span class="note">No 3-site overlap yet.</span></li>`;
  const split=(N.split||[]).map(x=>`<li><span class="who">${esc(x.text)}</span><div class="detail">${srcChips(x.sources)}</div></li>`).join("")||`<li><span class="note">No splits logged.</span></li>`;
  const links=(N.links||[]).map(x=>`<a href="${safeHref(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`).join(" · ");
  const fresh=N.new_articles||[];
  const rawCap=8;
  const newBlock=fresh.length?fresh.slice(0,rawCap).map(x=>`<li><span class="who">${esc(x.title)}</span><div class="detail"><span class="pill free">${esc(x.source)}</span> <a href="${safeHref(x.url)}" target="_blank" rel="noopener">open</a></div></li>`).join("")+(fresh.length>rawCap?`<li><span class="note">+${fresh.length-rawCap} more this scrape — already folded into the themes above.</span></li>`:""):`<li><span class="note">No new articles this scrape.</span></li>`;
  document.getElementById("news").innerHTML=`${staleWarn(N,"news")}<div class="card"><h2>News · GW${N.gw||""}</h2>${freshnessMeta(N,"news")}<p class="note">Themes from title + article text. Emerging = 2 sites so far. Agreed = 3+ sites (consensus).</p></div><div class="card"><h2>Agreed for GW${N.gw||""}</h2><ul class="chiplist">${agreed}</ul></div><div class="card"><h2>Emerging (2 sources)</h2><ul class="chiplist">${split}</ul></div><div class="card"><details><summary><h2 style="display:inline">New since last scrape (${fresh.length})</h2></summary><p class="note">Raw articles just fetched this run — not analyzed yet, this is what feeds the consensus above.</p><ul class="chiplist">${newBlock}</ul></details></div><div class="card"><h2>Sources</h2><p class="note">${links||"Waiting."}</p></div>`;
}
renderNews();
function renderX(){
  const X=window.FPL_X||{};
  const live=(X.mode||"manual")==="live";
  const acc=(X.accounts||[]).map(a=>`<div class="chip">@${esc(a.handle||a)}</div>`).join("")||`<p class="note">No X accounts yet.</p>`;
  const agreed=(X.agreed||[]).map(x=>`<li><span class="who">${esc(x.text)}</span><div class="detail">${srcChips((x.sources||[]).map(s=>"@"+s))}</div></li>`).join("")||`<li><span class="note">${live?"No 3-handle overlap yet.":"No seeded agreed themes yet."}</span></li>`;
  const split=(X.split||[]).map(x=>`<li><span class="who">${esc(x.text)}</span><div class="detail">${srcChips((x.sources||[]).map(s=>"@"+s))}</div></li>`).join("")||`<li><span class="note">${live?"Nothing below the agreed threshold right now.":"No seeded items yet."}</span></li>`;
  const fresh=X.new_posts||[];
  const rawCap=8;
  const newBlock=fresh.length?fresh.slice(0,rawCap).map(p=>`<li><span class="who">@${esc(p.handle)}</span><div class="detail">${esc(p.text||"")}${p.url?` <a href="${safeHref(p.url)}" target="_blank" rel="noopener">open</a>`:""}${p.at?` <span class="note">${toToronto(p.at)}</span>`:""}</div></li>`).join("")+(fresh.length>rawCap?`<li><span class="note">+${fresh.length-rawCap} more this scrape — already folded into the consensus above.</span></li>`:""):`<li><span class="note">No new posts this scrape.</span></li>`;
  const liveBlock=live?`<div class="card"><details><summary><h2 style="display:inline">New since last scrape (${fresh.length})</h2></summary><p class="note">Raw posts just fetched this run — not analyzed yet, this is what feeds the consensus above.</p><ul class="chiplist">${newBlock}</ul></details></div>`:"";
  const splitH=live?`Emerging (2 sources)`:`Seeded emerging <span class="pill free">manual</span>`;
  const agreedH=live?`Agreed for GW${X.gw||""}`:`Seeded agreed for GW${X.gw||""} <span class="pill free">manual</span>`;
  const blurb=esc(X.note||(live?"Live X ingest. Emerging = 2 accounts so far. Agreed = 3+ accounts (consensus).":"Accounts to follow + seeded themes until live ingest exists."));
  document.getElementById("xtab").innerHTML=`${staleWarn(X,"x")}<div class="card"><h2>X · GW${X.gw||""}</h2>${freshnessMeta(X,"x")}<p class="note">${blurb}</p></div><div class="card"><h2>Accounts to follow</h2><div class="xi">${acc}</div></div><div class="card"><h2>${agreedH}</h2><ul class="chiplist">${agreed}</ul></div><div class="card"><h2>${splitH}</h2><ul class="chiplist">${split}</ul></div>${liveBlock}`;
}
renderX();
function renderFh(){
  const F=window.FPL_FH||{}; const A=Object.assign({}, F.audit||{}, (D.fh_audit||{}));
  // Once refresh.py auto-computes fh_audit for this GW, its own numbers/XIs are
  // the consistent source — fh.js's static xi/recs are one-off hand-written text
  // that can (and did) end up contradicting a corrected number, so don't mix
  // stale prose in under a fresh number once real data exists for this GW.
  const hasAuto = !!(D.fh_audit && D.fh_audit.gw === A.gw);
  const posOrder={GKP:0,DEF:1,MID:2,FWD:3};
  const xiChips=list=>(list||[]).slice().sort((a,b)=>(posOrder[a.pos]??9)-(posOrder[b.pos]??9)).map(p=>{
    const isCap=p.captain||p.mult>1||p.tag==="C";
    return `<div class="chip ${isCap?"ok":""}">${p.pos?esc(p.pos)+" · ":""}${esc(p.name)}${p.got!=null?" · "+p.got:""}${isCap?" (C)":""}</div>`;
  }).join("")||`<p class="note">No XI recorded.</p>`;
  const origXi=hasAuto?xiChips(D.fh_audit.original_xi):xiChips(A.original_xi);
  const fhXi=hasAuto?xiChips(D.fh_audit.fh_xi):xiChips((F.xi||[]).length?F.xi:A.fh_xi);
  const recs=hasAuto?"":(F.recs||[]).map(r=>`<li><span class="who">${esc(r.verdict)}</span><div class="detail">${esc(r.text)}</div></li>`).join("");
  document.getElementById("fh").innerHTML=`<div class="warn">GW${A.gw||F.gw||""} Free Hit is done.</div><div class="card"><h2>FH vs original</h2><p class="note">Net <b class="${cls(A.net)}">${sign(A.net)}</b> · Process ${esc(A.process||"?")}</p><p class="note">${esc(A.why||"")}</p><div class="compare2"><div><h3>Original · best process XI · ${A.original_points??"?"} pts${A.original_cap?" · C "+esc(A.original_cap):""}</h3><div class="xi">${origXi}</div></div><div><h3>Free Hit · played · ${A.fh_points??"?"} pts${A.fh_cap?" · C "+esc(A.fh_cap):""}</h3><div class="xi">${fhXi}</div></div></div></div>${recs?`<div class="card"><h2>Notes</h2><ul class="chiplist">${recs}</ul></div>`:""}`;
}
renderFh();
function renderStrategy(){
  const S=D.strategy||{};
  const STATUS_LABEL={used:"Used",open:"Open now",upcoming:"Not open yet",expired:"Expired"};
  const chips=(S.chips||[]).map(c=>{
    const wins=(c.windows||[]).map(w=>{
      const label=w.status==="used"?`Used GW${w.used_gw}`:w.status==="open"?`Open now (GW${w.start}-${w.stop})`:w.status==="upcoming"?`Opens GW${w.start}`:(STATUS_LABEL[w.status]||w.status);
      const kls=w.status==="open"?"ok":w.status==="used"?"sit":"";
      return `<div class="chip ${kls}">#${w.number} · ${esc(label)}</div>`;
    }).join("");
    return `<div class="card"><h2>${esc(c.label)}</h2><div class="xi">${wins}</div></div>`;
  }).join("");
  const H=S.hits||{};
  const hitsBlock=(H.rows&&H.rows.length)
    ?`<p class="note">Total hit cost <b class="neg">-${H.total_cost}</b> · Those moves netted <b class="${cls(H.total_moves_net)}">${sign(H.total_moves_net)}</b> · After cost <b class="${cls(H.net_after_cost)}">${sign(H.net_after_cost)}</b></p><ul class="chiplist">${H.rows.map(r=>`<li><span class="who">GW${r.gw}</span><div class="detail">Cost -${r.cost} · moves netted ${sign(r.moves_net)} · <b class="${r.paid_off?"pos":"neg"}">${r.paid_off?"Paid off":"Not worth it"}</b></div></li>`).join("")}</ul>`
    :`<p class="note">No hits taken this season.</p>`;
  const F=S.fixtures||{};
  const fRows=(F.rows||[]).map(r=>{
    const flags=[(r.blanks&&r.blanks.length)?`Blank: ${r.blanks.join(", ")}`:"",(r.doubles&&r.doubles.length)?`Double: ${r.doubles.join(", ")}`:""].filter(Boolean).join(" · ");
    return `<tr><td>GW${r.gw}</td><td>${r.avg_fdr??"-"}</td><td>${esc(flags)}</td></tr>`;
  }).join("");
  const easiest=F.easiest?`<p class="note">Easiest run: <b>GW${F.easiest.gw}</b> (avg FDR ${F.easiest.avg_fdr}) — a good week to sit tight rather than chip.</p>`:"";
  const hardest=F.hardest?`<p class="note">Toughest stretch: <b>GW${F.hardest.gw}</b> (avg FDR ${F.hardest.avg_fdr}) — worth watching for a Free Hit.</p>`:"";
  const blankNote=F.first_blank?`<p class="note">Blank gameweek ahead: <b>GW${F.first_blank.gw}</b> — ${esc(F.first_blank.blanks.join(", "))} have no fixture.</p>`:`<p class="note">No blank gameweeks detected in this window.</p>`;
  const doubleNote=F.first_double?`<p class="note">Double gameweek ahead: <b>GW${F.first_double.gw}</b> — ${esc(F.first_double.doubles.join(", "))} play twice. Bench Boost / Triple Captain candidate.</p>`:`<p class="note">No double gameweeks detected in this window.</p>`;
  document.getElementById("strategy").innerHTML=`<div class="card"><h2>Free transfers</h2><p class="note">You have <b>${S.free_transfers??"?"}</b> free transfer${S.free_transfers===1?"":"s"} banked for the next deadline.</p></div>${chips}<div class="card"><h2>Hits this season</h2>${hitsBlock}</div><div class="card"><h2>Fixture swing · next ${F.horizon||"?"} GWs</h2>${easiest}${hardest}${blankNote}${doubleNote}<table><thead><tr><th>GW</th><th>Avg FDR</th><th>Flags</th></tr></thead><tbody>${fRows}</tbody></table></div>`;
}
renderStrategy();
document.getElementById("foot").textContent="Leagues: Overall + ESL + Decision.";
</script></body></html>
