<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Shaaland · FPL Lab</title>
<link rel="stylesheet" href="dashboard.css?v=20260920c">
<style>footer a{color:var(--gold)}</style></head><body>
<header><div class="eyebrow">FPL Performance Lab</div><h1 id="teamName">Shaaland</h1><div class="sub" id="meta"></div></header>
<div class="kpis" id="kpis"></div>
<div class="deadline-bar" id="deadlineBanner"></div><div id="chipAlert"></div>
<nav class="tabs" id="tabs"></nav>
<section id="season" class="on"></section><section id="bench"></section><section id="transfers"></section>
<section id="plan"></section><section id="wildcard"></section><section id="strategy"></section><section id="stratFixtures"></section><section id="stratPlayers"></section><section id="stratDefcon"></section><section id="stratRotation"></section><section id="stratFormFdr"></section><section id="stratValue"></section><section id="stratPrice"></section><section id="target1"></section><section id="target3"></section><section id="target6"></section><section id="leagues"></section><section id="news"></section><section id="xtab"></section><section id="greekgod"></section><section id="fh"></section><section id="chips"></section>
<footer id="foot"></footer>
<script src="dashboard-common.js?v=20260920h"></script>
<script src="data.js?v=20260918e"></script>
<script src="bench-fix.js?v=20260918g"></script>
<script src="news.js?v=20260918e"></script>
<script src="x-posts.js?v=20260921a"></script>
<script src="fh.js?v=20260918e"></script>
<script src="plan-intel.js?v=20260918h"></script>
<script src="greekgod-archive.js?v=20260920a"></script>
<script src="shaaland-wildcard.js?v=20260920a"></script>
<script>
const D=window.FPL_DATA;
document.getElementById("teamName").textContent=D.team.name;
document.getElementById("meta").textContent=D.team.manager+" · ID "+D.team.id+" · updated "+(D.generated_at_et||toToronto(D.generated_at));
document.getElementById("kpis").innerHTML=[["Season points",D.team.overall_points],["Overall rank",fmt(D.team.overall_rank)],["Squad value","£"+D.team.value.toFixed(1)+"m"],["Bank","£"+D.team.bank.toFixed(1)+"m"]].map(([k,v])=>`<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join("");
startDeadlineBanner(D,"deadlineBanner");
document.getElementById("chipAlert").innerHTML=chipAlertBanner(D);
const TAB_GROUPS=[
  {id:"review",label:"Review",tabs:[["season","Season"],["bench","Bench"],["transfers","Transfers"],["chips","Chips"]]},
  {id:"plan",label:"Plan",tabs:[["plan","Next 2 GWs"],["fh","Free Hit"],["wildcard","Wildcard"]]},
  {id:"strategy",label:"Strategy",tabs:[["strategy","Chips & Hits"],["stratFixtures","Fixtures"],["stratPlayers","xG/xA"],["stratDefcon","DEFCON"],["stratRotation","Rotation"],["stratFormFdr","Form/FDR"],["stratValue","Value"],["stratPrice","Price radar"]]},
  {id:"target",label:"Target",tabs:[["target1","1 GW"],["target3","3 GW"],["target6","6 GW"]]},
  {id:"intel",label:"Intel",tabs:[["news","News"],["greekgod","GreekGod"]]},
  {id:"league",label:"Leagues",tabs:[["leagues","Leagues"]]}
];
let activeGroup="review", activeTab="season";
function paintTabs(){
  const g=TAB_GROUPS.find(x=>x.id===activeGroup)||TAB_GROUPS[0];
  const groups=TAB_GROUPS.map(x=>`<button class="group ${x.id===activeGroup?"on":""}" data-group="${x.id}">${x.label}</button>`).join("");
  // A group with only one tab has nothing to switch between, so the pill row
  // is just a lone, oddly-small-looking button — skip it for single-tab
  // groups (e.g. Leagues) instead of rendering a selector with one option.
  const pills=g.tabs.length>1?`<div class="tab-pills">${g.tabs.map(([id,label])=>`<button class="${id===activeTab?"on":""}" data-id="${id}">${label}</button>`).join("")}</div>`:"";
  document.getElementById("tabs").innerHTML=`<div class="tab-groups">${groups}</div>${pills}`;
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===activeTab));
}
document.getElementById("tabs").onclick=e=>{const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.group){activeGroup=b.dataset.group; const first=(TAB_GROUPS.find(x=>x.id===activeGroup)||{}).tabs||[]; if(!first.some(t=>t[0]===activeTab)) activeTab=first[0][0];}
  else if(b.dataset.id){activeTab=b.dataset.id; const owner=TAB_GROUPS.find(x=>x.tabs.some(t=>t[0]===activeTab)); if(owner) activeGroup=owner.id;}
  paintTabs();};
paintTabs();
function gwTable(){const rows=D.gameweeks.map(g=>{const chip=g.chip?` <span class="pill used">${esc(g.chip)}</span>`:"";return `<tr><td>GW${g.gw}${chip}</td><td><b>${g.points}</b></td><td>${g.field_avg??"-"}</td><td class="${cls(g.delta)}">${sign(g.delta)}</td><td>${g.bench}</td><td>${g.transfers}</td><td>${fmt(g.rank)}</td></tr>`;}).join("");return `<div class="card"><h2>Gameweek log</h2><table><thead><tr><th>GW</th><th>Pts</th><th>Field</th><th>d</th><th>Bench</th><th>Tr</th><th>OR</th></tr></thead><tbody>${rows}</tbody></table></div>`;}
document.getElementById("season").innerHTML=gwTable();
function chipClass(gw,name){const t=((D.bench_audit&&D.bench_audit[gw]&&D.bench_audit[gw].bench_tags)||{})[name];return t?"chip "+t:"chip sit";}
function bar(label,val,max,klass){const pct=Math.max(4,Math.round(100*val/Math.max(max,1)));return `<div class="barrow"><span>${label}</span><div class="track"><i class="${klass||""}" style="width:${pct}%"></i></div><b>${val}</b></div>`;}
function benchBlock(key,title){
  const b=D.bench_audit&&D.bench_audit[key]; if(!b)return"";
  const max=Math.max(b.you,b.process,b.hindsight,1);
  const yours=(b.your_bench||[]).map(x=>`<div class="${chipClass(key,x[0])}">${esc(x[0])} · ${x[1]}</div>`).join("");
  const should=(b.better_bench||[]).map(x=>`<div class="chip ok">${esc(x[0])} · ${x[1]}</div>`).join("");
  // "You" is the only bar that's a judgment: green if you matched/beat the
  // process benchmark (the best XI knowable pre-deadline), red if you fell
  // short of it. Process/Hindsight are reference lines, not verdicts — in
  // particular Hindsight is pure outcome (unknowable in advance), so coloring
  // it "bad" would imply you should have hit an unhittable target.
  const youKls=b.you>=b.process?"good":"bad";
  return `<div class="card"><h2>${title}</h2>${bar("You",b.you,max,youKls)}${bar("Process",b.process,max)}${bar("Hindsight",b.hindsight,max)}<p class="note">Your bench</p><div class="xi">${yours}</div><p class="note">Should have benched</p><div class="xi">${should}</div></div>`;
}
const benchKeys=Object.keys(D.bench_audit||{}).sort((a,b)=>Number(String(a).replace(/\D/g,""))-Number(String(b).replace(/\D/g,"")));
document.getElementById("bench").innerHTML=(benchKeys.length?benchKeys.map(k=>benchBlock(k,k.toUpperCase())).join(""):`<div class="card"><h2>Bench audit</h2><p class="note">No finished GW bench audit yet.</p></div>`)+`<ul class="note-list"><li>Green You = matched or beat the process benchmark; red You = fell short of it</li><li>Process/Hindsight are reference lines, not verdicts</li><li>Chips: green = correct sit, red = process miss, yellow = variance</li></ul>`;
function renderTransfers(){
  const rows=D.transfers||[];
  const total=rows.reduce((s,t)=>s+trNet(t),0);
  const by={}; for(const t of rows){const g=t.gw??"?"; by[g]=(by[g]||0)+trNet(t);}
  const gwLines=Object.keys(by).sort((a,b)=>Number(a)-Number(b)).map(g=>`<div class="chip">GW${g} · <b class="${cls(by[g])}">${sign(by[g])}</b></div>`).join("");
  const priceCell=t=>t.inn==="ROLL"?"–":`£${(t.out_price??0).toFixed(1)} → £${(t.in_price??0).toFixed(1)}`;
  const body=rows.map(t=>`<tr><td>GW${t.gw??"-"}</td><td>${esc(t.out)} → ${esc(t.inn)}</td><td>${priceCell(t)}</td><td class="${cls(trNet(t))}">${esc(t.net)}</td><td>${esc(t.verdict)}</td></tr>`).join("");
  document.getElementById("transfers").innerHTML=`<div class="card"><h2>Transfer points</h2><p class="note">Season net <b class="${cls(total)}">${sign(total)}</b></p><div class="xi">${gwLines}</div></div><div class="card"><h2>Transfers</h2><ul class="note-list"><li>Price = what you sold the outgoing player for → what you paid for the incoming player, per FPL's own transfer record</li></ul><table><thead><tr><th>GW</th><th>Move</th><th>Price</th><th>Net</th><th>Verdict</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
renderTransfers();
function newsCard(title, vs){
  const li=(arr,empty)=>arr.length?arr.map(raw=>{const x=esc(raw);return `<li><span class="who">${x.split(" · ")[0]}</span><div class="detail">${x.includes(" · ")?x.split(" · ").slice(1).join(" · "):x}</div></li>`;}).join(""):`<li><span class="note">${empty}</span></li>`;
  const cap=vs.caps[0]?`<p class="note">Captain check: ${esc(vs.caps[0])}</p>`:"";
  return `<div class="card"><h2>${title}</h2><p class="note">Own and agreed</p><ul class="chiplist">${li(vs.owned,"None of the agreed names are in this squad.")}</ul><p class="note">Missing and agreed</p><ul class="chiplist">${li(vs.missing,"You already own the agreed targets, or none were named.")}</ul><p class="note">Fade, but you still start them</p><ul class="chiplist">${li(vs.fade,"No fade conflict.")}</ul>${cap}</div>`;
}
function renderPlan(){
  const P=D.plan||{},up=P.upcoming||[];
  if(!up.length){document.getElementById("plan").innerHTML=`<div class="warn">Waiting for refresh.</div>`;return;}
  const heads=up.map(u=>`<th>GW${u.gw}</th>`).join("");
  const avail=P.availability||{};
  const rows=(P.rows||[]).map(r=>{
    const a=avail[r[1]]||null;
    const badge=a&&a.label?` <span class="pill used">${esc(a.label)}</span>`:"";
    let c=`<td>${esc(r[1])}${badge}</td><td>${esc(r[0])}</td>`;
    for(let i=0;i<up.length;i++){
      const xi=((P.xis||{})["gw"+up[i].gw]||{}).xi||[];
      const started=new Set(xi.map(n=>n.split(" (")[0]));
      let call=String(r[3+i*3])==="Blank"?"BLANK":(started.has(r[1])?"START":"SIT");
      c+=`<td>${esc(r[3+i*3])} <b class="${call==="START"?"pos":"neg"}">${call}</b></td>`;
    }
    return `<tr>${c}</tr>`;
  }).join("");
  const T=P.transfer||{}; const move=T.move;
  const actionLine=T.action==="TRANSFER"&&move?`${esc(move.out)} → ${esc(move.inn)}`:"Roll the free transfer";
  const squad=(P.rows||[]).map(r=>r[1]); const clubs={}; (P.rows||[]).forEach(r=>clubs[r[1]]=r[2]);
  const gw0=up[0]&&up[0].gw; const started=((((P.xis||{})["gw"+gw0]||{}).xi)||[]).map(n=>n.split(" (")[0]);
  const vs=newsVsSquad(squad, started, clubs);
  const benches=(P.bench_calls||[]).map(b=>`<div class="card"><h2>GW${b.gw} bench</h2><p class="note">Sit first: <b>${esc(b.worst||"-")}</b> · ${esc(b.why||"")}</p><div class="xi">${(b.sit||[]).map(x=>`<div class="chip sit">${esc(x)}</div>`).join("")}</div></div>`).join("");
  const I=(window.planIntel&&window.planIntel(D))||{};
  const dlHeads=up.map(u=>{
    const when=u.deadline?u.deadline:(u.deadline_utc?toToronto(u.deadline_utc):"");
    const lock=u.deadline_passed?` <span class="pill used">locked</span>`:"";
    return `<span class="note">GW${u.gw}${when?": "+when:""}${lock}</span>`;
  }).join(" · ");
  let intel="", vsLead="", newsBlock="";
  if(I.cleared||I.waiting){
    const wait=I.intelGw||(D.deadline&&D.deadline.intel_gw)||"?";
    intel=`<div class="warn">Waiting for GW${wait} intel — locked-GW News/X themes are cleared from Plan.</div><div class="card"><h2>Plan intel · GW${wait}</h2><p class="note"><b>${esc(I.moveLine||("Waiting for GW"+wait+" intel"))}</b></p><p class="note">${esc(I.reason||"")}</p><p class="note">Fixtures and bench below still cover the live/upcoming matchweeks. Chip and transfer consensus will refill when GW${wait} scrapes land.</p></div>`;
    vsLead=""; newsBlock="";
  } else {
    const chipLis=(I.chipRows||[]).map(r=>`<li><span class="who">GW${r.gw} · ${esc(r.label)}</span><span class="pill ${r.rec==="HOLD"||r.used?"used":"free"}">${esc(r.rec)}</span><div class="detail">${esc(r.why)}</div></li>`).join("");
    const opt=(I.optional||[]).map(x=>`<li><span class="note">${esc(x)}</span></li>`).join("");
    intel=`<div class="card"><h2>Chips · next 2 GWs</h2><p class="note">Calls use News + X plus chips you have already played.</p><ul class="chiplist">${chipLis||"<li><span class=note>Waiting for news.js.</span></li>"}</ul></div><div class="card"><h2>Transfers · ${esc(I.action||T.action||"ROLL")} · ${I.ft??T.ft_available??"?"} FT · bank £${(I.bank||0).toFixed?(I.bank||0).toFixed(1):I.bank}</h2><p class="note"><b>${esc(I.moveLine||actionLine)}</b></p><p class="note">${esc(I.reason||T.reason||"")}</p>${I.targets&&I.targets.length?`<p class="note">Agreed and missing: ${esc(I.targets.join(", "))}</p>`:""}${opt?`<ul class="chiplist">${opt}</ul>`:""}</div>`;
    const Ltac=I.league||{};
    const HEADING_BY_MODE={defend:"Defend the lead",climb:"Climb the table",chase:"Vs 1st & 2nd"};
    const heading=HEADING_BY_MODE[Ltac.mode]||"Vs 1st & 2nd";
    let threatBlock="";
    if(Ltac.mode==="defend"&&(Ltac.threat||[]).length){
      threatBlock=`<ul class="note-list">${Ltac.threat.map(t=>`<li>${esc(t)}</li>`).join("")}</ul><p class="note">They can still use their remaining chips — you can't match a Free Hit, Bench Boost, or Triple Captain again this half.</p>`;
    } else if(Ltac.mode==="climb"&&(Ltac.threat||[]).length){
      threatBlock=`<ul class="note-list">${Ltac.threat.map(t=>`<li>${esc(t)}</li>`).join("")}</ul><p class="note">1st and 2nd aren't this week's problem — closing the gap to the team right above you is.</p>`;
    }
    vsLead=`<div class="card"><h2>${esc(heading)}${Ltac.league?" · "+esc(Ltac.league):""}</h2>${threatBlock}<p class="note"><b>${esc(Ltac.cap||"Captain Haaland if the room owns him.")}</b></p><p class="note">${esc(Ltac.transfer||"")}</p>${(Ltac.start||[]).length?`<p class="note">Start these league diffs</p><div class="xi">${Ltac.start.map(x=>`<div class="chip ok">${esc(x)}</div>`).join("")}</div>`:""}${(Ltac.bench||[]).length?`<p class="note">Owned diffs that are sits — not tactics</p><div class="xi">${Ltac.bench.map(x=>`<div class="chip sit">${esc(x)}</div>`).join("")}</div>`:""}${(Ltac.wc||[]).length?`<p class="note">WC names this league barely owns</p><div class="xi">${Ltac.wc.map(x=>`<div class="chip">${esc(x)}</div>`).join("")}</div>`:""}</div>`;
    newsBlock=newsCard("News + X vs this squad",vs);
  }
  const injuryNote=Object.keys(avail).length?`<p class="note">Availability from FPL: ${esc(Object.entries(avail).map(([n,a])=>n+" "+(a.label||a.kind)).join(" · "))}</p>`:"";
  const TT=D.transfer_targets||{};
  const ttXgRows=(TT.xg||[]).map(r=>`<tr><td>${nameCell(r.name,r.club)}</td><td>${esc(r.pos)}</td><td>£${r.cost.toFixed(1)}</td><td>${r.xgi_p90}</td><td>${r.goals}+${r.assists}</td></tr>`).join("")||`<tr><td colspan="5"><span class="note">No qualifying non-owned players yet.</span></td></tr>`;
  const ttDcRows=(TT.defcon||[]).map(r=>`<tr><td>${nameCell(r.name,r.club)}</td><td>${esc(r.pos)}</td><td>£${r.cost.toFixed(1)}</td><td>${r.per90}/${r.threshold}</td></tr>`).join("")||`<tr><td colspan="4"><span class="note">No non-owned players reliably hitting the threshold yet.</span></td></tr>`;
  const targetsCard=`<div class="card"><h2>Transfer targets · not owned</h2><ul class="note-list"><li>Players you don't own yet (${TT.min_minutes??"?"}+ mins)</li><li>Same signals used to audit your own squad, scouted league-wide</li></ul><h3>Strong underlying (xGI per 90)</h3><table class="table-compact"><thead><tr><th style="width:36%">Player</th><th style="width:10%">Pos</th><th style="width:14%">Cost</th><th style="width:20%">xGI/90</th><th style="width:20%">G+A</th></tr></thead><tbody>${ttXgRows}</tbody></table><h3>Reliable DEFCON</h3><table class="table-compact"><thead><tr><th style="width:38%">Player</th><th style="width:12%">Pos</th><th style="width:16%">Cost</th><th style="width:34%">P90/Thr</th></tr></thead><tbody>${ttDcRows}</tbody></table></div>`;
  const W=window.FPL_WILDCARD_WATCH;
  const wildcardNote=(W&&W.chips&&W.chips.wildcard==="active")?`<div class="warn">You have Wildcard <b>active</b> for GW${W.gw} (${esc(W.status)} — captured ${esc(W.captured_at)}). See the Wildcard tab for the squad and captain call.</div>`:"";
  document.getElementById("plan").innerHTML=`${wildcardNote}${intel}${vsLead}${newsBlock}${benches}<div class="card"><h2>Fixtures</h2><p class="note">${dlHeads}</p>${injuryNote}<table><thead><tr><th>Player</th><th>Pos</th>${heads}</tr></thead><tbody>${rows}</tbody></table></div>${targetsCard}`;
}
renderPlan();
function renderWildcardWatch(){
  const W=window.FPL_WILDCARD_WATCH;
  if(!W){document.getElementById("wildcard").innerHTML=`<div class="card"><h2>Wildcard watch</h2><p class="note">No wildcard squad captured yet.</p></div>`;return;}
  const R=W.recommend||null;
  const epByName={};
  if(R){(R.xi_ep||[]).concat(R.bench_ep||[]).forEach(p=>epByName[p.name]=p);}
  const statusKls={out:"neg",doubt:"mid"};
  const head=`<thead><tr><th style="width:38%">Player</th><th style="width:12%">Pos</th><th style="width:28%">Fixture</th><th style="width:22%">EP</th></tr></thead>`;
  const row=p=>{
    const rp=epByName[p.name];
    const epVal=rp&&rp.ep_next!=null?rp.ep_next:"–";
    const kls=rp?(statusKls[rp.status]||""):"";
    const tag=p.captain?` <span class="pill used">C</span>`:p.vice?` <span class="pill free">VC</span>`:"";
    return `<tr><td>${nameCell(p.name,p.club)}${tag}</td><td>${esc(p.pos)}</td><td>${esc(p.fixture||"")}</td><td class="${kls}">${epVal}</td></tr>`;
  };
  const xiRows=(W.xi||[]).map(row).join("")||`<tr><td colspan="4"><span class="note">No XI captured.</span></td></tr>`;
  const benchRows=(W.bench||[]).map(row).join("")||`<tr><td colspan="4"><span class="note">No bench captured.</span></td></tr>`;

  let recCard;
  if(R){
    const yourCap=(W.xi||[]).find(p=>p.captain);
    const yourCapEp=yourCap&&epByName[yourCap.name]?epByName[yourCap.name].ep_next:null;
    const capDiffers=yourCap&&R.captain&&yourCap.name!==R.captain;
    const capLine=capDiffers
      ?`<p class="note">You captained <b>${esc(yourCap.name)}</b>${yourCapEp!=null?` (${yourCapEp} EP)`:""} — <b>${esc(R.captain)}</b> projects higher at <b>${R.captain_ep??"?"}</b> EP.</p>`
      :`<p class="note">Recommended captain matches your pick: <b>${esc(R.captain||"?")}</b> (${R.captain_ep??"?"} EP).</p>`;
    const viceLine=`<p class="note">Recommended vice: <b>${esc(R.vice||"?")}</b> (${R.vice_ep??"?"} EP).</p>`;
    const swapRows=(R.bench_swaps||[]).map(s=>`<li><span class="who">${esc(s.bench)} (${s.bench_ep}) over ${esc(s.starter)} (${s.starter_ep})</span><div class="detail">This bench player projects higher than a starter in the same position — worth reconsidering before the deadline.</div></li>`).join("")||`<li><span class="note">No bench player currently out-projects a starter in their position.</span></li>`;
    const flagRows=(R.availability_flags||[]).map(f=>`<li><span class="who">${esc(f.name)}</span> <span class="pill used">${esc(f.label||"Flagged")}</span></li>`).join("")||`<li><span class="note">No injury/doubt flags on this squad right now.</span></li>`;
    recCard=`<div class="card"><h2>Captain &amp; bench recommendation</h2><ul class="note-list"><li>Based on FPL's own ep_next (form + fixture blended prediction for next GW)</li><li>Recomputed every refresh — a pre-deadline read, not a locked call</li></ul>${capLine}${viceLine}<p class="note">Bench-swap watch</p><ul class="chiplist">${swapRows}</ul><p class="note">Availability flags</p><ul class="chiplist">${flagRows}</ul></div>`;
  } else {
    recCard=`<div class="card"><h2>Captain &amp; bench recommendation</h2><p class="note">Not computed yet — lands after the next refresh run.</p></div>`;
  }

  const WT=W.worth_tracker||null;
  const wtDeltaCls=d=>d==null?"":d>0?"neg":d<0?"pos":"";
  let worthCard;
  if(WT){
    const wtHead=`<thead><tr><th style="width:40%">Player</th><th style="width:20%">Then</th><th style="width:20%">Now</th><th style="width:20%">Δ</th></tr></thead>`;
    const wtRow=p=>{
      const statusTag=p.status==="removed"?` <span class="pill used">Dropped</span>`:p.status==="added"?` <span class="pill free">Added</span>`:"";
      const thenCell=p.baseline_cost!=null?`£${p.baseline_cost.toFixed(1)}`:"–";
      const nowCell=p.current_cost!=null?`£${p.current_cost.toFixed(1)}`:"–";
      const deltaCell=p.delta!=null?`<span class="${wtDeltaCls(p.delta)}">${sign(p.delta)}</span>`:"–";
      return `<tr><td>${esc(p.name)}${statusTag}</td><td>${thenCell}</td><td>${nowCell}</td><td>${deltaCell}</td></tr>`;
    };
    const wtRows=(WT.players||[]).map(wtRow).join("")||`<tr><td colspan="4"><span class="note">No target squad captured yet.</span></td></tr>`;
    const logLi=e=>{
      if(e.event==="captured") return `<li><span class="who">${esc(e.date)}</span><div class="detail">${esc(e.detail)}</div></li>`;
      if(e.event==="price_change") return `<li><span class="who">${esc(e.date)} · ${esc(e.player)}</span><div class="detail">£${e.from.toFixed(1)} → £${e.to.toFixed(1)} (<span class="${wtDeltaCls(e.delta)}">${sign(e.delta)}</span>)</div></li>`;
      if(e.event==="removed") return `<li><span class="who">${esc(e.date)} · ${esc(e.player)}</span><div class="detail">Dropped from target squad at £${e.price_at_change.toFixed(1)}</div></li>`;

  const fhOpen=chipIsOpen("freehit"), bbOpen=chipIsOpen("bboost"), tcOpen=chipIsOpen("3xc");
  const NO_LIVE_CHIP="No live FH/BB/TC this half. Sit tight or Wildcard.";
  const easiest=F.easiest?`<p class="note">Easiest run: <b>GW${F.easiest.gw}</b> (avg FDR ${F.easiest.avg_fdr}) — a good week to sit tight rather than chip.</p>`:"";
  const hardest=F.hardest?`<p class="note">Toughest stretch: <b>GW${F.hardest.gw}</b> (avg FDR ${F.hardest.avg_fdr}) — ${fhOpen?"worth watching for a Free Hit.":NO_LIVE_CHIP}</p>`:"";
  const blankNote=F.first_blank?`<p class="note">Blank gameweek ahead: <b>GW${F.first_blank.gw}</b> — ${esc(F.first_blank.blanks.join(", "))} have no fixture.</p>`:`<p class="note">No blank gameweeks detected in this window.</p>`;
  const doubleNote=F.first_double?`<p class="note">Double gameweek ahead: <b>GW${F.first_double.gw}</b> — ${esc(F.first_double.doubles.join(", "))} play twice. ${(bbOpen||tcOpen)?"Bench Boost / Triple Captain candidate.":NO_LIVE_CHIP}</p>`:`<p class="note">No double gameweeks detected in this window.</p>`;
  const XG=D.xg_signal||{};
  const xgTagText=r=>{
    const bits=[];
    if(r.tag==="overperforming") bits.push("Sell-high");
    if(r.tag==="underperforming") bits.push("Buy-low");
    if(r.gc_tag==="riding_luck") bits.push("D:luck");
    if(r.gc_tag==="unlucky") bits.push("D:unlucky");
    return bits.length?bits.join(" / "):"On track";
  };
  const xgTagCls=r=>{
    if(r.tag==="overperforming"||r.gc_tag==="riding_luck") return "neg";
    if(r.tag==="underperforming"||r.gc_tag==="unlucky") return "pos";
    return "";
  };
  const xgDiffCls=r=>r.tag==="overperforming"?"neg":r.tag==="underperforming"?"pos":"";
  const xgHead=`<thead><tr><th style="width:33%">Player</th><th style="width:10%">Pos</th><th style="width:22%">G+A/xGI</th><th style="width:13%">Diff</th><th style="width:22%">Tag</th></tr></thead>`;
  const xgRow=r=>`<tr><td>${nameCell(r.name,r.club)}</td><td>${esc(r.pos)}</td><td>${r.gi}/${r.xgi}</td><td class="${xgDiffCls(r)}">${sign(r.diff)}</td><td class="${xgTagCls(r)}">${xgTagText(r)}</td></tr>`;
  const xgRows=(XG.rows||[]).map(xgRow).join("")||`<tr><td colspan="5"><span class="note">No squad players with ${XG.min_minutes??"?"}+ minutes yet.</span></td></tr>`;
  const xgTopHead=`<thead><tr><th style="width:36%">Player</th><th style="width:10%">Pos</th><th style="width:14%">Cost</th><th style="width:20%">xGI/90</th><th style="width:20%">G+A</th></tr></thead>`;
  const xgTopRow=r=>`<tr><td>${nameCell(r.name,r.club)}</td><td>${esc(r.pos)}</td><td>£${r.cost.toFixed(1)}</td><td>${r.xgi_p90}</td><td>${r.goals}+${r.assists}</td></tr>`;
  const xgTopRows=(XG.top||[]).map(xgTopRow).join("")||`<tr><td colspan="5"><span class="note">No qualifying players yet.</span></td></tr>`;
  const xgRegHead=`<thead><tr><th style="width:38%">Player</th><th style="width:10%">Pos</th><th style="width:26%">G+A/xGI</th><th style="width:26%">Diff</th></tr></thead>`;
  const xgRegRow=r=>`<tr><td>${nameCell(r.name,r.club)}</td><td>${esc(r.pos)}</td><td>${r.gi}/${r.xgi}</td><td class="${xgDiffCls(r)}">${sign(r.diff)}</td></tr>`;
  const xgOverRows=(XG.top_over||[]).map(xgRegRow).join("")||`<tr><td colspan="4"><span class="note">No qualifying players yet.</span></td></tr>`;
  const xgUnderRows=(XG.top_under||[]).map(xgRegRow).join("")||`<tr><td colspan="4"><span class="note">No qualifying players yet.</span></td></tr>`;
  const xgCard=`<div class="card"><h2>Underlying numbers (xG/xA)</h2><ul class="note-list"><li>All squad players with ${XG.min_minutes??"?"}+ mins</li><li>Actual goal involvements (or goals conceded for DEF/GKP) vs FPL's own expected numbers</li><li>${XG.threshold??2}+ difference flagged "due for regression" or "still creating chances" — not a form gut-feel</li></ul><h3>Your squad</h3><table class="table-compact">${xgHead}<tbody>${xgRows}</tbody></table><h3>Top ${XG.top_n??"?"} xGI/90 · league-wide</h3><table class="table-compact">${xgTopHead}<tbody>${xgTopRows}</tbody></table><h3>Top overperforming (sell-high) · league-wide</h3><table class="table-compact">${xgRegHead}<tbody>${xgOverRows}</tbody></table><h3>Top underperforming (buy-low) · league-wide</h3><table class="table-compact">${xgRegHead}<tbody>${xgUnderRows}</tbody></table><ul class="legend-list"><li>G+A/xGI = actual goal involvements vs FPL's own expected number</li><li>Diff = G+A minus xGI — red means overperforming (sell-high risk), green means underperforming (patience/buy-low)</li><li>Tag: Sell-high/Buy-low are the attacking signal; D:luck/D:unlucky (DEF/GKP only) flags goals conceded vs expected</li></ul></div>`;
  const DC=D.defcon||{};
  const dcTagLabel=r=>r.tag==="reliable"?"Yes":r.tag==="borderline"?"Close":"No";
  const dcTagCls=r=>r.tag==="reliable"?"pos":r.tag==="borderline"?"mid":"";
  const dcHead=`<thead><tr><th style="width:38%">Player</th><th style="width:12%">Pos</th><th style="width:26%">P90/Thr</th><th style="width:24%">Hits it</th></tr></thead>`;
  const dcRow=r=>`<tr><td>${nameCell(r.name,r.club)}</td><td>${esc(r.pos)}</td><td>${r.per90}/${r.threshold}</td><td class="${dcTagCls(r)}">${dcTagLabel(r)}</td></tr>`;
  const dcRows=(DC.rows||[]).map(dcRow).join("")||`<tr><td colspan="4"><span class="note">No qualifying squad players yet.</span></td></tr>`;
  const dcTopHead=`<thead><tr><th style="width:34%">Player</th><th style="width:10%">Pos</th><th style="width:14%">Cost</th><th style="width:22%">P90/Thr</th><th style="width:20%">Hits it</th></tr></thead>`;
  const dcTopRow=r=>`<tr><td>${nameCell(r.name,r.club)}</td><td>${esc(r.pos)}</td><td>£${r.cost.toFixed(1)}</td><td>${r.per90}/${r.threshold}</td><td class="${dcTagCls(r)}">${dcTagLabel(r)}</td></tr>`;
  const dcTopRows=(DC.top||[]).map(dcTopRow).join("")||`<tr><td colspan="5"><span class="note">No qualifying players yet.</span></td></tr>`;
  const dcCard=`<div class="card"><h2>Defensive Contribution (DEFCON)</h2><ul class="note-list"><li>Squad outfield players (${DC.min_minutes??"?"}+ mins) vs the 2-pt defensive-actions threshold</li><li>"Hits it" = Yes/Close/No — green reliably clears it most matches</li><li>A real differentiator most casual managers ignore</li></ul><h3>Your squad</h3><table class="table-compact">${dcHead}<tbody>${dcRows}</tbody></table><h3>Top ${DC.top_n??"?"} · league-wide</h3><table class="table-compact">${dcTopHead}<tbody>${dcTopRows}</tbody></table><ul class="legend-list"><li>P90/Thr = combined defensive actions per 90 min vs the threshold needed (10 for DEF, 12 for MID/FWD — clearances+blocks+interceptions+tackles, plus recoveries for MID/FWD)</li></ul></div>`;
  const RR=D.rotation_risk||{};
  const rrGws=RR.gws||[];
  const rrTagLabel={falling:"Falling",declining:"Declining",rising:"Rising",starter:"Starter",fringe:"Fringe",mixed:"Mixed"};
  const rrKls={falling:"neg",declining:"neg",rising:"pos",mixed:"mid"};
  const rrWhy=r=>{
    if(r.reason==="injury"){const lbl=r.avail_label||"Flagged"; return `<span class="neg">${esc(lbl.replace("DOUBT ",""))}</span>`;}
    if(r.reason==="rotation") return `<span class="pos">Rotation</span>`;
    if(r.reason==="rested") return `<span class="mid">Rested</span>`;
    return "–";
  };
  const rrRows=(RR.rows||[]).map(r=>`<tr><td>${nameCell(r.name,r.club)}</td><td>${esc(r.pos)}</td><td>${r.minutes.join(" → ")}</td><td class="${rrKls[r.trend]||""}">${rrTagLabel[r.trend]||esc(r.trend)}</td><td>${rrWhy(r)}</td></tr>`).join("")||`<tr><td colspan="5"><span class="note">Not enough finished GWs yet for a trend.</span></td></tr>`;
  const rrExtra=(RR.rows||[]).filter(r=>r.news||r.rotation_note).map(r=>`<li><span class="who">${esc(r.name)}</span><div class="detail">${esc(r.rotation_note||r.news)}</div></li>`).join("");
  const rrCard=`<div class="card"><h2>Rotation &amp; injury risk</h2><ul class="note-list"><li>Real-world minutes over the last ${rrGws.length||"?"} finished GWs${rrGws.length?` (GW${rrGws[0]}-GW${rrGws[rrGws.length-1]})`:""}</li><li>Cross-checked against FPL's own injury/suspension status</li><li>Catches someone sliding out of the XI before it shows up as a bench-audit miss</li></ul><table class="table-compact"><thead><tr><th style="width:32%">Player</th><th style="width:10%">Pos</th><th style="width:24%">Mins</th><th style="width:16%">Trend</th><th style="width:18%">Why</th></tr></thead><tbody>${rrRows}</tbody></table><ul class="legend-list"><li>Mins = minutes in each of the last ${rrGws.length||"?"} finished GWs, oldest → newest</li><li>Falling = was starting (${RR.start_mins??60}+ mins), now fringe/bench</li><li>Declining = still starting but starts getting shorter</li><li>Rising = breaking into the side</li><li>Why: a status flag (INJ/DOUBT/SUS) explains the drop; "Rotation" = fit per FPL, but a Champions League/Europa/domestic-cup tie or general rotation is already reported elsewhere; "Rested" = fit, dropped, and no other-competition explanation found — worth watching</li></ul>${rrExtra?`<ul class="chiplist">${rrExtra}</ul>`:""}</div>`;
  const FF=D.form_fdr||{};
  const ffRatioCls=v=>v==null?"":v>=2.5?"pos":v<=0.8?"neg":"";
  const ffHead=`<thead><tr><th style="width:32%">Player</th><th style="width:13%">Cost</th><th style="width:13%">Form</th><th style="width:24%">Fixture</th><th style="width:18%">Ratio</th></tr></thead>`;
  const ffRow=r=>`<tr><td>${nameCell(r.name,r.club)}</td><td>£${r.cost.toFixed(1)}</td><td>${r.form}</td><td>${esc(r.fixture)}${r.fdr!=null?" FDR"+r.fdr:""}</td><td class="${ffRatioCls(r.ratio)}">${r.ratio??"–"}</td></tr>`;
  const ffTables=["GKP","DEF","MID","FWD"].map(pos=>{
    const posRows=((FF.by_pos||{})[pos]||[]).map(ffRow).join("")||`<tr><td colspan="5"><span class="note">No qualifying players yet.</span></td></tr>`;
    return `<h3>${pos}</h3><table class="table-compact">${ffHead}<tbody>${posRows}</tbody></table>`;
  }).join("");
  const ffCard=`<div class="card"><h2>Form / FDR ratio</h2><ul class="note-list"><li>Top ${FF.top_n??"?"} per position, league-wide (${FF.min_minutes??"?"}+ mins)</li><li>Recent form ÷ next fixture's difficulty (1 easiest – 5 hardest)</li><li>A hot player facing a hard game and a cold player with a soft one won't read the same as two separate numbers</li></ul>${ffTables}<ul class="legend-list"><li>Form = FPL's own average points over the last 30 days</li><li>Ratio = Form ÷ next fixture's FDR — green ≥2.5 (in form, easy game), red ≤0.8 (cold and/or tough)</li><li>Blank fixture = no ratio</li></ul></div>`;
  const PR=D.price_radar||{};
  const priceRow=r=>{
    const todayMark=r.changed_today?`<span class="${cls(r.cost_change_today)}">${r.cost_change_today>0?"▲":"▼"}</span>`:"";
    const deltaCell=`<span class="${cls(r.season_change)}">${sign(r.season_change)}</span>→<span class="${cls(r.expected_season_change)}">${sign(r.expected_season_change)}</span>`;
    return `<tr><td>${nameCell(r.name,r.club)}</td><td>${esc(r.pos)}</td><td>£${r.cost.toFixed(1)}${todayMark}</td><td class="${cls(r.momentum)}">${sign(r.momentum)}%</td><td>${deltaCell}</td></tr>`;
  };
  const priceHead=`<thead><tr><th style="width:32%">Player</th><th style="width:10%">Pos</th><th style="width:14%">Cost</th><th style="width:18%">NetTr</th><th style="width:26%">Price Δ</th></tr></thead>`;
  const squadRows=(PR.squad||[]).map(priceRow).join("")||`<tr><td colspan="5"><span class="note">No squad price data yet.</span></td></tr>`;
  const watchRows=(PR.watch||[]).map(priceRow).join("")||`<tr><td colspan="5"><span class="note">No wildcard-watch or Target-6 names outside your squad right now.</span></td></tr>`;
  const priceCard=`<div class="deadline-bar" id="priceCountdown"></div><div class="card"><h2>Price-change radar</h2><ul class="note-list"><li>Approximated from today's net transfers scaled by ownership</li><li>FPL has never published its exact price-change algorithm</li><li>Scoped to the decision set — your squad, wildcard-watch names, and the WC shortlist — not the whole market</li></ul><h3>Your squad</h3><table class="table-compact">${priceHead}<tbody>${squadRows}</tbody></table><h3>Wildcard watch &amp; WC shortlist</h3><table class="table-compact">${priceHead}<tbody>${watchRows}</tbody></table><ul class="legend-list"><li>NetTr = today's net transfers (in minus out) as a % of the player's own current owners — comparable across low- and high-ownership players</li><li>Price Δ = total change since the start of the season → projected total if tonight's change follows today's momentum</li><li>▲/▼ = already moved today</li><li>FPL only ever moves a price by £0.1m at a time — the projection is a direction call, not a probability</li></ul></div>`;
  const VB=D.value_board||{};
  const valueHead=`<thead><tr><th style="width:44%">Player</th><th style="width:18%">Cost</th><th style="width:16%">Pts</th><th style="width:22%">Pts/£1m</th></tr></thead>`;
  const valueRow=r=>`<tr><td>${nameCell(r.name,r.club)}</td><td>£${r.cost.toFixed(1)}</td><td>${r.points}</td><td><b>${r.value_per_1m}</b></td></tr>`;
  const valueTables=["GKP","DEF","MID","FWD"].map(pos=>{
    const posRows=((VB.by_pos||{})[pos]||[]).map(valueRow).join("")||`<tr><td colspan="4"><span class="note">No qualifying players yet.</span></td></tr>`;
    return `<h3>${pos}</h3><table class="table-compact">${valueHead}<tbody>${posRows}</tbody></table>`;
  }).join("");
  const valueCard=`<div class="card"><h2>Best points per £1m</h2><ul class="note-list"><li>Top ${VB.top_n??"?"} value picks per position, league-wide (${VB.min_minutes??"?"}+ mins to filter out small-sample flukes)</li><li>Recomputed every refresh from current points and price</li><li>Moves as returns and prices change — not a fixed list</li></ul>${valueTables}</div>`;
  document.getElementById("strategy").innerHTML=`<div class="card"><h2>Free transfers</h2><p class="note">You have <b>${S.free_transfers??"?"}</b> free transfer${S.free_transfers===1?"":"s"} banked for the next deadline.</p></div>${chips}${p2p3Card}<div class="card"><h2>Hits this season</h2>${hitsBlock}</div>`;
  document.getElementById("stratFixtures").innerHTML=`<div class="card"><h2>Fixture swing · next ${F.horizon||"?"} GWs</h2>${easiest}${hardest}${blankNote}${doubleNote}<table class="table-compact"><thead><tr><th style="width:15%">GW</th><th style="width:18%">FDR</th><th style="width:67%">Flags</th></tr></thead><tbody>${fRows}</tbody></table><ul class="legend-list"><li>FDR = fixture difficulty rating (1 easiest – 5 hardest), averaged across your squad's clubs playing that week</li></ul></div>`;
  document.getElementById("stratPlayers").innerHTML=xgCard;
  document.getElementById("stratDefcon").innerHTML=dcCard;
  document.getElementById("stratRotation").innerHTML=rrCard;
  document.getElementById("stratFormFdr").innerHTML=ffCard;
  document.getElementById("stratValue").innerHTML=valueCard;
  document.getElementById("stratPrice").innerHTML=priceCard;
  startPriceCountdown("priceCountdown");
}
renderStrategy();
function renderTargets(){
  const T=D.targets||{};
  const H=T.horizons||{};
  const scoreCls=s=>s>=5?"pos":s<0?"neg":"";
  const tgtHead=`<thead><tr><th style="width:24%">Player</th><th style="width:10%">Pos</th><th style="width:12%">Cost</th><th style="width:15%">Score</th><th style="width:39%">Why</th></tr></thead>`;
  const buildCard=key=>{
    const h=H[key]||{};
    const n=h.horizon??Number(key);
    const rows=(h.top||[]).map(r=>`<tr><td>${nameCell(r.name,r.club)}</td><td>${esc(r.pos)}</td><td>£${r.cost.toFixed(1)}</td><td class="${scoreCls(r.score)}"><b>${r.score}</b></td><td style="white-space:normal">${esc((r.why||[]).join(" · ")||"–")}</td></tr>`).join("")||`<tr><td colspan="5"><span class="note">No qualifying players yet.</span></td></tr>`;
    return `<div class="card"><h2>Target · next ${n} GW${n===1?"":"s"}</h2><ul class="note-list"><li>League-wide shortlist combining Strategy tab signals (form, xGI/90, DEFCON, value, xG/xA regression) with Intel tab's News/X consensus</li><li>Score is a plain point count, not a hidden formula — see the Why column and legend below</li><li>Excludes anyone FPL itself flags as unavailable (${T.min_minutes??"?"}+ mins played to qualify)</li></ul><table class="table-compact">${tgtHead}<tbody>${rows}</tbody></table><ul class="legend-list"><li>In form = FPL form ≥6.0 (+2)</li><li>Strong xGI = xG+xA per 90 ≥0.5, non-GKP (+2)</li><li>Reliable DEFCON = clears the defensive-actions threshold for their position (+1)</li><li>Great value = top 25% points-per-£1m for their position (+1)</li><li>Due a return = underperforming their xGI by 2+ (buy-low signal) (+1) · Sell-high risk = overperforming their xGI by 2+ (-1)</li><li>Kind run = average fixture difficulty ≤2.6 over this horizon (+1)</li><li>News/X backed = tagged a transfer target in Intel coverage (+1) · Fade signal = tagged fade/sell or injury/doubt (-1)</li><li>Doubt = FPL flags a fitness doubt — shown, never scored</li></ul></div>`;
  };
  document.getElementById("target1").innerHTML=buildCard("1");
  document.getElementById("target3").innerHTML=buildCard("3");
  document.getElementById("target6").innerHTML=buildCard("6");
}
renderTargets();
document.getElementById("foot").innerHTML=`<a href="bacalhau.html">Bacalhau</a> · Leagues: Overall + ESL + Decision.`;
</script></body></html>
