<section id="plan"></section><section id="wildcard"></section><section id="strategy"></section><section id="stratFixtures"></section><section id="stratPlayers"></section><section id="stratDefcon"></section><section id="stratRotation"></section><section id="stratFormFdr"></section><section id="stratValue"></section><section id="stratPrice"></section><section id="stratInjury"></section><section id="target1"></section><section id="target3"></section><section id="target6"></section><section id="leagues"></section><section id="news"></section><section id="setPieces"></section><section id="fh"></section><section id="chips"></section>
<footer id="foot"></footer>

<script>
const W={"You":"You","you":"you","Your":"Your","own":"you don't own"}; // wording for the shared renderers in dashboard-common.js

const D=window.FPL_DATA;
document.getElementById("teamName").textContent=D.team.name;
document.getElementById("meta").textContent=D.team.manager+" · ID "+D.team.id+" · updated "+(D.generated_at_et||toToronto(D.generated_at));
document.getElementById("kpis").innerHTML=[["Season points",D.team.overall_points],["Overall rank",fmt(D.team.overall_rank)],[(D.team.live_value!=null?"Sell value":"Squad value"),"£"+Number(D.team.live_value??D.team.value).toFixed(1)+"m"],["Bank","£"+Number(D.team.bank).toFixed(1)+"m"]].map(([k,v])=>`<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join("");
startDeadlineBanner(D,"deadlineBanner");
document.getElementById("chipAlert").innerHTML=chipAlertBanner(D);
loadLive("Shaaland");
const TAB_GROUPS=[
  {id:"review",label:"Review",tabs:[["season","Season"],["bench","Bench"],["captain","Captain"],["transfers","Transfers"],["chips","Chips"]]},
  {id:"ai",label:"AI team",tabs:[["aiPlan","Plan"],["aiResults","Results"]]},
  {id:"plan",label:"Plan",tabs:[["plan","Next 2 GWs"],["fh","Free Hit"],["wildcard","Wildcard"]]},
  {id:"strategy",label:"Strategy",tabs:[["strategy","Chips & Hits"],["stratFixtures","Fixtures"],["stratPlayers","XGA"],["stratDefcon","DEFCON"],["stratFormFdr","Form/FDR"],["stratValue","Value"]]},
  {id:"target",label:"Target",tabs:[["target1","1 GW"],["target3","3 GW"],["target6","6 GW"]]},
  {id:"intel",label:"Intel",tabs:[["news","News"],["stratInjury","Injury"],["stratRotation","Rotation"],["stratPrice","Price radar"],["setPieces","Set pieces"]]},
  {id:"league",label:"Leagues",tabs:[["leagues","Leagues"]]}
];
let activeGroup="review", activeTab="season";
// Phone: Plan / Target / More. More reveals the other groups.
if(matchMedia("(max-width:720px)").matches){
  const bar=document.getElementById("tabs");
  const simple=document.createElement("div");
  simple.className="phone-nav";
  simple.innerHTML=`<button data-go="plan">Plan</button><button data-go="target">Target</button><button data-go="more">More</button>`;
  bar.parentNode.insertBefore(simple, bar);
  simple.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    const go=b.dataset.go;
    simple.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    if(go==="more"){ bar.classList.toggle("phone-open"); return; }
    bar.classList.remove("phone-open");
    const g=TAB_GROUPS.find(x=>x.id===go);
    if(g){ activeGroup=g.id; activeTab=g.tabs[0][0]; if(typeof paintTabs==="function") paintTabs(); }
  });
}
const TAB_KEY="fpl-lab:tab:shaaland";
{const r=restoreTab(TAB_GROUPS,TAB_KEY,activeGroup,activeTab); activeGroup=r.group; activeTab=r.tab;}
document.getElementById("tabs").onclick=e=>{const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.group){activeGroup=b.dataset.group; const first=(TAB_GROUPS.find(x=>x.id===activeGroup)||{}).tabs||[]; if(!first.some(t=>t[0]===activeTab)) activeTab=first[0][0];}
  else if(b.dataset.id){activeTab=b.dataset.id; const owner=TAB_GROUPS.find(x=>x.tabs.some(t=>t[0]===activeTab)); if(owner) activeGroup=owner.id;}
  paintTabs();};
window.addEventListener("hashchange",()=>{const r=restoreTab(TAB_GROUPS,TAB_KEY,activeGroup,activeTab); if(r.tab!==activeTab){activeGroup=r.group; activeTab=r.tab; paintTabs();}});
paintTabs();
document.getElementById("season").innerHTML=dailyCheckCard(D)+gwTable();
const benchKeys=Object.keys(D.bench_audit||{}).sort((a,b)=>Number(String(b).replace(/\D/g,""))-Number(String(a).replace(/\D/g,"")));  // newest GW first
document.getElementById("bench").innerHTML=(benchKeys.length?benchKeys.map((k,i)=>benchBlock(k,k.toUpperCase(),i===0)).join(""):`<div class="card"><h2>Bench audit</h2><p class="note">No finished GW bench audit yet.</p></div>`)+`<ul class="note-list"><li>Green You = matched or beat the process benchmark; red You = fell short of it</li><li>Process/Hindsight are reference lines, not verdicts</li><li>Chips: green = correct sit, red = process miss, yellow = variance</li></ul>`;
renderCaptain(D);
renderAiTeam(D,"you");
function renderTransfers(){
  const rows=D.transfers||[];
  const total=rows.reduce((s,t)=>s+trNet(t),0);
  const by={}; for(const t of rows){const g=t.gw??"?"; by[g]=(by[g]||0)+trNet(t);}
  const gwLines=Object.keys(by).sort((a,b)=>Number(a)-Number(b)).map(g=>`<div class="chip">GW${g} · <b class="${cls(by[g])}">${sign(by[g])}</b></div>`).join("");
  const priceCell=t=>t.inn==="ROLL"?"–":`£${(t.out_price??0).toFixed(1)} → £${(t.in_price??0).toFixed(1)}`;
  const body=rows.map(t=>`<tr><td>GW${t.gw??"-"}</td><td>${esc(t.out)} → ${esc(t.inn)}</td><td>${t.chip?"–":priceCell(t)}</td><td class="${cls(trNet(t))}">${t.chip?"–":esc(t.net)}</td><td>${esc(t.verdict)}</td></tr>`).join("");
  const FL=D.ft_ledger||{};
  const ftRows=(FL.rows||[]).map(r=>`<tr><td>GW${r.gw}${r.chip?` <span class="pill used">${r.chip==="freehit"?"FH":"WC"}</span>`:""}</td><td>${r.had==null?"–":r.had}</td><td>${r.made}${r.chip?" (free)":""}</td><td class="${r.hit?"neg":""}">${r.hit?"−"+r.hit*4:"–"}</td><td><b>${r.left}</b></td></tr>`).join("");
  const ftCard=ftRows?`<div class="card"><h2>Free transfers · ${FL.next??"?"} for GW${FL.next_gw??"?"}</h2><ul class="note-list"><li>+1 free transfer each GW, banked up to 5; each transfer uses one, extras cost −4</li><li>Free Hit / Wildcard weeks: moves are free and the bank is carried through unchanged (nothing used, nothing added)</li><li>GW1 is the initial squad, so it banks nothing</li></ul><table class="table-compact"><thead><tr><th style="width:26%">GW</th><th style="width:18%">Had</th><th style="width:24%">Made</th><th style="width:16%">Hit</th><th style="width:16%">Left</th></tr></thead><tbody>${ftRows}</tbody></table></div>`:"";
  document.getElementById("transfers").innerHTML=ftCard+`<div class="card"><h2>Transfer points</h2><p class="note">Season net <b class="${cls(total)}">${sign(total)}</b></p><div class="xi">${gwLines}</div></div><div class="card"><h2>Transfers</h2><ul class="note-list"><li>Price = what you sold the outgoing player for → what you paid for the incoming player, per FPL's own transfer record</li></ul><table><thead><tr><th>GW</th><th>Move</th><th>Price</th><th>Net</th><th>Verdict</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
renderTransfers();
function renderPlan(){
  const P=D.plan||{},up=P.upcoming||[];
  if(!up.length){document.getElementById("plan").innerHTML=`<div class="warn">Waiting for refresh.</div>`;return;}
  const heads=up.map(u=>`<th>GW${u.gw}</th>`).join("");
  const avail=P.availability||{};
  const rows=(P.rows||[]).map(r=>{
    const a=avail[r[1]]||null;
    const badge=a&&a.label?` <span class="pill used">${esc(a.label)}</span>`:"";
    let c=`<td>${esc(r[1])}${badge}</td><td>${esc(r[0])}</td>`;
    for(let i=0;i<up.length;i++){
      const xi=((P.xis||{})["gw"+up[i].gw]||{}).xi||[];
      const started=new Set(xi.map(n=>String(n).split(" (")[0]));
      let call=String(r[3+i*3])==="Blank"?"BLANK":(started.has(r[1])?"START":"SIT");
      c+=`<td>${esc(r[3+i*3])} <b class="${call==="START"?"pos":"neg"}">${call}</b></td>`;
    }
    return `<tr>${c}</tr>`;
  }).join("");
  const T=P.transfer||{}; const move=T.move;
  const actionLine=T.action==="TRANSFER"&&move?`${esc(move.out)} → ${esc(move.inn)}`:"Roll the free transfer";
  const squad=(P.rows||[]).map(r=>r[1]); const clubs={}; (P.rows||[]).forEach(r=>clubs[r[1]]=r[2]);
  const gw0=up[0]&&up[0].gw; const started=((((P.xis||{})["gw"+gw0]||{}).xi)||[]).map(n=>String(n).split(" (")[0]);
  const vs=newsVsSquad(squad, started, clubs);
  const benches=(P.bench_calls||[]).map(b=>`<div class="card"><h2>GW${b.gw} bench</h2><p class="note">Sit first: <b>${esc(b.worst||"-")}</b> · ${esc(b.why||"")}</p><div class="xi">${(b.sit||[]).map(x=>`<div class="chip sit">${esc(x)}</div>`).join("")}</div></div>`).join("");
  const I=(window.planIntel&&window.planIntel(D))||{};
  const dlHeads=up.map(u=>{
    const when=u.deadline?u.deadline:(u.deadline_utc?toToronto(u.deadline_utc):"");
    const lock=u.deadline_passed?` <span class="pill used">locked</span>`:"";
    return `<span class="note">GW${u.gw}${when?": "+when:""}${lock}</span>`;
  }).join(" · ");
  let intel="", vsLead="", newsBlock="";
  if(I.cleared||I.waiting){
    const wait=I.intelGw||(D.deadline&&D.deadline.intel_gw)||"?";
    intel=`<div class="warn">Waiting for GW${wait} intel — locked-GW News themes are cleared from Plan.</div><div class="card"><h2>Plan intel · GW${wait}</h2><p class="note"><b>${esc(I.moveLine||("Waiting for GW"+wait+" intel"))}</b></p><p class="note">${esc(I.reason||"")}</p><p class="note">Fixtures and bench below still cover the live/upcoming matchweeks. Chip and transfer consensus will refill when GW${wait} scrapes land.</p></div>`;
    vsLead=""; newsBlock="";
  } else {
    const chipAllUsed=(I.chipRows||[]).length>0&&(I.chipRows||[]).every(r=>r.used);
    const chipLis=chipAllUsed?`<li><span class="note">All chips for this half are used. They reset at GW20.</span></li>`:(I.chipRows||[]).map(r=>`<li><span class="who">GW${r.gw} · ${esc(r.label)}</span><span class="pill ${r.rec==="HOLD"||r.used?"used":"free"}">${esc(r.rec)}</span><div class="detail">${esc(r.why)}</div></li>`).join("");
    const opt=(I.optional||[]).map(x=>`<li><span class="note">${esc(x)}</span></li>`).join("");
    intel=`<div class="card"><h2>Chips · next 2 GWs</h2><p class="note">Calls use News plus chips you have already played.</p><ul class="chiplist">${chipLis||"<li><span class=note>Waiting for news.js.</span></li>"}</ul></div><div class="card"><h2>Transfers · ${esc(I.action||T.action||"ROLL")} · ${I.ft??T.ft_available??"?"} FT · bank £${(I.bank||0).toFixed?(I.bank||0).toFixed(1):I.bank}</h2><p class="note"><b>${esc(I.moveLine||actionLine)}</b></p><p class="note">${esc(I.reason||T.reason||"")}</p>${I.targets&&I.targets.length?`<p class="note">Agreed and missing: ${esc(I.targets.join(", "))}</p>`:""}${opt?`<ul class="chiplist">${opt}</ul>`:""}</div>`;
    const Ltac=I.league||{};
    const HEADING_BY_MODE={defend:"Defend the lead",climb:"Climb the table",chase:"Vs 1st & 2nd"};
    const heading=HEADING_BY_MODE[Ltac.mode]||"Vs 1st & 2nd";
    let threatBlock="";
    if(Ltac.mode==="defend"&&(Ltac.threat||[]).length){
      threatBlock=`<ul class="note-list">${Ltac.threat.map(t=>`<li>${esc(t)}</li>`).join("")}</ul><p class="note">They can still use their remaining chips — you can't match a Free Hit, Bench Boost, or Triple Captain again this half.</p>`;
    } else if(Ltac.mode==="climb"&&(Ltac.threat||[]).length){
      threatBlock=`<ul class="note-list">${Ltac.threat.map(t=>`<li>${esc(t)}</li>`).join("")}</ul><p class="note">1st and 2nd aren't this week's problem — closing the gap to the team right above you is.</p>`;
    }
    vsLead=`<div class="card"><h2>${esc(heading)}${Ltac.league?" · "+esc(Ltac.league):""}</h2>${threatBlock}<p class="note"><b>${esc(Ltac.cap||"Captain Haaland if the room owns him.")}</b></p><p class="note">${esc(Ltac.transfer||"")}</p>${(Ltac.start||[]).length?`<p class="note">Start these league diffs</p><div class="xi">${Ltac.start.map(x=>`<div class="chip ok">${esc(x)}</div>`).join("")}</div>`:""}${(Ltac.bench||[]).length?`<p class="note">Owned diffs that are sits — not tactics</p><div class="xi">${Ltac.bench.map(x=>`<div class="chip sit">${esc(x)}</div>`).join("")}</div>`:""}${(Ltac.wc||[]).length?`<p class="note">WC names this league barely owns</p><div class="xi">${Ltac.wc.map(x=>`<div class="chip">${esc(x)}</div>`).join("")}</div>`:""}</div>`;
    newsBlock=newsCard("News vs this squad",vs);
  }
  const injuryNote=Object.keys(avail).length?`<p class="note">Availability from FPL: ${esc(Object.entries(avail).map(([n,a])=>n+" "+(a.label||a.kind)).join(" · "))}</p>`:"";
  const TT=D.transfer_targets||{};
  const ttXgRows=(TT.xg||[]).map(r=>`<tr><td>${nameCell(r.name,r.club)}${sigNote(r)}</td><td>${esc(r.pos)}</td><td>£${r.cost.toFixed(1)}</td><td>${Number(r.xgi_p90).toFixed(2)}</td><td>${r.goals}+${r.assists}</td></tr>`).join("")||`<tr><td colspan="5"><span class="note">No qualifying non-owned players yet.</span></td></tr>`;
  const ttDcRows=(TT.defcon||[]).map(r=>`<tr><td>${nameCell(r.name,r.club)}${sigNote(r)}</td><td>${esc(r.pos)}</td><td>£${r.cost.toFixed(1)}</td><td>${r.per90}/${r.threshold}</td></tr>`).join("")||`<tr><td colspan="4"><span class="note">No non-owned players reliably hitting the threshold yet.</span></td></tr>`;
  const targetsCard=`<div class="card"><h2>Transfer targets · not owned</h2><ul class="note-list"><li>Players you don't own yet (${TT.min_minutes??"?"}+ mins)</li><li>Same signals used to audit your own squad, scouted league-wide</li></ul><h3>Strong underlying (xGI per 90)</h3><table class="table-compact"><thead><tr><th style="width:36%">Player</th><th style="width:10%">Pos</th><th style="width:14%">Cost</th><th style="width:20%">xGI/90</th><th style="width:20%">G+A</th></tr></thead><tbody>${ttXgRows}</tbody></table><h3>Reliable DEFCON</h3><table class="table-compact"><thead><tr><th style="width:38%">Player</th><th style="width:12%">Pos</th><th style="width:16%">Cost</th><th style="width:34%">P90/Thr</th></tr></thead><tbody>${ttDcRows}</tbody></table></div>`;
  const W=window.FPL_WILDCARD_WATCH;
  const wildcardNote=(W&&W.chips&&W.chips.wildcard==="active")?`<div class="warn">You have Wildcard <b>active</b> for GW${W.gw} (${esc(W.status)} — captured ${esc(W.captured_at)}). See the Wildcard tab for the squad and captain call.</div>`:"";
  function doThisCard(D){
  const step=((D.planner||{}).steps||[])[0]||{};
  const tr=(D.plan&&D.plan.transfer&&D.plan.transfer.move)||null;
  const cap=step.captain||"—";
  const vice=step.vice||"";
  const ft=(D.plan&&D.plan.transfer&&D.plan.transfer.ft_available)||0;
  const move=tr?esc(tr.out)+" → "+esc(tr.inn):"No transfer";
  const chips='<div class="do-row"><b>CHIPS</b><span>All four already used</span></div>';
  const league='<div class="do-row"><b>LEAGUE</b><span>2nd · −2 vs 1st</span></div>';
  const news='<div class="do-row"><b>FPL NEWS</b><span>Open Intel for injuries and flags</span></div>';
  return `<div class="card do-this"><h2>Do this</h2><div class="do-grid"><div class="do-tile"><span class="do-k">Captain</span><b>${esc(cap)}</b><span>${vice?"vice "+esc(vice):"this gameweek"}</span></div><div class="do-tile"><span class="do-k">Transfer</span><b>${move}</b><span>${ft} free transfer${ft===1?"":"s"}</span></div></div>${chips}${league}${news}</div>`;
}
document.getElementById("plan").innerHTML=`${doThisCard(D)}${thisGwCard(D)}${plannerCardCompact(D)}${wildcardNote}${intel}${vsLead}${newsBlock}${benches}<div class="card"><h2>Fixtures</h2><p class="note">${dlHeads}</p>${injuryNote}<table><thead><tr><th>Player</th><th>Pos</th>${heads}</tr></thead><tbody>${rows}</tbody></table></div>${targetsCard}`;
}
renderPlan();
function renderWildcardWatch(){
  const W=window.FPL_WILDCARD_WATCH;
  if(!W){document.getElementById("wildcard").innerHTML=`<div class="card"><h2>Wildcard watch</h2><p class="note">No wildcard squad captured yet.</p></div>`;return;}
  const R=W.recommend||null;
  const epByName={};
  if(R){(R.xi_ep||[]).concat(R.bench_ep||[]).forEach(p=>epByName[p.name]=p);}
  const statusKls={out:"neg",doubt:"mid"};
  const head=`<thead><tr><th style="width:38%">Player</th><th style="width:12%">Pos</th><th style="width:28%">Fixture</th><th style="width:22%">EP</th></tr></thead>`;
  const row=p=>{
    const rp=epByName[p.name];
    const epVal=rp&&rp.ep_next!=null?rp.ep_next:"–";
    const kls=rp?(statusKls[rp.status]||""):"";
    const tag=p.captain?` <span class="pill used">C</span>`:p.vice?` <span class="pill free">VC</span>`:"";
    return `<tr><td>${nameCell(p.name,p.club)}${tag}</td><td>${esc(p.pos)}</td><td>${esc(p.fixture||"")}</td><td class="${kls}">${epVal}</td></tr>`;
  };
  const xiRows=(W.xi||[]).map(row).join("")||`<tr><td colspan="4"><span class="note">No XI captured.</span></td></tr>`;
  const benchRows=(W.bench||[]).map(row).join("")||`<tr><td colspan="4"><span class="note">No bench captured.</span></td></tr>`;

  let recCard;
  if(R){
    const yourCap=(W.xi||[]).find(p=>p.captain);
    const yourCapEp=yourCap&&epByName[yourCap.name]?epByName[yourCap.name].ep_next:null;
    const capDiffers=yourCap&&R.captain&&yourCap.name!==R.captain;
    const capLine=capDiffers
      ?`<p class="note">Your captain: <b>${esc(yourCap.name)}</b>${yourCapEp!=null?` (${yourCapEp} EP)`:""} · model pick: <b>${esc(R.captain)}</b> (${R.captain_ep??"?"} EP).</p>`
      :`<p class="note">Recommended captain matches your pick: <b>${esc(R.captain||"?")}</b> (${R.captain_ep??"?"} EP).</p>`;
    const yourVice=(W.xi||[]).find(p=>p.vice);
    const viceDiffers=yourVice&&R.vice&&yourVice.name!==R.vice;
    const viceLine=`<p class="note">Recommended vice: <b>${esc(R.vice||"?")}</b> (${R.vice_ep??"?"} EP)${viceDiffers?` — your vice is <b>${esc(yourVice.name)}</b>${epByName[yourVice.name]&&epByName[yourVice.name].ep_next!=null?` (${epByName[yourVice.name].ep_next} EP)`:""}`:""}.</p>`;
    const benchOrderLine=(R.bench_order&&R.bench_order.length)?`<p class="note">${R.bench_order_changed?"Suggested bench order (auto-subs go in this order — yours differs)":"Bench order looks right"}: ${R.bench_order.map((n,i)=>`${i+1}. <b>${esc(n)}</b>${epByName[n]&&epByName[n].ep_next!=null?` (${epByName[n].ep_next})`:""}${epByName[n]&&epByName[n].status&&epByName[n].status!=="ok"?` <span class="pill used">${esc(epByName[n].status)}</span>`:""}`).join(" → ")}</p>`:"";
    const swapRows=(R.bench_swaps||[]).map(s=>`<li><span class="who">${esc(s.bench)} (${s.bench_ep}) over ${esc(s.starter)} (${s.starter_ep})</span><div class="detail">This bench player projects higher than a starter in the same position — worth reconsidering before the deadline.</div></li>`).join("")||`<li><span class="note">No bench player currently out-projects a starter in their position.</span></li>`;
    const flagRows=(R.availability_flags||[]).map(f=>`<li><span class="who">${esc(f.name)}</span> <span class="pill used">${esc(f.label||"Flagged")}</span></li>`).join("")||`<li><span class="note">No injury/doubt flags on this squad right now.</span></li>`;
    recCard=`<div class="card"><h2>Captain &amp; bench recommendation</h2><ul class="note-list"><li>Based on the program's own expected points for the next gameweek (xG/xA model, fixture, minutes security, availability) — not FPL's ep_next, which just repeats last week's form · a doubtful player (under 75% to play) isn't picked as captain or vice · each starter is offered up for swap only once</li><li>Recomputed every refresh — a pre-deadline read, not a locked call</li></ul>${capLine}${viceLine}${benchOrderLine}<p class="note">Bench-swap watch</p><ul class="chiplist">${swapRows}</ul><p class="note">Availability flags</p><ul class="chiplist">${flagRows}</ul></div>`;
  } else {
    recCard=`<div class="card"><h2>Captain &amp; bench recommendation</h2><p class="note">Not computed yet — lands after the next refresh run.</p></div>`;
  }

  const WT=W.worth_tracker||null;
  const wtDeltaCls=cls;  // same colours as the Price-change radar: up = green, down = red
  let worthCard;
  if(WT){
    const wtHead=`<thead><tr><th style="width:37%">Player</th><th style="width:15%">Then</th><th style="width:15%">Now</th><th style="width:15%">Δ</th><th style="width:18%">New Δ</th></tr></thead>`;
    const wtRow=p=>{

  const squadRows=(PR.squad||[]).map(priceRow).join("")||`<tr><td colspan="6"><span class="note">No squad price data yet.</span></td></tr>`;

  const priceCard=`<div class="deadline-bar" id="priceCountdown"></div><div class="card"><h2>Price-change radar</h2><ul class="note-list"><li>FPL's own price-change progress (percent of the way to tonight's rise or fall; ±90% or more projects a move), with net transfers scaled by ownership alongside</li><li>FPL has never published its exact price-change algorithm</li><li>Scoped to the decision set — your squad, wildcard-watch names, and the WC shortlist — not the whole market</li></ul><h3>Your squad</h3><table class="table-compact">${priceHead}<tbody>${squadRows}</tbody></table><h3>Wildcard watch &amp; WC shortlist</h3><table class="table-compact">${priceHead}<tbody>${watchRows}</tbody></table><ul class="legend-list"><li>NetTr = this gameweek's net transfers (in minus out) as a % of the player's own current owners — comparable across low- and high-ownership players</li><li>Price Δ = total change since the start of the season → projected total if the current swing turns into a change</li><li>▲/▼ = already moved today</li><li>ETA = how many consecutive days this player's momentum has leaned the same way, tracked ourselves refresh over refresh (FPL never published its real threshold, so this can't be exact) — "Soon" after 3+ same-direction days, "Trend Nd" earlier in a trend, "Flat" if it's noise-level or just flipped direction. Gets more reliable as more days of history build up</li><li>FPL only ever moves a price by £0.1m at a time — the projection is a direction call, not a probability</li></ul></div>`;
  const VB=D.value_board||{};
  const valueHead=`<thead><tr><th style="width:44%">Player</th><th style="width:18%">Cost</th><th style="width:16%">Pts</th><th style="width:22%">Pts/£1m</th></tr></thead>`;
  const valueRow=r=>`<tr><td>${nameCell(r.name,r.club)}</td><td>£${r.cost.toFixed(1)}</td><td>${r.points}</td><td><b>${r.value_per_1m}</b></td></tr>`;
  const valueTables=["GKP","DEF","MID","FWD"].map(pos=>{
    const posRows=((VB.by_pos||{})[pos]||[]).map(valueRow).join("")||`<tr><td colspan="4"><span class="note">No qualifying players yet.</span></td></tr>`;
    return `<h3>${pos}</h3><table class="table-compact">${valueHead}<tbody>${posRows}</tbody></table>`;
  }).join("");
  const valueCard=`<div class="card"><h2>Best points per £1m</h2><ul class="note-list"><li>Top ${VB.top_n??"?"} value picks per position among players you don't own (${VB.min_minutes??"?"}+ mins to filter out small-sample flukes)</li><li>Recomputed every refresh from current points and price</li><li>Moves as returns and prices change — not a fixed list</li></ul>${valueTables}</div>`;
  // "This week at a glance": everything below already covers the full season/
  // horizon in depth, but that means scanning ~10 cards to find what's
  // actually actionable right now. This pulls only the imminent bits (a
  // chip window closing, a fixture swing inside the next GW, prices that
  // already moved today) into one digest — each line gated on it actually
  // being current, same rule chipIsOpen/NO_LIVE_CHIP already enforces below,
  // so this never shows stale advice the full cards wouldn't also show.
  const nextGw=(D.deadline&&D.deadline.next_gw)||null;
  const digest=[`<b>${S.free_transfers??"?"}</b> free transfer${S.free_transfers===1?"":"s"} banked for GW${nextGw??"?"}.`];
  (S.chips||[]).forEach(c=>{
    (c.windows||[]).forEach(w=>{
      if(w.status==="open" && nextGw!=null && (w.stop-nextGw)<=2){
        const left=w.stop-nextGw+1;      // GW next..stop are all still playable
        digest.push(`<b>${esc(c.label)}</b> window closes after GW${w.stop} — ${left<=1?"last chance this half.":`${left} GW${left===1?"":"s"} left this half.`}`);
      }
    });
  });
  if(F.hardest && nextGw!=null && F.hardest.gw<=nextGw+1){
    digest.push(`Toughest stretch lands <b>GW${F.hardest.gw}</b> (avg FDR ${F.hardest.avg_fdr})${fhOpen?" — Free Hit is live if you want it.":""}`);
  }
  if(F.first_blank && nextGw!=null && F.first_blank.gw<=nextGw+1){
    digest.push(`Blank gameweek incoming: <b>GW${F.first_blank.gw}</b> — ${esc(F.first_blank.blanks.join(", "))}.`);
  }
  if(F.first_double && nextGw!=null && F.first_double.gw<=nextGw+1){
    digest.push(`Double gameweek incoming: <b>GW${F.first_double.gw}</b> — ${esc(F.first_double.doubles.join(", "))}${(bbOpen||tcOpen)?" — chip window is live.":""}`);
  }
  const movedToday=[...(PR.squad||[]),...(PR.watch||[])].filter(r=>r.changed_today);
  if(movedToday.length){
    digest.push(`${movedToday.length} price move${movedToday.length===1?"":"s"} already locked in today: ${movedToday.map(r=>esc(r.name)+(r.cost_change_today>0?" ▲":" ▼")).join(", ")}.`);
  }
  const digestCard=`<div class="card"><h2>This week at a glance</h2><ul class="note-list">${digest.map(d=>`<li>${d}</li>`).join("")}</ul></div>`;
  document.getElementById("strategy").innerHTML=`${digestCard}${chips}${p2p3Card}<div class="card"><h2>Hits this season</h2>${hitsBlock}</div>`;
  document.getElementById("stratFixtures").innerHTML=`<div id="swingHost"></div>`+fixtureTickerCard(F,"you")+`<div class="card"><h2>Blank and double gameweeks</h2>${blankNote}${doubleNote}</div>`;
  {const host=document.getElementById("swingHost"); host.innerHTML=fixtureSwingCard(D); initFixtureSwing(host,D);}
  document.getElementById("stratPlayers").innerHTML=xgCard;
  document.getElementById("stratDefcon").innerHTML=dcCard;
  document.getElementById("stratRotation").innerHTML=rrCard;
  document.getElementById("stratFormFdr").innerHTML=ffCard;
  document.getElementById("stratValue").innerHTML=valueCard;
  document.getElementById("stratPrice").innerHTML=priceCard;
  startPriceCountdown("priceCountdown");
  const IW=D.injury_watch||{};
  const injStatusCls=r=>r.status==="out"?"neg":"mid";
  const yoursTag=r=>r.yours?` <span class="pill free">Yours</span>`:"";
  const globalRows=(IW.rows||[]).slice(0, IW.top_n??15);
  const injRows=globalRows.map(r=>`<tr><td>${nameCell(r.name,r.club)}${yoursTag(r)}</td><td>${esc(r.pos)}</td><td>£${r.cost.toFixed(1)}</td><td>${r.owned_pct}%</td><td class="${injStatusCls(r)}">${esc(r.label||r.status)}</td></tr>`).join("")||`<tr><td colspan="5"><span class="note">No high-ownership injury/doubt flags right now.</span></td></tr>`;
  const LW=IW.league||null;
  const leagueRows=((LW&&LW.rows)||[]).map(r=>`<tr><td>${nameCell(r.name,r.club)}${yoursTag(r)}</td><td>${esc(r.pos)}</td><td>£${r.cost.toFixed(1)}</td><td title="${r.league_own}/${LW.n??"?"} rivals own">${r.league_eo!=null?r.league_eo+"%":"–"}</td><td class="${injStatusCls(r)}">${esc(r.label||r.status)}</td></tr>`).join("")||`<tr><td colspan="5"><span class="note">No out/doubtful players currently owned in ${esc((LW&&LW.name)||"your league")}.</span></td></tr>`;
  const injuryCard=`<div class="card"><h2>Injury watch</h2><h3>Highest ownership · league-wide</h3><ul class="note-list"><li>Top ${IW.top_n??"?"} most-owned players league-wide currently flagged out or doubtful by FPL</li><li>Ownership % — not true Effective Ownership, FPL doesn't publish global captaincy rates to weight it by</li><li>A widely-owned player's injury swings a lot of teams' gameweeks, possibly yours too</li></ul><table class="table-compact"><thead><tr><th style="width:32%">Player</th><th style="width:10%">Pos</th><th style="width:14%">Cost</th><th style="width:18%">Owned%</th><th style="width:26%">Status</th></tr></thead><tbody>${injRows}</tbody></table><h3>${esc((LW&&LW.name)||"Your mini-league")}</h3><ul class="note-list"><li>Out/doubtful players at least one rival in ${esc((LW&&LW.name)||"your league")} owns, ranked by Effective Ownership (EO) among your ${LW&&LW.n?LW.n+" ":""}rivals — your own team is left out</li><li>EO = how many of their points the average rival squad collects, from rivals' squads at the last deadline: benched 0, starting 1×, captain 2×, triple captain 3×</li><li>Hover a percentage for the number of rival teams that own him</li></ul><table class="table-compact"><thead><tr><th style="width:32%">Player</th><th style="width:10%">Pos</th><th style="width:14%">Cost</th><th style="width:18%">EO%</th><th style="width:26%">Status</th></tr></thead><tbody>${leagueRows}</tbody></table></div>`;
  document.getElementById("stratInjury").innerHTML=injuryCard;
}
renderStrategy();
renderTargets();
document.getElementById("foot").innerHTML=`<a href="bacalhau.html">Bacalhau</a> · Leagues: Overall + ESL + Decision.`;

// New app shell (PLAN / TARGET / MORE) around everything rendered above.
try{labShell(D,{team:"Shaaland",key:"shaaland"});}catch(e){console.warn("labShell",e);}
</script></body></html>
