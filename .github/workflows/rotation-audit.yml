name: Rotation audit
on:
  push:
    branches: [claude/rotation-audit]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python rotation_audit.py
