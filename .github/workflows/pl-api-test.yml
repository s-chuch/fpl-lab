name: pl-api-test
on:
  push:
    branches: [pl-api-test]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          H=(-H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36" -H "Origin: https://www.premierleague.com" -H "Referer: https://www.premierleague.com/" -H "Accept: application/json")
          t() { echo "=== $1"; curl -s --compressed --max-time 30 "${H[@]}" -o /tmp/o.txt -w "HTTP %{http_code}\n" "$1"; head -c 500 /tmp/o.txt; echo; }
          B=https://footballapi.pulselive.com/football/stats/ranked/players
          for e in big_chances_created big_chance_created ontarget_scoring_att total_scoring_att goals goal_assist; do
            t "$B/$e?comps=1&compSeasons=841&pageSize=3"
          done
          echo "=== shape big_chances_created 841"
          curl -s --compressed --max-time 30 "${H[@]}" "$B/big_chances_created?comps=1&compSeasons=841&pageSize=1" | python3 -c "import sys,json; d=json.load(sys.stdin); c=d['stats']['content']; print(d['stats']['pageInfo']); print(json.dumps(c[0])[:900] if c else 'EMPTY')"
          echo "=== shape ontarget 841"
          curl -s --compressed --max-time 30 "${H[@]}" "$B/ontarget_scoring_att?comps=1&compSeasons=841&pageSize=1" | python3 -c "import sys,json; d=json.load(sys.stdin); c=d['stats']['content']; print(d['stats']['pageInfo']); print(json.dumps(c[0])[:1200] if c else 'EMPTY')"
