name: Refresh FPL data

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 20 * * *"
    - cron: "0 16 * * 6"
    - cron: "0 22 * * 6"
    - cron: "0 22 * * 0"
    - cron: "0 8 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "refresh.py"
      - "news_scrape.py"
      - ".github/workflows/refresh.yml"

concurrency:
  group: refresh-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m py_compile news_scrape.py refresh.py

      - name: Pull live FPL data
        run: |
          python news_scrape.py
          python refresh.py
          python refresh.py --team 1360920 --out bacalhau-data.js

      - name: Commit data files if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js bacalhau-data.js news.js
          if git diff --staged --quiet; then
            echo "No data change"
          else
            git commit -m "Refresh FPL data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin main
          fi
