name: Refresh FPL data

on:
  schedule:
    # Daily catch-up (08:00 and 20:00 UTC)
    - cron: "0 8 * * *"
    - cron: "0 20 * * *"
    # Saturday after early + late kicks
    - cron: "0 16 * * 6"
    - cron: "0 22 * * 6"
    # Sunday after the late games
    - cron: "0 22 * * 0"
    # Monday morning after any Monday night fixture
    - cron: "0 8 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "refresh.py"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull live FPL data
        run: python refresh.py

      - name: Commit data.js if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --staged --quiet; then
            echo "No data change"
          else
            git commit -m "Refresh FPL data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
