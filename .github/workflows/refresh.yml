name: Refresh FPL data

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 20 * * *"
    - cron: "0 16 * * 6"
    - cron: "0 22 * * 6"
    - cron: "0 22 * * 0"
    # AI team lock window: fires every 30 minutes but the first step skips the run unless it falls
    # in the hour after "12h before the next gameweek deadline" (see ai_team.py LOCK_HOURS).
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "refresh.py"
      - "fixtures_external.py"
      - "ai_team.py"
      - "understat.py"
      - "stamp_versions.py"
      - "fpl_common.py"
      - "dashboard-common.js"
      - "dashboard.css"
      - "plan-intel.js"
      - "fh.js"
      - "shaaland-wildcard.js"
      - "bacalhau-wildcard.js"
      - "index.html"
      - "bacalhau.html"
      - "news_scrape.py"
      - ".github/workflows/refresh.yml"

concurrency:
  group: refresh-main
  # false: a push must not kill a scheduled run mid-step; runs queue per group.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A failing job emails the repo owner by default (GitHub notification), so no
    # extra alerting is wired up here.
    timeout-minutes: 20
    steps:
      - name: Gate the 30-minute AI-lock runs
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, json, urllib.request
          from datetime import datetime, timedelta, timezone
          run = True
          if os.environ.get("EVENT") == "schedule" and os.environ.get("CRON") == "*/30 * * * *":
              run = False
              try:
                  req = urllib.request.Request("https://fantasy.premierleague.com/api/bootstrap-static/", headers={"User-Agent": "ShaalandFPLLab/1.0"})
                  events = json.load(urllib.request.urlopen(req, timeout=30))["events"]
                  now = datetime.now(timezone.utc)
                  for e in events:
                      dl = datetime.fromisoformat(e["deadline_time"].replace("Z", "+00:00"))
                      if dl > now:
                          lock = dl - timedelta(hours=12)
                          run = lock <= now < lock + timedelta(minutes=75)
                          break
              except Exception as ex:
                  import sys; print(f"gate failed: {ex}", file=sys.stderr)
          print(f"run={'true' if run else 'false'}")
          PY

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run != 'false'
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run != 'false'
        with:
          python-version: "3.12"

      - name: Syntax check
        if: steps.gate.outputs.run != 'false'
        run: |
          python -m py_compile news_scrape.py refresh.py fpl_common.py lab_audit.py league_tactics.py x_scrape.py wildcard_recommend.py fixtures_external.py understat.py ai_team.py stamp_versions.py

      - name: Pull live FPL data
        if: steps.gate.outputs.run != 'false'
        run: |
          python news_scrape.py
          python refresh.py
          python refresh.py --team 1360920 --out bacalhau-data.js
          python
          python wildcard_recommend.py bacalhau-wildcard.js
          python wildcard_recommend.py shaaland-wildcard.js

      - name: Commit data files if they changed
        if: steps.gate.outputs.run != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # X live ingest is Grok Bot / user-X MCP — never commit x-posts.js from Actions.
          # bacalhau-wildcard.js/shaaland-wildcard.js's squads (xi/bench) are
          # hand-captured from screenshots, but their "recommend" blocks are
          # fully computed here — Actions committing them just keeps that
          # recommendation current.
          python stamp_versions.py
          git add data.js bacalhau-data.js news.js bacalhau-wildcard.js shaaland-wildcard.js team_recovery_cache.json understat_cache.json index.html bacalhau.html
          if git diff --staged --quiet; then
            echo "No data change"
          else
            git commit -m "Refresh FPL data $(date -u +%Y-%m-%dT%H:%MZ)"
            WILD="bacalhau-wildcard.js shaaland-wildcard.js"
            for attempt in 1 2 3; do
              echo "push attempt $attempt/3"
              # If another refresh landed first, keep THIS run's generated data files
              # (data.js etc. are fully regenerated every run, so -X theirs — which in a
              # rebase means the commit being replayed, i.e. ours — is intended).
              if ! git pull --rebase -X theirs origin main; then
                git rebase --abort || true
                sleep $((attempt * 5)); continue
              fi
              # The two wildcard files are the exception: their xi/bench are hand-edited
              # on main, so take the REMOTE copy and recompute the generated blocks
              # (recommend, worth_tracker) from that squad instead of reverting the edit.
              git checkout origin/main -- $WILD
              python wildcard_recommend.py bacalhau-wildcard.js
              python wildcard_recommend.py shaaland-wildcard.js
              git add $WILD
              if ! git diff --staged --quiet; then
                git commit -m "Recompute wildcard recommendations on current squad"
              fi
              # Re-stamp against the rebased files so the asset versions always match what is pushed.
              python stamp_versions.py
              git add index.html bacalhau.html
              if ! git diff --staged --quiet; then
                git commit -m "Stamp asset versions"
              fi
              if git push origin main; then
                exit 0
              fi
              sleep $((attempt * 5))
            done
            echo "Push failed after 3 attempts"
            exit 1
          fi
