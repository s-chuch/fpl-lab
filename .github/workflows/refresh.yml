name: Refresh FPL data

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 20 * * *"
    - cron: "0 16 * * 6"
    - cron: "0 22 * * 6"
    - cron: "0 22 * * 0"
    # AI team lock window: fires every 30 minutes but the first step skips the run unless it falls
    # in the hour after "12h before the next gameweek deadline" (see ai_team.py LOCK_HOURS).
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "refresh.py"
      - "fplbase.py"
      - "chips.py"
      - "signals.py"
      - "ai_run.py"
      - "planner.py"
      - "fixture_swing.py"
      - "swing.js"
      - "elo.py"
      - "odds.py"
      - "calibration.json"
      - "live_update.py"
      - "fixtures_external.py"
      - "ai_team.py"
      - "ai_changes.py"
      - "understat.py"
      - "stamp_versions.py"
      - "fpl_common.py"
      - "dashboard-common.js"
      - "dashboard.css"
      - "plan-intel.js"
      - "fh.js"
      - "shaaland-wildcard.js"
      - "bacalhau-wildcard.js"
      - "index.html"
      - "bacalhau.html"
      - "news_scrape.py"
      - "check_data.py"
      - "tests/**"
      - "lab_audit.py"
      - "league_tactics.py"
      - "wildcard_recommend.py"
      - "rec_log.py"
      - ".github/workflows/refresh.yml"

concurrency:
  group: refresh-main
  # false: a push must not kill a scheduled run mid-step; runs queue per group.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A failing job emails the repo owner by default (GitHub notification), so no
    # extra alerting is wired up here.
    timeout-minutes: 20
    steps:
      # Always the tip of main: a queued run (or a push-triggered one) must not start from the commit that
      # triggered it - that would be older than data.js already on main and could undo carried state
      # (AI team lock, track record, price trend).
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Fast-forward to the latest main
        run: git pull --ff-only origin main

      - name: Gate the 30-minute AI-lock runs
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, json, re, sys, time, urllib.request
          from datetime import datetime, timedelta, timezone
          run = True
          if os.environ.get("EVENT") == "schedule" and os.environ.get("CRON") == "*/30 * * * *":
              # Stateless: run whenever the next deadline is within 12h and that gameweek's AI plan is not
              # locked yet. A late cron, a failed fetch or a skipped half-hour just means the next one does it.
              run = False
              events = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request("https://fantasy.premierleague.com/api/bootstrap-static/", headers={"User-Agent": "ShaalandFPLLab/1.0"})
                      events = json.load(urllib.request.urlopen(req, timeout=30))["events"]
                      break
                  except Exception as ex:
                      print(f"gate fetch {attempt + 1}/3 failed: {ex}", file=sys.stderr); time.sleep(3 * (attempt + 1))
              if events is None:
                  run = True                      # cannot tell: running is harmless, missing the lock is not
              else:
                  now = datetime.now(timezone.utc)
                  nxt = next((e for e in events if datetime.fromisoformat(e["deadline_time"].replace("Z", "+00:00")) > now), None)
                  if nxt:
                      dl = datetime.fromisoformat(nxt["deadline_time"].replace("Z", "+00:00"))
                      if dl - timedelta(hours=12) <= now:
                          locked = False
                          try:
                              raw = open("data.js").read()
                              plan = json.loads(raw[raw.index("{"): raw.rindex("}") + 1]).get("ai_team", {}).get("plan") or {}
                              locked = plan.get("gw") == nxt["id"] and bool(plan.get("locked"))
                          except Exception as ex:
                              print(f"gate: could not read data.js: {ex}", file=sys.stderr)
                          run = not locked
          print(f"run={'true' if run else 'false'}")
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run != 'false'
        with:
          python-version: "3.12"

      - name: Syntax check
        if: steps.gate.outputs.run != 'false'
        run: |
          python -m py_compile ai_changes.py news_llm.py news_scrape.py refresh.py fpl_common.py lab_audit.py league_tactics.py wildcard_recommend.py rec_log.py fixtures_external.py understat.py ai_team.py stamp_versions.py check_data.py fplbase.py chips.py signals.py ai_run.py planner.py live_update.py fixture_swing.py elo.py odds.py

      - name: Pull live FPL data
        id: pull
        if: steps.gate.outputs.run != 'false'
        env:
          # optional: with this repo secret the News tab gets a Claude summary per player (see news_llm.py)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # a broken news site must not stop the FPL data refresh (the news themes just stay as they were)
          python news_scrape.py || echo "::warning::news_scrape.py failed - keeping the previous news themes"
          # One failing builder must not throw away the others' output: record it, still commit, and fail the run at the end.
          failed=""
          python refresh.py || failed="$failed refresh.py"
          python refresh.py --team 1360920 --out bacalhau-data.js || failed="$failed refresh.py(bacalhau)"
          python wildcard_recommend.py bacalhau-wildcard.js || failed="$failed wildcard(bacalhau)"
          python wildcard_recommend.py shaaland-wildcard.js || failed="$failed wildcard(shaaland)"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Commit data files if they changed
        if: steps.gate.outputs.run != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # bacalhau-wildcard.js/shaaland-wildcard.js's squads (xi/bench) are
          # hand-captured from screenshots, but their "recommend" blocks are
          # fully computed here — Actions committing them just keeps that
          # recommendation current.
          python stamp_versions.py
          # Optional caches (written only when their source answered) may not exist: add only files that do, since
          # `git add` aborts on a missing pathspec and would commit nothing at all.
          for f in data.js bacalhau-data.js rec_log.json bacalhau-rec_log.json news.js news_seen.json elo_cache.json odds_cache.json bacalhau-wildcard.js shaaland-wildcard.js team_recovery_cache.json understat_cache.json index.html bacalhau.html; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "No data change"
          else
            git commit -m "Refresh FPL data $(date -u +%Y-%m-%dT%H:%MZ)"
            # Why this rebase looks odd: data.js etc. are fully regenerated every run, so on a conflict THIS run's files win (-X theirs).
            # The two wildcard files are the exception (hand-edited on main): take main's copy and recompute their generated blocks. See docs/decisions.md.
            WILD="bacalhau-wildcard.js shaaland-wildcard.js"
            for attempt in 1 2 3; do
              echo "push attempt $attempt/3"
              # If another refresh landed first, keep THIS run's generated data files
              # (data.js etc. are fully regenerated every run, so -X theirs — which in a
              # rebase means the commit being replayed, i.e. ours — is intended).
              if ! git pull --rebase -X theirs origin main; then
                git rebase --abort || true
                sleep $((attempt * 5)); continue
              fi
              # The two wildcard files are the exception: their xi/bench are hand-edited
              # on main, so take the REMOTE copy and recompute the generated blocks
              # (recommend, worth_tracker) from that squad instead of reverting the edit.
              git checkout origin/main -- $WILD
              python wildcard_recommend.py bacalhau-wildcard.js
              python wildcard_recommend.py shaaland-wildcard.js
              git add $WILD
              if ! git diff --staged --quiet; then
                git commit -m "Recompute wildcard recommendations on current squad"
              fi
              # Re-stamp against the rebased files so the asset versions always match what is pushed.
              python stamp_versions.py
              git add index.html bacalhau.html
              if ! git diff --staged --quiet; then
                git commit -m "Stamp asset versions"
              fi
              if git push origin main; then
                exit 0
              fi
              sleep $((attempt * 5))
            done
            echo "Push failed after 3 attempts"
            exit 1
          fi

      # Last on purpose: the data above is already committed, so a failure here turns the run red
      # (and emails you) without blocking the refresh.
      - name: Fail the run if a builder failed
        if: steps.gate.outputs.run != 'false' && steps.pull.outputs.failed != ''
        run: |
          echo "::error::failed: ${{ steps.pull.outputs.failed }}"
          exit 1

      - name: Sanity-check the generated data
        if: steps.gate.outputs.run != 'false'
        run: python check_data.py

      # After the commit on purpose: a red unit test emails you but never stops the data from refreshing.
      - name: Unit tests
        if: always() && steps.gate.outputs.run != 'false'
        run: python -m unittest discover -s tests
