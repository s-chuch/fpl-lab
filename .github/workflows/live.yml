name: Matchday live snapshot

# While matches are in play, write live-data.js (your squad's live points) every ~10 minutes. The script
# exits without writing anything when no gameweek is live, so the repo only changes on match days. Kick-off
# windows are generous on purpose (weekend afternoons/evenings, weekday evenings, UTC); a run outside a match
# costs a few seconds.
# PAUSED (by request): the schedule is switched off. To turn the live layer back on, restore the two cron lines below.
#   schedule:
#     - cron: "*/10 11-22 * * 0,6"
#     - cron: "*/10 18-22 * * 1,2,3,4,5"
on:
  workflow_dispatch:

concurrency:
  group: live-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write the live snapshot
        run: python live_update.py
      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-data.js
          if git diff --staged --quiet; then
            echo "No live change"
            exit 0
          fi
          git commit -m "Live snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin main && exit 0
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts"
          exit 1
