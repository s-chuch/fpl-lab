name: Matchday live snapshot

# GitHub throttles frequent crons (a */10 schedule fires about every 3 hours), so each run loops for ~45 minutes
# (snapshot every 3 minutes) and re-dispatches itself while a gameweek is live. While matches are in play, write live-data.js (your squad's live points) every ~10 minutes. The script
# exits without writing anything when no gameweek is live, so the repo only changes on match days. Kick-off
# windows are generous on purpose (weekend afternoons/evenings, weekday evenings, UTC); a run outside a match
# costs a few seconds.
on:
  schedule:
    - cron: "*/10 11-22 * * 0,6"
    - cron: "*/10 18-22 * * 1,2,3,4,5"
  workflow_dispatch:

concurrency:
  group: live-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restart the refresh if it has stopped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub throttles scheduled workflows; a stopped refresh is restarted from here (before any age check turns red)
          age=$(python -c 'import re,datetime as d;m=re.search(r"\"generated_at\":\s*\"(\d{4}-\d\d-\d\d \d\d:\d\d)",open("data.js").read(4000));print(int((d.datetime.utcnow()-d.datetime.strptime(m.group(1),"%Y-%m-%d %H:%M")).total_seconds()//3600) if m else 99)')
          echo "data.js is ${age}h old"
          if [ "$age" -ge 9 ]; then gh workflow run refresh.yml --ref main || echo "dispatch failed"; fi
      - name: Snapshot loop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          live=0
          for i in $(seq 1 15); do
            out=$(python live_update.py 2>&1); echo "$out"
            if echo "$out" | grep -q "no gameweek in play"; then live=0; break; fi
            live=1
            git add live-data.js
            if ! git diff --staged --quiet; then
              git commit -m "Live snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
              for attempt in 1 2 3; do
                git pull --rebase -X theirs origin main && git push origin main && break
                sleep $((attempt * 5))
              done
            fi
            sleep 180
          done
          if [ "$live" = "1" ]; then
            gh workflow run live.yml --ref main || echo "re-dispatch failed; the next cron will pick it up"
          fi
