name: fbref-fotmob-test
on:
  push:
    branches: [fbref-fotmob-test]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        shell: bash
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          get() {
            curl -s --compressed --max-time 30 -A "$UA" -H "Accept: application/json,text/html,*/*;q=0.8" \
              -H "Accept-Language: en-GB,en;q=0.9" -H "Referer: https://www.fotmob.com/" -o "$2" -w "HTTP %{http_code} ctype=%{content_type}\n" "$1"
          }
          for u in "https://www.fotmob.com/api/data/leagues?id=47&ccode3=GBR" \
                   "https://www.fotmob.com/api/leagues?id=47&ccode3=GBR&tab=stats" \
                   "https://www.fotmob.com/leagues/47/stats/premier-league/players/big_chance_created"; do
            echo "--- $u"; get "$u" /tmp/o.txt; echo "size: $(wc -c < /tmp/o.txt)"; head -c 300 /tmp/o.txt; echo
            grep -o '<title>[^<]*' /tmp/o.txt | head -1
            grep -o '"fetchAllUrl":"[^"]*"' /tmp/o.txt | head -40
            grep -o 'big_chance[a-z_]*' /tmp/o.txt | sort -u | head
            grep -o 'ontarget_scoring_att[a-z_]*' /tmp/o.txt | sort -u | head -3
            grep -o '"selectedSeason":"[^"]*"' /tmp/o.txt | head -2
            sleep 3
          done
